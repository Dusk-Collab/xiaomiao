<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E4">
<title>江南食府 · 点餐</title>
<style>
/* ============ 设计变量：宣纸 / 墨色 / 茶绿 / 少量朱砂 ============ */
:root{
  --paper:#F5F0E4;      /* 宣纸米白 */
  --paper-2:#FAF7EE;    /* 象牙白 */
  --paper-3:#EDE6D6;    /* 深一档米色 */
  --ink:#1F1C18;        /* 深墨 */
  --ink-2:#40392F;      /* 次墨 */
  --ink-3:#7A7264;      /* 辅助文字 */
  --tea:#6B7F5E;        /* 茶绿 */
  --tea-2:#557052;      /* 深茶绿 */
  --celadon:#8E9C9A;    /* 青灰 */
  --cinnabar:#A8382F;   /* 朱砂（仅少量强调） */
  --line:rgba(31,28,24,.10);
  --line-2:rgba(31,28,24,.06);
  --shadow:0 2px 10px rgba(31,28,24,.05);
  --song:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --tabbar-h:54px;
  --cartbar-h:60px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--ui); color:var(--ink); background:#E7E0D0;
  font-size:14px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
img{display:block}

#app{
  max-width:480px; margin:0 auto; min-height:100%;
  position:relative; display:flex; flex-direction:column;
  background:var(--paper);
  box-shadow:0 0 40px rgba(31,28,24,.08);
  /* 极淡宣纸纹理 */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.38 0 0 0 0 0.28 0 0 0 0.035 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

.main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--tabbar-h) + var(--cartbar-h) + 14px)}
.view{display:none}
.view.active{display:block}

/* ============ 顶部品牌区：江南庭院 ============ */
/* ============ 顶部品牌区：真实江南庭院图 ============ */
.brand{
  position:relative; padding:16px 16px 22px;
  color:#FDFAF3; overflow:hidden;
  /* 真实庭院图作背景，底部 60% 区域叠米白色保证文字可读 */
  background-color:#2A2622;
  background-image:url('jn_assets/courtyard.jpg');
  background-repeat:no-repeat;
  background-position:center 30%;
  background-size:cover;
  min-height:236px;
  display:flex; flex-direction:column;
}
.brand::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg,rgba(31,28,24,.28) 0%,rgba(31,28,24,.05) 36%,rgba(250,247,238,.18) 60%,rgba(250,247,238,.78) 92%,rgba(250,247,238,.92) 100%);
}.brand > *{position:relative; z-index:1}

.brand-top{display:flex; align-items:center; gap:6px; margin-bottom:auto}
.loc{display:flex; align-items:center; gap:3px; font-size:12px; color:rgba(251,248,240,.94); letter-spacing:.5px}
.loc svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.brand-more{
  margin-left:auto; width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center; background:rgba(31,28,24,.22);
  border:1px solid rgba(251,248,240,.28); backdrop-filter:blur(2px);
}
.brand-more svg{width:15px;height:15px;stroke:#FBF8F0;fill:none;stroke-width:2;stroke-linecap:round}

.brand-name{
  display:flex; align-items:flex-end; gap:9px;
}
.brand-name-txt{
  font-family:var(--song); font-size:32px; font-weight:700;
  letter-spacing:8px; line-height:1.1; color:#FDFAF3;
  text-shadow:0 2px 14px rgba(31,28,24,.55);
}
.brand-seal{
  display:inline-block; padding:2px 6px 3px;
  font-family:var(--song); font-size:12px; font-weight:700;
  letter-spacing:1.5px; color:#FBF8F0;
  border:1.5px solid #C9352B;
  background:rgba(168,56,47,.92);
  transform:rotate(-6deg); transform-origin:center;
  box-shadow:0 1px 4px rgba(168,56,47,.4);
  margin-bottom:4px;
}
.brand-sub{
  font-family:var(--song); font-size:12.5px; letter-spacing:3.4px;
  color:rgba(253,250,243,.86); margin-top:7px;
}
.brand-sub::before,.brand-sub::after{content:'·'; margin:0 6px; opacity:.6}
.brand-tags{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap}
.btag{
  font-size:10.5px; letter-spacing:.6px; padding:3px 8px; border-radius:2px;
  background:rgba(251,248,240,.16); border:1px solid rgba(251,248,240,.30);
  color:rgba(253,250,243,.92); backdrop-filter:blur(2px);
}
.btag.hot{background:rgba(168,56,47,.72); border-color:rgba(168,56,47,.9); color:#FFF6EE}

/* ============ 主宣传 Banner ============ */
.banner{
  margin:14px 16px 4px; border-radius:14px; overflow:hidden; position:relative;
  background:var(--paper-2); border:1px solid rgba(31,28,24,.09);
  box-shadow:0 3px 14px rgba(31,28,24,.055);
  display:flex; align-items:stretch; min-height:112px;
}
.banner::before{ /* 宣纸纹理 */
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='1'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.36 0 0 0 0 0.26 0 0 0 0.05 0'/></filter><rect width='120' height='120' filter='url(%23b)'/></svg>");
}
.banner-txt{position:relative; z-index:1; padding:15px 12px 14px 16px; flex:1 1 auto; min-width:0}
.banner-t1{
  font-family:var(--song); font-size:15px; font-weight:700; letter-spacing:.5px;
  color:var(--ink); line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.banner-dots{
  display:flex; justify-content:center; gap:5px; padding:7px 0 0;
}
.banner-dots .dot{
  width:5px; height:5px; border-radius:50%; background:rgba(31,28,24,.18);
  transition:width .25s,background .25s;
}
.banner-dots .dot.on{width:14px; background:var(--cinnabar); border-radius:3px}

.banner-dots{
  display:flex; justify-content:center; gap:5px; padding:7px 0 0;
}
.banner-dots .dot{
  width:5px; height:5px; border-radius:50%; background:rgba(31,28,24,.18);
  transition:width .25s,background .25s;
}
.banner-dots .dot.on{width:14px; background:var(--cinnabar); border-radius:3px}

.banner-dots{
  display:flex; justify-content:center; gap:5px; padding:7px 0 0;
}
.banner-dots .dot{
  width:5px; height:5px; border-radius:50%; background:rgba(31,28,24,.18);
  transition:width .25s,background .25s;
}
.banner-dots .dot.on{width:14px; background:var(--cinnabar); border-radius:3px}
.banner-t2{font-size:11px; color:var(--ink-3); letter-spacing:.4px; margin-top:7px}
.banner-btn{
  margin-top:13px; display:inline-flex; align-items:center; gap:4px;
  font-size:12px; letter-spacing:1px; color:#FBF8F0; font-weight:600;
  padding:7px 14px 7px 15px; border-radius:18px;
  background:var(--cinnabar); border:1px solid rgba(95,21,16,.4);
  box-shadow:0 2px 8px rgba(168,56,47,.28);
}
.banner-art{
  position:relative; z-index:1; flex:0 0 108px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 132 112' preserveAspectRatio='xMidYMax slice'><defs><linearGradient id='m' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%234A4A42' stop-opacity='.62'/><stop offset='1' stop-color='%234A4A42' stop-opacity='.14'/></linearGradient></defs><circle cx='96' cy='26' r='15' fill='%23D9C9A8' opacity='.55'/><path d='M0 52 Q22 32 44 48 Q66 26 92 44 Q114 32 132 42 L132 112 L0 112 Z' fill='url(%23m)'/><path d='M0 70 Q28 58 56 70 Q84 56 112 70 Q124 64 132 68 L132 112 L0 112 Z' fill='%234A4A42' opacity='.13'/><g stroke='%234A4A42' stroke-width='.7' fill='none' opacity='.34'><path d='M8 82 q12 -3 24 0 t24 0 t24 0 t24 0'/><path d='M4 92 q16 -3 32 0 t32 0 t32 0'/><path d='M10 102 q14 -2.5 28 0 t28 0 t28 0'/></g><g fill='%23231F1A' opacity='.8'><path d='M44 74 L74 74 L69 71 L79 67 L69 63 L74 60 L44 60 Z'/><path d='M74 60 L82 71 L74 72 Z'/><line x1='56' y1='60' x2='62' y2='46' stroke='%23231F1A' stroke-width='1'/></g><g fill='none' stroke='%23231F1A' stroke-width='.9' opacity='.5'><path d='M96 66 q6 -5 12 0 q-6 -2 -12 0 Z'/><path d='M106 56 q5 -4 10 0 q-5 -1.6 -10 0 Z'/></g><g stroke='%236B7F5E' stroke-width='1.6' opacity='.55'><path d='M124 112 L120 76'/></g><g fill='%236B7F5E' opacity='.5'><ellipse cx='120' cy='70' rx='11' ry='3.6' transform='rotate(-30 120 70)'/><ellipse cx='123' cy='84' rx='10' ry='3.2' transform='rotate(-22 123 84)'/><ellipse cx='116' cy='58' rx='9' ry='3' transform='rotate(-14 116 58)'/></g><g stroke='%23231F1A' stroke-width='1' opacity='.38'><path d='M8 40 q14 -10 28 0'/><path d='M14 46 q4 -6 8 -8'/></g></svg>") no-repeat center bottom / cover;
}

/* ============ 分类 + 菜品 ============ */
.cd-wrap{display:flex; margin-top:12px; border-top:1px solid var(--line-2); min-height:60vh}
.cats{
  flex:0 0 88px; background:var(--paper-3); border-right:1px solid var(--line-2);
  align-self:flex-start; position:sticky; top:0;
}
.cat{
  position:relative; padding:14px 6px 14px 12px; font-size:13px; color:var(--ink-2);
  letter-spacing:.6px; transition:background .18s,color .18s; text-align:left; width:100%;
  display:flex; align-items:center; gap:6px;
}
.cat-ic{width:18px; height:18px; flex:none; opacity:.62; transition:opacity .18s,color .18s}
.cat-ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cat.on .cat-ic{opacity:1}
.cat-n{flex:1; text-align:left}
.cat + .cat{border-top:1px solid var(--line-2)}
.cat::before{ /* 选中竖线 */
  content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:3px; height:0; background:var(--cinnabar); border-radius:0 2px 2px 0; transition:height .2s;
}
.cat.on{background:var(--paper-2); color:var(--ink); font-weight:600}
.cat.on::before{height:20px}
.cat-seal{ /* 选中后右上角小印章 */
  position:absolute; right:7px; top:50%; transform:translateY(-50%) scale(0);
  width:16px; height:16px; border-radius:2px; border:1px solid var(--cinnabar);
  color:var(--cinnabar); font-family:var(--song); font-size:9px; font-weight:700;
  display:grid; place-items:center; opacity:.85; transition:transform .2s;
}
.cat.on .cat-seal{transform:translateY(-50%) scale(1)}

.goods{flex:1; min-width:0; padding:4px 12px 20px; background:var(--paper)}
.sec-head{
  display:flex; align-items:center; gap:7px; padding:10px 2px 8px;
  font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:1.6px; color:var(--ink);
}
.sec-head::before{content:''; width:3px; height:13px; background:var(--tea); border-radius:2px}
.sec-head .cnt{margin-left:auto; font-family:var(--ui); font-size:11px; font-weight:400; color:var(--ink-3); letter-spacing:0}

.dish{
  display:flex; gap:11px; padding:11px; margin-bottom:9px;
  background:var(--paper-2); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow);
}
.dish-pic{
  flex:0 0 78px; width:78px; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
  background:var(--paper-3); position:relative;
}
.dish-pic img{width:100%; height:100%; object-fit:cover; display:block; object-position:center 85%}
.dish-pic .tag{
  position:absolute; left:0; top:0; font-size:9px; letter-spacing:.5px;
  background:var(--cinnabar); color:#FFF6EE; padding:2px 5px; border-radius:8px 0 8px 0;
}
.dish-info{flex:1; min-width:0; display:flex; flex-direction:column}
.dish-name{
  font-family:var(--song); font-size:15px; font-weight:700; color:var(--ink);
  letter-spacing:.5px; line-height:1.3;
}
.dish-desc{
  font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.dish-sold{font-size:10.5px; color:var(--celadon); margin-top:4px; letter-spacing:.3px}
.dish-bot{margin-top:auto; padding-top:7px; display:flex; align-items:flex-end; gap:8px}
.price{font-family:var(--song); color:var(--ink); font-weight:700; letter-spacing:.3px; line-height:1}
.price .cur{font-size:12px; margin-right:1px}
.price .num{font-size:19px; font-variant-numeric:tabular-nums}
.price .unit{font-size:10.5px; color:var(--ink-3); font-weight:400; margin-left:2px; letter-spacing:0}
.qty{margin-left:auto; display:flex; align-items:center; gap:9px; min-height:26px}
.qty-btn{
  width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  transition:transform .12s;
}
.qty-btn:active{transform:scale(.88)}
.qty-btn svg{width:13px;height:13px;stroke-width:2.4;stroke-linecap:round;fill:none}
.qty-plus{background:var(--tea); box-shadow:0 2px 6px rgba(107,127,94,.3)}
.qty-plus svg{stroke:#FBF8F0}
.qty-minus{background:transparent; border:1px solid rgba(31,28,24,.22)}
.qty-minus svg{stroke:var(--ink-2)}
.qty-num{
  font-size:14px; font-weight:700; color:var(--ink); min-width:12px; text-align:center;
  font-variant-numeric:tabular-nums;
}
.qty[data-zero="1"] .qty-minus,.qty[data-zero="1"] .qty-num{display:none}

/* ============ 底部购物车条 ============ */
.cartbar{
  position:fixed; bottom:var(--tabbar-h); left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:var(--cartbar-h); z-index:40;
  display:flex; align-items:center; gap:12px; padding:0 12px 0 16px;
  background:rgba(250,247,238,.97); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); box-shadow:0 -3px 14px rgba(31,28,24,.06);
}
.cart-ico{
  position:relative; width:44px; height:44px; border-radius:50%; flex:none;
  background:var(--tea); display:grid; place-items:center;
  box-shadow:0 3px 10px rgba(107,127,94,.28); transition:transform .15s;
}
.cart-ico:active{transform:scale(.94)}
.cart-ico svg{width:28px;height:28px;display:block;margin:0 auto}
.cart-badge{
  position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--cinnabar); color:#FFF6EE;
  font-size:10.5px; font-weight:700; display:grid; place-items:center;
  border:1.5px solid var(--paper-2); transform:scale(0); transition:transform .2s;
}
.cart-badge.show{transform:scale(1)}
.cart-mid{flex:1; min-width:0}
.cart-total{font-family:var(--song); font-size:19px; font-weight:700; color:var(--ink); line-height:1.15; font-variant-numeric:tabular-nums}
.cart-total .cur{font-size:12px}
.cart-fee{font-size:10.5px; color:var(--ink-3); margin-top:2px; letter-spacing:.2px}
.cart-go{
  flex:none; padding:11px 22px; border-radius:22px; font-size:14px; letter-spacing:1.4px;
  font-weight:600; background:var(--cinnabar); color:#FBF8F0;
  box-shadow:0 3px 10px rgba(168,56,47,.30); transition:opacity .2s,transform .12s;
}
.cart-go:active{transform:scale(.97)}
.cart-go.dis{background:var(--celadon); box-shadow:none; opacity:.55; pointer-events:none}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:var(--tabbar-h); z-index:50;
  display:flex; background:rgba(250,247,238,.98); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--ink-3); transition:color .18s; position:relative;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px; letter-spacing:.5px}
.tab.on{color:var(--cinnabar)}
.tab.on svg{stroke-width:1.9}
.tab .dot{
  position:absolute; top:6px; right:calc(50% - 15px); min-width:15px; height:15px; padding:0 4px;
  border-radius:8px; background:var(--cinnabar); color:#FFF6EE; font-size:9.5px; font-weight:700;
  display:grid; place-items:center; transform:scale(0); transition:transform .2s;
}
.tab .dot.show{transform:scale(1)}

/* ============ 弹层 / 结算 ============ */
.mask{
  position:fixed; inset:0; z-index:60; background:rgba(31,28,24,.42);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.mask.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; transform:translateX(-50%) translateY(100%);
  bottom:0; width:100%; max-width:480px; z-index:61;
  background:var(--paper-2); border-radius:16px 16px 0 0;
  padding:6px 0 calc(var(--tabbar-h) + 10px); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:76vh; display:flex; flex-direction:column;
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-bar{width:34px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 4px; flex:none}
.sheet-head{
  display:flex; align-items:center; padding:8px 16px 12px; border-bottom:1px solid var(--line-2); flex:none;
}
.sheet-title{font-family:var(--song); font-size:16px; font-weight:700; letter-spacing:1.6px}
.sheet-clear{margin-left:auto; font-size:12px; color:var(--ink-3); letter-spacing:.6px; display:flex; align-items:center; gap:3px}
.sheet-clear svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.sheet-body{flex:1; overflow-y:auto; padding:6px 16px 10px}
.ci{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-2)}
.ci:last-child{border-bottom:none}
.ci-pic{flex:0 0 46px; width:46px; height:46px; border-radius:7px; overflow:hidden; background:var(--paper-3)}
.ci-pic img{width:100%;height:100%;object-fit:cover;object-position:center 85%}
.ci-info{flex:1; min-width:0}
.ci-name{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:.4px}
.ci-sub{font-size:11px; color:var(--ink-3); margin-top:3px; font-variant-numeric:tabular-nums}
.ci-right{margin-left:auto; display:flex; align-items:center; gap:8px}

/* 结算页 */
.co{
  position:fixed; inset:0; z-index:70; background:var(--paper);
  max-width:480px; left:50%; transform:translateX(-50%) translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
}
.co.show{transform:translateX(-50%) translateY(0)}
.co-head{
  flex:none; display:flex; align-items:center; gap:10px; padding:16px 16px 12px;
  border-bottom:1px solid var(--line-2); background:var(--paper-2);
}
.co-back{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.co-back svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.co-title{font-family:var(--song); font-size:17px; font-weight:700; letter-spacing:2px}
.co-body{flex:1; overflow-y:auto; padding:14px 16px calc(var(--tabbar-h) + 20px)}
.block{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:11px; box-shadow:var(--shadow)}
.block-t{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:1.4px; margin-bottom:11px; display:flex; align-items:center; gap:7px}
.block-t::before{content:''; width:3px; height:12px; background:var(--tea); border-radius:2px}
.modes{display:flex; gap:9px}
.mode{
  flex:1; border:1px solid var(--line); border-radius:9px; padding:11px 8px; text-align:center;
  background:var(--paper); transition:all .18s;
}
.mode.on{border-color:var(--tea); background:rgba(107,127,94,.08)}
.mode-ic{width:26px;height:26px;margin:0 auto 6px;display:grid;place-items:center}
.mode-ic svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mode.on .mode-ic svg{stroke:var(--tea-2)}
.mode-n{font-size:12.5px; letter-spacing:.6px; color:var(--ink-2)}
.mode.on .mode-n{color:var(--tea-2); font-weight:600}
.mode-d{font-size:10px; color:var(--ink-3); margin-top:2px}
.row{display:flex; align-items:center; padding:7px 0; font-size:13px}
.row .k{color:var(--ink-2)}
.row .v{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink)}
.row.sum{border-top:1px solid var(--line); margin-top:6px; padding-top:11px}
.row.sum .k{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:1px}
.row.sum .v{font-family:var(--song); font-size:20px; font-weight:700; color:var(--cinnabar)}
.co-foot{
  flex:none; position:absolute; bottom:0; left:0; right:0;
  display:flex; align-items:center; gap:12px; padding:11px 16px calc(11px + env(safe-area-inset-bottom));

}
.co-foot .t{flex:1}
.co-foot .t1{font-family:var(--song); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.co-foot .t2{font-size:10.5px; color:var(--ink-3); margin-top:1px}
.co-submit{

  font-size:15px; font-weight:600; letter-spacing:2px; box-shadow:0 3px 12px rgba(107,127,94,.3);
  transition:transform .12s;
}
.co-submit:active{transform:scale(.97)}

.done{
  position:fixed; inset:0; z-index:80; background:var(--paper);
  max-width:480px; left:50%; transform:translateX(-50%);

}
.done.show{display:flex}
.done-seal{
  width:74px; height:74px; border-radius:6px; border:2.5px solid var(--cinnabar);
  color:var(--cinnabar); font-family:var(--song); font-size:38px; font-weight:700;
  display:grid; place-items:center; transform:rotate(-7deg); opacity:.9; margin-bottom:20px;
}
.done-t{font-family:var(--song); font-size:21px; font-weight:700; letter-spacing:3px}
.done-s{font-size:12.5px; color:var(--ink-3); margin-top:9px; letter-spacing:.6px}
.done-code{

.done-code .l{font-size:10.5px; color:var(--ink-3); letter-spacing:1.6px}
.done-code .c{font-family:var(--song); font-size:32px; font-weight:700; letter-spacing:5px; margin-top:5px}
.done-btn{

  {id:'m3', cat:'staple', name:'手工小笼包', desc:'皮薄汁多，鲜香四溢', price:20, unit:'份', sold:1340, img:'', tag:'热卖'},
  // 小吃
  {id:'k1', cat:'snack', name:'蟹粉小笼', desc:'汤汁浓郁，蟹香扑鼻', price:32, unit:'笼', sold:655, img:''},
  {id:'k2', cat:'snack', name:'芝麻汤圆', desc:'软糯香甜，团圆美满', price:14, unit:'份', sold:344, img:''},
  {id:'k3', cat:'snack', name:'桂花糕', desc:'细腻清甜，回味悠长', price:12, unit:'份', sold:521, img:''},
  // 饮品
  {id:'b1', cat:'drink', name:'明前龙井', desc:'清香回甘，茶汤澄澈', price:18, unit:'杯', sold:977, img:''},
  {id:'b2', cat:'drink', name:'桂花酒酿', desc:'温润香甜，暖身养胃', price:16, unit:'杯', sold:412, img:''},
  {id:'b3', cat:'drink', name:'鲜榨甘蔗汁', desc:'清甜爽口，天然解腻', price:15, unit:'杯', sold:263, img:''}
];

var DELIVERY_FEE = 3;

/* ==================== 宣纸占位图 ==================== */
var PAL = ['#E9E0CB','#E4DCC9','#DDE4D3','#EADCCF','#DCE1DE','#EAE2CE','#E2E5D5','#EDE3CE'];
var INKPAL = ['#6E6152','#5F6B52','#7A6552','#55604F','#6B5F4E'];

function dishImg(name, seed){
  var bg = PAL[seed % PAL.length];
  var ink = INKPAL[seed % INKPAL.length];
  var ch = (name.match(/[一-龥]/g) || ['菜']).slice(0,1)[0];
  var svg =
    "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>" +
      "<rect width='200' height='200' fill='" + bg + "'/>" +
      "<g fill='none' stroke='" + ink + "' stroke-width='1.4' opacity='.26'>" +
        "<path d='M0 148 Q40 128 78 146 Q118 122 158 144 Q180 134 200 142'/>" +
        "<path d='M0 162 Q46 150 92 162 Q138 150 184 162 Q194 158 200 160'/>" +
      "</g>" +
      "<g stroke='" + ink + "' stroke-width='2' fill='none' opacity='.22'>" +
        "<path d='M176 200 L170 122'/><path d='M170 140 q-14 -8 -26 -4'/><path d='M172 160 q14 -7 26 -3'/>" +
      "</g>" +
      "<circle cx='34' cy='38' r='15' fill='" + ink + "' opacity='.12'/>" +
      "<text x='100' y='118' font-size='74' font-family='Songti SC,STSong,SimSun,serif' " +
        "font-weight='700' fill='" + ink + "' opacity='.80' text-anchor='middle'>" + ch + "</text>" +
    "</svg>";
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
DISHES.forEach(function(d, i){ d._img = dishImg(d.name, i); d._src = d.img || d._img; });

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ==================== 状态 ==================== */
var state = {
  cat: 'rec',
  cart: {},                 // id -> qty
  view: 'home',
  mode: 'pickup'            // pickup | delivery
};

function dishOf(id){ for (var i=0;i<DISHES.length;i++) if (DISHES[i].id === id) return DISHES[i]; return null; }
function cartList(){
  var out = [];
  for (var id in state.cart){
    var d = dishOf(id);
    if (d && state.cart[id] > 0) out.push({d: d, q: state.cart[id]});
  }
  return out;
}
function subtotal(){
  var s = 0; var l = cartList();
  for (var i=0;i<l.length;i++) s += l[i].d.price * l[i].q;
  return s;
}
function fee(){ return state.mode === 'delivery' && subtotal() > 0 ? DELIVERY_FEE : 0; }
function total(){ return subtotal() + fee(); }
function count(){
  var n = 0; var l = cartList();
  for (var i=0;i<l.length;i++) n += l[i].q;
  return n;
}
function fmt(n){ return (Math.round(n*100)/100).toString(); }

/* ==================== 渲染 ==================== */
var PLUS = '<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
var MINUS = '<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>';

function catHTML(){
  var h = '<div class="cd-wrap"><div class="cats">';
  CATS.forEach(function(c){
    h += '<button class="cat' + (c.id === state.cat ? ' on' : '') + '" data-cat="' + c.id + '">'
       + '<span class="cat-ic">' + c.icon + '</span>'
       + '<span class="cat-n">' + esc(c.name) + '</span>'
       + (c.id === state.cat ? '<span class="cat-seal">' + esc(c.seal) + '</span>' : '')
       + '</button>';
  });
  h += '</div><div class="goods">';
  var cur = CATS.filter(function(c){ return c.id === state.cat; })[0];
  var list = DISHES.filter(function(d){ return d.cat === state.cat; });
  h += '<div class="sec-head">' + esc(cur ? cur.name : '') + '<span class="cnt">' + list.length + ' 道</span></div>';
  list.forEach(function(d){
    var q = state.cart[d.id] || 0;
    h += '<div class="dish">'
       +   '<div class="dish-pic"><img src="' + d._src + '" alt="' + esc(d.name) + '" loading="lazy">'
       +     (d.tag ? '<span class="tag">' + esc(d.tag) + '</span>' : '')
       +   '</div>'
       +   '<div class="dish-info">'
       +     '<div class="dish-name">' + esc(d.name) + '</div>'
       +     '<div class="dish-desc">' + esc(d.desc) + '</div>'
       +     '<div class="dish-sold">月售 ' + d.sold + '</div>'
       +     '<div class="dish-bot">'
       +       '<div class="price"><span class="cur">¥</span><span class="num">' + fmt(d.price) + '</span>'
       +         '<span class="unit">/' + esc(d.unit) + '</span></div>'
       +       '<div class="qty" data-zero="' + (q > 0 ? '0' : '1') + '">'
       +         '<button class="qty-btn qty-minus" data-act="minus" data-id="' + d.id + '">' + MINUS + '</button>'
       +         '<span class="qty-num">' + q + '</span>'
       +         '<button class="qty-btn qty-plus" data-act="plus" data-id="' + d.id + '">' + PLUS + '</button>'
       +       '</div>'
       +     '</div>'
       +   '</div>'
       + '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderDishes(){
  document.getElementById('cdHome').innerHTML = catHTML();
  document.getElementById('cdOrder').innerHTML = catHTML();
}

function renderCartBar(){
  var n = count(), t = subtotal(), f = fee();
  document.getElementById('cartTotal').textContent = fmt(t);
  document.getElementById('cartFee').textContent = f > 0 ? ('含配送费 ¥' + fmt(f)) : '另需配送费 ¥' + fmt(DELIVERY_FEE);
  var badge = document.getElementById('cartBadge');
  badge.textContent = n; badge.classList.toggle('show', n > 0);
  var dot = document.getElementById('tabDot');
  dot.textContent = n; dot.classList.toggle('show', n > 0);
  document.getElementById('cartGo').classList.toggle('dis', n === 0);
}

function renderSheet(){
  var l = cartList();
  var h = '';
  if (!l.length){
    h = '<div class="empty"><div class="empty-t">购物车是空的</div>'
      + '<div class="empty-s">挑几道江南好菜吧</div></div>';
  } else {
    l.forEach(function(it){
      h += '<div class="ci">'
         +   '<div class="ci-pic"><img src="' + it.d._src + '" alt=""></div>'
         +   '<div class="ci-info">'
         +     '<div class="ci-name">' + esc(it.d.name) + '</div>'
         +     '<div class="ci-sub">¥' + fmt(it.d.price) + ' × ' + it.q + '　小计 ¥' + fmt(it.d.price * it.q) + '</div>'
         +   '</div>'
         +   '<div class="ci-right">'
         +     '<div class="qty" data-zero="0">'
         +       '<button class="qty-btn qty-minus" data-act="minus" data-id="' + it.d.id + '">' + MINUS + '</button>'
         +       '<span class="qty-num">' + it.q + '</span>'
         +       '<button class="qty-btn qty-plus" data-act="plus" data-id="' + it.d.id + '">' + PLUS + '</button>'
         +     '</div>'
         +   '</div>'
         + '</div>';
    });
  }
  document.getElementById('sheetBody').innerHTML = h;
}

function renderCheckout(){
  var l = cartList(), h = '';
  l.forEach(function(it){
    h += '<div class="ci">'
       +   '<div class="ci-pic"><img src="' + it.d._src + '" alt=""></div>'
       +   '<div class="ci-info">'
       +     '<div class="ci-name">' + esc(it.d.name) + '</div>'
       +     '<div class="ci-sub">¥' + fmt(it.d.price) + ' × ' + it.q + '</div>'
       +   '</div>'
       +   '<div class="ci-right"><div class="price"><span class="cur">¥</span>'
       +     '<span class="num" style="font-size:15px">' + fmt(it.d.price * it.q) + '</span></div></div>'
       + '</div>';
  });
  document.getElementById('coList').innerHTML = h || '<div style="font-size:12px;color:var(--ink-3);padding:6px 0">暂无菜品</div>';
  var f = fee();
  document.getElementById('coSub').textContent = '¥' + fmt(subtotal());
  document.getElementById('coFee').textContent = f > 0 ? ('¥' + fmt(f)) : '免配送费';
  document.getElementById('coSum').textContent = '¥' + fmt(total());
  document.getElementById('coFootTotal').textContent = '¥' + fmt(total());
  document.getElementById('coFootFee').textContent = f > 0 ? ('含配送费 ¥' + fmt(f)) : '已免配送费';
}

function renderAll(){ renderDishes(); renderCartBar(); renderSheet(); renderCheckout(); }

/* ==================== 交互 ==================== */
function setQty(id, delta){
  var q = (state.cart[id] || 0) + delta;
  if (q <= 0) delete state.cart[id]; else state.cart[id] = q;
  renderAll();
}

document.addEventListener('click', function(e){
  // 分类
  var cat = e.target.closest('.cat');
  if (cat){
    state.cat = cat.dataset.cat;
    renderDishes();
    var wrap = cat.closest('.cd-wrap');
    var goods = wrap ? wrap.querySelector('.goods') : null;
    if (goods) goods.scrollIntoView({block:'nearest'});
    return;
  }
  // 加减
  var qbtn = e.target.closest('.qty-btn');
  if (qbtn){
    e.stopPropagation();
    setQty(qbtn.dataset.id, qbtn.dataset.act === 'plus' ? 1 : -1);
    return;
  }
});

// 底部导航
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
  t.addEventListener('click', function(){
    var v = t.dataset.view;
    if (v === 'cart'){
      if (count() === 0){ renderSheet(); openSheet(); return; }
      renderSheet(); openSheet(); return;
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
    if (v !== 'cart') t.classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){ x.classList.remove('active'); });
    document.getElementById('view-' + v).classList.add('active');
    document.querySelector('.main').scrollTop = 0;
  });
});

// 购物车弹层
var sheet = document.getElementById('sheet'), sheetMask = document.getElementById('sheetMask');
function openSheet(){ renderSheet(); sheet.classList.add('show'); sheetMask.classList.add('show'); }
function closeSheet(){ sheet.classList.remove('show'); sheetMask.classList.remove('show'); }
document.getElementById('cartIco').addEventListener('click', openSheet);
sheetMask.addEventListener('click', closeSheet);
document.getElementById('clearCart').addEventListener('click', function(){
  state.cart = {}; renderAll(); closeSheet();
});

// 结算
var co = document.getElementById('co');
document.getElementById('cartGo').addEventListener('click', function(){
  if (count() === 0) return;
  renderCheckout(); closeSheet(); co.classList.add('show');
});
document.getElementById('coBack').addEventListener('click', function(){ co.classList.remove('show'); });
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(m){
  m.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(x){ x.classList.remove('on'); });
    m.classList.add('on');
    state.mode = m.dataset.mode;
    renderCartBar(); renderCheckout();
  });
});

// 提交订单
var seq = 0;
document.getElementById('coSubmit').addEventListener('click', function(){
  if (count() === 0) return;
  seq++;
  document.getElementById('doneCode').textContent = 'A' + ('00' + seq).slice(-3);
  state.cart = {};
  renderAll();
  co.classList.remove('show');
  document.getElementById('done').classList.add('show');
});
document.getElementById('doneBack').addEventListener('click', function(){
  document.getElementById('done').classList.remove('show');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
  document.querySelector('.tab[data-view="order"]').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){ x.classList.remove('active'); });
  document.getElementById('view-order').classList.add('active');
  document.querySelector('.main').scrollTop = 0;
});

// banner 按钮
document.querySelector('.banner-btn').addEventListener('click', function(){
  alert('江南食府 · 上城区中山中路 128 号\n营业时间 10:30 - 21:00\n庭院包厢 8 间，可提前预订');
});
document.querySelector('.brand-more').addEventListener('click', function(){
  alert('更多：店铺介绍 / 包厢预订 / 联系商家');
});

renderAll();
</script>
</body>
</html>
