<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>选择收货地址</title>
<style>
:root{
  --brand:#07C160; --brand-d:#06A050; --brand-soft:#E8F8EF;
  --bg:#F4F6F5; --card:#fff; --ink:#1A1A1A; --ink-2:#5A6066; --ink-3:#9AA1A8;
  --line:#ECEEF0; --sh-s:0 1px 4px rgba(0,0,0,.05); --sh-m:0 4px 18px rgba(0,0,0,.08);
  --r-l:18px; --r-m:14px; --r-s:10px; --blue:#2176FF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;overflow-x:hidden;padding-bottom:84px;-webkit-font-smoothing:antialiased}

/* 顶部导航 */
.nav{position:sticky;top:0;z-index:30;background:#fff;height:52px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line)}
.nav-back{width:40px;height:40px;display:grid;place-items:center;font-size:24px;color:var(--ink);cursor:pointer;flex:none}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:700}
.nav-add{font-size:13px;font-weight:700;color:var(--brand);padding:8px 12px;cursor:pointer;flex:none}

/* 地图区 */
.map-wrap{position:relative;height:40vh;min-height:300px;background:#E9EEF1;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 12px;border-radius:999px;z-index:5;pointer-events:none;white-space:nowrap}
.map-ctrl{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:6}
.m-btn{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--sh-m);display:grid;place-items:center;font-size:22px;color:var(--ink-2);cursor:pointer;border:0}
.m-btn:active{background:#f3f3f3}
.m-btn.loc{color:var(--brand)}

/* 当前位置卡片（叠在地图底部） */
.loc-card{position:relative;z-index:10;margin:-18px 12px 0;background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-m);padding:14px 14px;display:flex;align-items:flex-start;gap:12px}
.loc-pin{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:18px;flex:none;margin-top:2px}
.loc-body{flex:1;min-width:0}
.loc-label{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.loc-addr{font-size:16px;font-weight:700;color:var(--ink);line-height:1.35;word-break:break-all}
.loc-status{font-size:12px;color:var(--brand);margin-top:4px;min-height:16px}
.loc-relocate{flex:none;font-size:13px;font-weight:700;color:var(--brand);padding:6px 4px;cursor:pointer;align-self:center}

/* 搜索 */
.search-bar{margin:14px 12px 0;background:#fff;border-radius:var(--r-m);box-shadow:var(--sh-s);display:flex;align-items:center;gap:8px;padding:11px 14px}
.search-bar .ico{font-size:16px;color:var(--ink-3);flex:none}
.search-bar input{flex:1;border:0;outline:none;font-size:15px;background:transparent;color:var(--ink)}
.search-bar input::placeholder{color:var(--ink-3)}
.search-bar .go{font-size:13px;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;flex:none}
.search-bar .go:active{background:var(--brand-d)}

/* 搜索结果 */
.results{margin:10px 12px 0;display:none}
.results.show{display:block}
.res-item{background:#fff;border-radius:var(--r-m);box-shadow:var(--sh-s);padding:13px 14px;margin-bottom:8px;cursor:pointer}
.res-item:active{background:#f7faf8}
.res-name{font-size:15px;font-weight:600;color:var(--ink)}
.res-name b{color:var(--brand)}
.res-addr{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.res-dist{font-size:11px;color:var(--brand);margin-top:3px}

/* 表单 */
.form-card{margin:14px 12px 0;background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-m);padding:6px 16px 16px}
.form-title{font-size:16px;font-weight:800;padding:14px 0 6px}
.field{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.field:last-of-type{border-bottom:0}
.field>label{width:64px;flex:none;font-size:14px;color:var(--ink-2);font-weight:600}
.field .region{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.field .region.empty{color:var(--ink-3);font-weight:500}
.field input{flex:1;border:0;outline:none;font-size:15px;background:transparent;color:var(--ink);min-width:0}
.field input::placeholder{color:var(--ink-3)}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:13px;padding:7px 16px;border-radius:999px;background:#F2F4F3;color:var(--ink-2);cursor:pointer;border:1.5px solid transparent;font-weight:600}
.tag.active{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}

/* 底部保存 */
.fix-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#fff 70%,rgba(255,255,255,0));z-index:20;display:flex;gap:10px}
.btn-save{flex:1;height:50px;border:0;border-radius:var(--r-s);background:var(--brand);color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(7,193,96,.32)}
.btn-save:active{background:var(--brand-d)}

/* 加载遮罩 */
.cover{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:90;place-items:center}
.cover.show{display:grid}
.cover .sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.cover .msg{font-size:14px;color:var(--ink-2);text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-back" onclick="goBack()">‹</div>
  <div class="nav-title">选择收货地址</div>
  <div class="nav-add" onclick="newAddress()">新增地址</div>
</div>

<div class="map-wrap" id="mapWrap">
  <canvas id="map"></canvas>
  <div class="map-hint" id="mapHint">拖动地图，可微调收货位置</div>
  <div class="map-ctrl">
    <button class="m-btn" onclick="zoomIn()">＋</button>
    <button class="m-btn" onclick="zoomOut()">－</button>
    <button class="m-btn loc" onclick="reLocate()" title="回到我的位置">⊙</button>
  </div>
</div>

<div class="loc-card">
  <div class="loc-pin">📍</div>
  <div class="loc-body">
    <div class="loc-label">当前位置</div>
    <div class="loc-addr" id="locAddr">正在获取位置…</div>
    <div class="loc-status" id="locStatus"></div>
  </div>
  <div class="loc-relocate" onclick="reLocate()">重新定位</div>
</div>

<div class="search-bar">
  <span class="ico">🔍</span>
  <input id="searchInput" placeholder="请输入小区、写字楼、学校名称" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')doSearch()">
  <button class="go" onclick="doSearch()">搜索</button>
</div>

<div class="results" id="results"></div>

<div class="form-card" id="formSection">
  <div class="form-title">填写收货信息</div>
  <div class="field">
    <label>所在地区</label>
    <div class="region empty" id="regionText">请定位或搜索选择地区</div>
  </div>
  <div class="field">
    <label>详细地址</label>
    <input id="fDetail" placeholder="例如：3号楼2单元801室" oninput="onDetailInput()">
  </div>
  <div class="field">
    <label>联系人</label>
    <input id="fName" placeholder="张三">
  </div>
  <div class="field">
    <label>手机号</label>
    <input id="fPhone" placeholder="138****8888" type="tel" maxlength="11" inputmode="numeric">
  </div>
  <div class="field">
    <label>标签</label>
    <div class="tags" id="tagBox">
      <span class="tag active" data-t="家" onclick="pickTag(this)">家</span>
      <span class="tag" data-t="公司" onclick="pickTag(this)">公司</span>
      <span class="tag" data-t="学校" onclick="pickTag(this)">学校</span>
      <span class="tag" data-t="其他" onclick="pickTag(this)">其他</span>
    </div>
  </div>
</div>

<div class="fix-bar">
  <button class="btn-save" onclick="saveAddress()">保存地址</button>
</div>

<div class="cover" id="cover"><div class="sp"></div><div class="msg" id="coverMsg">正在定位…</div></div>
<div class="toast" id="toast"></div>

<script src="assets/pca.js"></script>
<script>
/* ===================== 数据 ===================== */
var areaData = window.PCA_DATA || {};
var pcaIndex = null;
var amapKey = (function(){ try { return localStorage.getItem('amap_key') || ''; } catch(e){ return ''; } })();

/* ===================== 状态 ===================== */
var state = {
  centerLat: 39.9085, centerLng: 116.3975,   // 准星（地图中心）坐标
  mpp: 32,                                    // 每 CSS 像素对应的米数（越小越放大）
  gpsLat: 0, gpsLng: 0, hasGps: false,
  region: { p:'', c:'', d:'' },
  tag: '家', lastStreet: ''
};

/* ===================== 工具 ===================== */
function $(id){ return document.getElementById(id); }
function toast(m, d){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); }, d||1800); }
function showCover(m){ $('coverMsg').textContent=m||'加载中…'; $('cover').classList.add('show'); }
function hideCover(){ $('cover').classList.remove('show'); }
function hash2(i,j){ var n=(i*73856093)^(j*19349663); n=(n<0?-n:n); return n; }

/* 繁→简（BigDataCloud 返回繁体） */
function toSimp(s){
  if(!s) return '';
  var map={'東':'东','區':'区','縣':'县','鎮':'镇','鄉':'乡','莊':'庄','場':'场','陽':'阳','寧':'宁','廣':'广','廈':'厦','烏':'乌','蘭':'兰','蘇':'苏','龍':'龙','鳳':'凤','臺':'台','島':'岛','義':'义','興':'兴','豐':'丰','營':'营','樂':'乐','來':'来','歷':'历','餘':'余','觀':'观','開':'开','遠':'远','遼':'辽','順':'顺','運':'运','進':'进','選':'选','點':'点','熱':'热','愛':'爱','當':'当','劉':'刘','張':'张','陳':'陈','楊':'杨','黃':'黄','趙':'赵','孫':'孙','吳':'吴','鄭':'郑','錢':'钱','馬':'马','馮':'冯','許':'许','謝':'谢','羅':'罗','韓':'韩','溫':'温','連':'连','呂':'吕','葉':'叶','嚴':'严','譚':'谭','鄧':'邓','鍾':'钟','盧':'卢','蔣':'蒋','歐':'欧','範':'范','賴':'赖','頭':'头','門':'门','關':'关','崗':'岗','灣':'湾','壩':'坝','專':'专','屬':'属','圖':'图','廠':'厂','處':'处','實':'实','學':'学','衛':'卫','職':'职','總':'总','種':'种','備':'备','發':'发','務':'务','間':'间','認':'认','報':'报','樹':'树','僑':'侨','鹽':'盐','醫':'医','補':'补','達':'达','顯':'显','體':'体','幾':'几','畫':'画','對':'对','歲':'岁','歸':'归','靈':'灵','會':'会','殺':'杀','產':'产','單':'单','賣':'卖','讀':'读','擊':'击','機':'机','權':'权','樣':'样','檢':'检','驗':'验','稱':'称','執':'执','裏':'里','遷':'迁','過':'过','週':'周','環':'环','團':'团','園':'园','廬':'庐','劃':'划','裏':'里','專':'专','廠':'厂','屬':'属','圓':'圆','勝':'胜','華':'华','橋':'桥','濟':'济','漢':'汉','澱':'淀','瀋':'沈','農':'农','業':'业','傳':'传','嶺':'岭','寶':'宝','貴':'贵','賓':'宾','慶':'庆','雲':'云','無':'无','萬':'万','車':'车','長':'长','圍':'围','橫':'横','燈':'灯','紅':'红','綠':'绿','藍':'蓝','鐵':'铁','銀':'银','錦':'锦','鎖':'锁','陸':'陆','隴':'陇','靜':'静','風':'风','飛':'飞','麗':'丽','齊':'齐','壽':'寿','嶽':'岳','嶼':'屿','漵':'溆','瀘':'泸','灄':'滠','澤':'泽','溝':'沟','塗':'涂','邊':'边','鄰':'邻','鋼':'钢','鹹':'咸','務':'务','親':'亲','蓮':'莲','葦':'苇','薈':'荟','藥':'药','蘆':'芦','蕩':'荡','鶴':'鹤','鳴':'鸣','鳥':'鸟','龔':'龚','齋':'斋'};
  return String(s).split('').map(function(ch){ return map[ch]||ch; }).join('');
}

/* ===================== 省市区索引（本地，无网络） ===================== */
function buildPcaIndex(){
  if(pcaIndex) return pcaIndex;
  if(!areaData || !Object.keys(areaData).length) return null;
  var idx=[], strip=function(s){ return s.replace(/(省|市|自治区|自治州|地区|盟|区|县|旗|自治县|新区)$/g,''); };
  for(var p in areaData){ if(!areaData.hasOwnProperty(p)) continue;
    var cities=areaData[p], ckeys=Array.isArray(cities)?[p]:Object.keys(cities);
    for(var i=0;i<ckeys.length;i++){ var c=ckeys[i];
      var districts=Array.isArray(cities)?cities:(cities[c]||[]);
      for(var j=0;j<districts.length;j++){ var d=districts[j];
        idx.push({p:p,c:c,d:d,key:(p+c+d+strip(p)+strip(c)+strip(d)).toLowerCase()});
      }
    }
  }
  pcaIndex=idx; return idx;
}
function searchPca(q){
  var idx=buildPcaIndex(); if(!idx) return null;
  q=(q||'').trim().toLowerCase(); if(!q) return [];
  var words=q.split(/[\s,，]+/).filter(Boolean), exact=[], fuzzy=[];
  for(var i=0;i<idx.length;i++){ var it=idx[i], hitAll=true;
    for(var w=0;w<words.length;w++){ if(it.key.indexOf(words[w])<0){ hitAll=false; break; } }
    if(!hitAll) continue;
    if(it.d.toLowerCase().indexOf(words[words.length-1])===0) exact.push(it); else fuzzy.push(it);
    if(exact.length+fuzzy.length>400) break;
  }
  return exact.concat(fuzzy).slice(0,12);
}

/* ===================== 逆地理编码（GPS → 省/市/区） ===================== */
function reverseGeocode(lat,lng){
  return new Promise(function(resolve){
    var settled=false; function go(fn){ if(settled) return; settled=true; resolve(fn); }
    var url='https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lng+'&localityLanguage=zh';
    var timer=setTimeout(function(){ go(tryAmap(lat,lng)); }, 6500);
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      clearTimeout(timer);
      if(d && d.principalSubdivision){
        var p=toSimp(d.principalSubdivision);
        var c=toSimp(d.city||d.principalSubdivision);
        var d0=toSimp(d.locality||'');
        var street='';
        if(d.localityInfo && d.localityInfo.administrative){
          for(var i=0;i<d.localityInfo.administrative.length;i++){
            if(d.localityInfo.administrative[i].adminLevel===8){ street=toSimp(d.localityInfo.administrative[i].name); break; }
          }
        }
        go({p:p,c:c,d:d0,street:street});
      } else { go(tryAmap(lat,lng)); }
    }).catch(function(){ clearTimeout(timer); go(tryAmap(lat,lng)); });
  });
}
function tryAmap(lat,lng){
  return new Promise(function(resolve){
    if(!amapKey){ resolve(null); return; }
    var url='https://restapi.amap.com/v3/geocode/regeo?key='+amapKey+'&location='+lng+','+lat+'&extensions=base';
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.status==='1' && data.regeocode && data.regeocode.addressComponent){
        var comp=data.regeocode.addressComponent;
        resolve({p:comp.province||'',c:comp.city||'',d:comp.district||'',street:comp.street||''});
      } else resolve(null);
    }).catch(function(){ resolve(null); });
  });
}

/* 把逆地理结果应用到界面 */
function applyReverse(r){
  if(!r || !r.p){ setLocStatus('未能解析该位置，请手动搜索或拖动'); return; }
  state.region={ p:r.p, c:r.c||r.p, d:r.d||'' };
  state.lastStreet=r.street||'';
  updateRegionText();
  var addr=[r.p, (r.c&&r.c!==r.p?r.c:''), r.d, r.street].filter(Boolean).join(' ');
  setLocAddr(addr);
  setLocStatus('');
}
function setLocAddr(t){ $('locAddr').textContent=t; }
function setLocStatus(t){ $('locStatus').textContent=t||''; }
function updateRegionText(){
  var r=state.region;
  var el=$('regionText');
  if(r.p && r.d){
    el.textContent=r.p + (r.c&&r.c!==r.p?' '+r.c:'') + ' ' + r.d;
    el.classList.remove('empty');
  } else { el.textContent='请定位或搜索选择地区'; el.classList.add('empty'); }
}

/* ===================== 地图渲染 ===================== */
var canvas, ctx, dpr=1;
function initMap(){
  canvas=$('map'); ctx=canvas.getContext('2d');
  resizeMap(); window.addEventListener('resize', resizeMap);
  bindDrag();
  drawMap();
}
function resizeMap(){
  var wrap=$('mapWrap'); dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(wrap.clientWidth*dpr);
  canvas.height=Math.round(wrap.clientHeight*dpr);
  drawMap();
}
function roundRect(c,x,y,w,h,r){ if(w<=0||h<=0)return; r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawMap(){
  if(!ctx) return;
  var W=canvas.width, H=canvas.height, lat=state.centerLat, lng=state.centerLng;
  var degPerPxLat=(state.mpp*dpr)/110540;
  var degPerPxLng=(state.mpp*dpr)/(111320*Math.cos(lat*Math.PI/180));
  function sx(lo){ return W/2+(lo-lng)/degPerPxLng; }
  function sy(la){ return H/2-(la-lat)/degPerPxLat; }

  ctx.fillStyle='#E9EEF1'; ctx.fillRect(0,0,W,H);

  // 城市街区纹理（程序化，平移时稳定）。cell/mpp 用 CSS 像素做基准，避免 dpr>1 时密度坍缩
  var cell=280, cellDeg=cell/111000;
  var cellPx=cell/state.mpp;
  // 注意：degPerPx* 表示“每像素多少度”，像素→度必须用乘法（写成除法会让范围爆炸成几十万度）
  var lngL=lng-(W/2)*degPerPxLng, lngR=lng+(W/2)*degPerPxLng;
  var latT=lat+(H/2)*degPerPxLat, latB=lat-(H/2)*degPerPxLat;
  var i0=Math.floor(lngL/cellDeg), i1=Math.ceil(lngR/cellDeg);
  var j0=Math.floor(latB/cellDeg), j1=Math.ceil(latT/cellDeg);
  // 防呆：任何参数异常都不允许把主线程画死
  if(!isFinite(i0)||!isFinite(i1)||!isFinite(j0)||!isFinite(j1)) return;
  for(var i=i0;i<=i1;i++){ for(var j=j0;j<=j1;j++){
    var cl=(i+0.5)*cellDeg, ca=(j+0.5)*cellDeg;
    var x=sx(cl)-cellPx/2, y=sy(ca)-cellPx/2;
    var gap=Math.max(3, cellPx*0.18);
    var bw=cellPx-gap, bh=cellPx-gap; if(bw<=0||bh<=0) continue;
    var h=hash2(i,j);
    if(hash2(i+99,j+7)%10===0) ctx.fillStyle='#9CD89C';           // 公园（约10%绿地，更显眼）
    else if(hash2(i+3,j+51)%14===0) ctx.fillStyle='#7FB8E0';      // 水系（约7%蓝块）
    else if(hash2(i+17,j+33)%26===0) ctx.fillStyle='#F2EBC2';     // 黄地块（学校/重要POI）
    else { var s=215-((h>>>3)%32); var tint=(h%7)-3; ctx.fillStyle='rgb('+s+','+(s+4+tint)+','+(s+12)+')'; }
    roundRect(ctx, x+gap/2, y+gap/2, bw, bh, 2*dpr); ctx.fill();
  }}
  // 主干道（每 6 格一条加粗白线）
  ctx.strokeStyle='#fff'; ctx.lineWidth=4*dpr;
  for(var i2=i0;i2<=i1;i2++){ if(((i2%6)+6)%6===0){ var xl=sx((i2+0.5)*cellDeg); ctx.beginPath(); ctx.moveTo(xl,0); ctx.lineTo(xl,H); ctx.stroke(); } }
  for(var j2=j0;j2<=j1;j2++){ if(((j2%6)+6)%6===0){ var yl=sy((j2+0.5)*cellDeg); ctx.beginPath(); ctx.moveTo(0,yl); ctx.lineTo(W,yl); ctx.stroke(); } }

  // 中心准星（地图选择针）
  var cx=W/2, cy=H/2;
  ctx.save();
  ctx.fillStyle='rgba(7,193,96,.16)'; ctx.beginPath(); ctx.arc(cx,cy,20*dpr,0,7); ctx.fill();
  ctx.fillStyle='#07C160';
  ctx.beginPath(); ctx.arc(cx, cy-22*dpr, 12*dpr, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx-7*dpr, cy-16*dpr); ctx.lineTo(cx+7*dpr, cy-16*dpr); ctx.lineTo(cx, cy+2*dpr); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx, cy-22*dpr, 5*dpr, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 真实 GPS 点（蓝色，偏离中心表示地图被拖动过）
  if(state.hasGps){
    var gx=sx(state.gpsLng), gy=sy(state.gpsLat);
    ctx.fillStyle='rgba(33,118,255,.22)'; ctx.beginPath(); ctx.arc(gx,gy,17*dpr,0,7); ctx.fill();
    ctx.fillStyle='#2176FF'; ctx.beginPath(); ctx.arc(gx,gy,7*dpr,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(gx,gy,3*dpr,0,7); ctx.fill();
  }
}
function panBy(dxCss, dyCss){
  var degPerPxLat=state.mpp/110540;
  var degPerPxLng=state.mpp/(111320*Math.cos(state.centerLat*Math.PI/180));
  state.centerLng -= dxCss*degPerPxLng;
  state.centerLat += dyCss*degPerPxLat;
  drawMap();
}
function zoomIn(){ state.mpp=Math.max(8, state.mpp*0.62); drawMap(); scheduleReverse(); }
function zoomOut(){ state.mpp=Math.min(400, state.mpp/0.62); drawMap(); scheduleReverse(); }

/* 拖动 */
var drag={on:false,x:0,y:0,moved:false};
function bindDrag(){
  canvas.addEventListener('pointerdown', function(e){ drag.on=true; drag.moved=false; drag.x=e.clientX; drag.y=e.clientY; try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener('pointermove', function(e){ if(!drag.on) return; var dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; drag.x=e.clientX; drag.y=e.clientY; panBy(dx,dy); });
  canvas.addEventListener('pointerup', function(e){ drag.on=false; if(drag.moved) scheduleReverse(); });
  canvas.addEventListener('pointercancel', function(){ drag.on=false; });
}
var revTimer=null;
function scheduleReverse(){
  setLocAddr('正在获取位置…'); setLocStatus('地图移动中，地址实时更新');
  clearTimeout(revTimer);
  revTimer=setTimeout(function(){ reverseGeocode(state.centerLat, state.centerLng).then(applyReverse); }, 450);
}

/* ===================== GPS ===================== */
function autostartGps(){
  showCover('正在定位…');
  if(!navigator.geolocation){ hideCover(); setLocAddr('浏览器不支持定位'); setLocStatus('请手动拖动地图选择位置'); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    hideCover();
    state.gpsLat=pos.coords.latitude; state.gpsLng=pos.coords.longitude; state.hasGps=true;
    state.centerLat=state.gpsLat; state.centerLng=state.gpsLng;
    drawMap();
    setLocAddr('正在解析地址…'); setLocStatus('已获取定位，正在转换为详细地址');
    reverseGeocode(state.centerLat, state.centerLng).then(function(r){ applyReverse(r); if(!r||!r.p) setLocStatus('可拖动地图微调，或下方手动搜索'); });
  }, function(err){
    hideCover();
    var inWx=/MicroMessenger/i.test(navigator.userAgent);
    var msg = err&&err.code===1 ? (inWx?'微信内定位被拒绝，请允许定位或手动拖动':'定位权限被拒绝，请在浏览器允许定位') : '定位失败，请手动拖动地图选择位置';
    setLocAddr('未能自动定位'); setLocStatus(msg);
    reverseGeocode(state.centerLat, state.centerLng).then(applyReverse); // 默认中心点也给个地址兜底
  }, { enableHighAccuracy:false, timeout:10000, maximumAge:60000 });
}
function reLocate(){
  if(state.hasGps){ state.centerLat=state.gpsLat; state.centerLng=state.gpsLng; drawMap(); setLocAddr('正在解析地址…'); reverseGeocode(state.centerLat,state.centerLng).then(applyReverse); }
  else { autostartGps(); }
}

/* ===================== 搜索 ===================== */
var searchTimer=null;
function onSearchInput(){
  clearTimeout(searchTimer);
  var v=$('searchInput').value.trim();
  if(!v){ $('results').classList.remove('show'); $('results').innerHTML=''; return; }
  if(amapKey){ searchTimer=setTimeout(doSearch, 500); }
  // 本地无 key 时不自动搜（避免误触），点搜索按钮才搜
}
function doSearch(){
  var q=$('searchInput').value.trim();
  if(!q){ toast('请输入搜索内容'); return; }
  if(amapKey){ searchAmap(q); } else { searchLocal(q); }
}
function searchLocal(q){
  var res=searchPca(q);
  var box=$('results');
  if(res===null){ box.innerHTML='<div class="res-item"><div class="res-addr">地址数据加载中，请稍候…</div></div>'; box.classList.add('show'); return; }
  if(!res.length){ box.innerHTML='<div class="res-item"><div class="res-addr">没找到「'+esc(q)+'」，换个关键词试试（如：朝阳 / 天河）</div></div>'; box.classList.add('show'); return; }
  box.innerHTML=res.map(function(it){
    var label=(it.p===it.c)?(it.p+' · '+it.d):(it.p+' · '+it.c+' · '+it.d);
    return '<div class="res-item" onclick="applySearch(\''+jq(it.p)+'\',\''+jq(it.c)+'\',\''+jq(it.d)+'\')">'
      + '<div class="res-name">'+esc(it.d)+'</div><div class="res-addr">'+esc(label)+'</div></div>';
  }).join('');
  box.classList.add('show');
}
function searchAmap(q){
  showCover('搜索中…');
  var url='https://restapi.amap.com/v3/assistant/inputtips?key='+amapKey+'&keywords='+encodeURIComponent(q)+'&output=json';
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    hideCover();
    var box=$('results');
    if(d.status!=='1'||!d.tips){ toast('未搜索到结果'); return; }
    var tips=d.tips.filter(function(t){ return t.location && t.location.length>0; });
    if(!tips.length){ toast('未搜索到匹配地址'); return; }
    box.innerHTML=tips.slice(0,12).map(function(t){
      var loc=t.location.split(',');
      return '<div class="res-item" onclick="applyAmap(\''+loc[0]+'\',\''+loc[1]+'\',\''+jq(t.name)+'\',\''+jq((t.district||'')+(t.address?' '+t.address:''))+'\')">'
        + '<div class="res-name">'+esc(t.name)+'</div><div class="res-addr">'+esc((t.district||'')+(t.address?' '+t.address:''))+'</div></div>';
    }).join('');
    box.classList.add('show');
  }).catch(function(){ hideCover(); toast('搜索失败，请重试'); });
}
function applySearch(p,c,d){
  state.region={p:p,c:c,d:d}; updateRegionText();
  $('results').classList.remove('show'); $('results').innerHTML='';
  $('searchInput').value='';
  toast('已选择：'+(p===c?p:p+' '+c)+' '+d+'，请补充详细地址', 2200);
  document.getElementById('formSection').scrollIntoView({behavior:'smooth'});
  setTimeout(function(){ $('fDetail').focus(); }, 350);
}
function applyAmap(lng,lat,name,addr){
  state.centerLat=parseFloat(lat); state.centerLng=parseFloat(lng); drawMap();
  $('results').classList.remove('show'); $('results').innerHTML=''; $('searchInput').value=name;
  reverseGeocode(state.centerLat, state.centerLng).then(function(r){ applyReverse(r); if(r&&r.p){ $('fDetail').value=(name+(addr?(' '+addr):'')); onDetailInput(); } });
  document.getElementById('formSection').scrollIntoView({behavior:'smooth'});
}

/* ===================== 表单 ===================== */
function pickTag(el){ var box=$('tagBox').children; for(var i=0;i<box.length;i++) box[i].classList.remove('active'); el.classList.add('active'); state.tag=el.getAttribute('data-t'); }
function onDetailInput(){ var v=$('fDetail').value.trim(); }
function newAddress(){ document.getElementById('formSection').scrollIntoView({behavior:'smooth'}); setTimeout(function(){ $('fDetail').focus(); }, 350); }

function pushAddrBook(a){
  if(!a||!a.detail||!a.pca) return;
  var key='om_addr_book'; var book=[];
  try{ book=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){}
  var sig=a.pca+'|'+a.detail;
  book=book.filter(function(x){ return (x.pca+'|'+x.detail)!==sig; });
  book.unshift({name:a.name||'',phone:a.phone||'',pca:a.pca,detail:a.detail,p:a.p,c:a.c,d:a.d,tag:a.tag||'',lat:a.lat||0,lng:a.lng||0});
  try{ localStorage.setItem(key, JSON.stringify(book.slice(0,5))); }catch(e){}
}
function saveAddress(){
  var name=$('fName').value.trim(), phone=$('fPhone').value.trim(), detail=$('fDetail').value.trim();
  if(!state.region.p || !state.region.d){ toast('请先定位或搜索选择所在地区'); return; }
  if(!detail){ toast('请填写详细地址'); $('fDetail').focus(); return; }
  if(!name){ toast('请填写联系人'); $('fName').focus(); return; }
  if(!/^1\d{10}$/.test(phone)){ toast('请填写正确的 11 位手机号'); $('fPhone').focus(); return; }
  var r=state.region;
  var pca=r.p + (r.c&&r.c!==r.p?' '+r.c:'') + ' ' + r.d;
  var result={ p:r.p, c:r.c, d:r.d, pca:pca, detail:detail, name:name, phone:phone, tag:state.tag, lat:state.centerLat, lng:state.centerLng };
  try{ localStorage.setItem('om_addr', JSON.stringify(result)); localStorage.setItem('om_addr_pick_result', JSON.stringify(result)); }catch(e){}
  pushAddrBook(result);
  toast('地址已保存', 1400);
  setTimeout(goBack, 600);
}

/* ===================== 杂项 ===================== */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function jq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function goBack(){ if(document.referrer){ history.back(); } else { location.href='customer.html'; } }

/* ===================== 启动 ===================== */
window.addEventListener('load', function(){
  initMap();
  if(!areaData || !Object.keys(areaData).length){ toast('地址库未加载，搜索不可用', 2500); }
  // 打开页面自动请求定位
  autostartGps();
});
</script>
