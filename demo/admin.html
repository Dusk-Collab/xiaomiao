<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>商家后台 · 扫码点餐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
body { background: #F7EFE3; }
#shell { display: flex; min-height: 100vh; }

/* ---- 侧边栏 ---- */
.side {
  width: 208px; flex: none; background: #fff; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.side-brand { padding: 18px 16px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.side-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; font-size: 20px; flex: none; background-size: cover; background-position: center; overflow: hidden; }
.side-logo img { width: 100%; height: 100%; object-fit: cover; }
.nav { padding: 10px 10px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  font-size: 14px; color: var(--ink-2); margin-bottom: 3px; transition: all .15s; position: relative;
}
.nav-item:hover { background: #FAF6F3; }
.nav-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.nav-icon { font-size: 17px; width: 22px; text-align: center; flex: none; }
.nav-badge {
  margin-left: auto; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--brand); color: #fff; font-size: 11px; font-weight: 800;
  display: grid; place-items: center;
}
.side-foot { padding: 12px; border-top: 1px solid var(--line); }

/* ---- 内容区 ---- */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40; flex-wrap: wrap;
}
.page-title { font-size: 17px; font-weight: 800; }
.body { padding: 18px 20px 90px; flex: 1; }
.card { background: #fff; border-radius: var(--r-m); padding: 16px; box-shadow: var(--sh-s); margin-bottom: 14px; }
.card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 7px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat {
  background: #fff; border-radius: var(--r-m); padding: 14px 16px; box-shadow: var(--sh-s);
  border-left: 3px solid var(--brand-2); transition: transform .15s, box-shadow .15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--sh-m); cursor: pointer; }
.stat-v { font-size: 25px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

/* ---- 订单看板 ---- */
.kb-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.kb-tab {
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: #fff; color: var(--ink-2); border: 1px solid var(--line);
}
.kb-tab.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(232,53,46,.25); }
.kb-tab .n { opacity: .75; margin-left: 3px; }

.order-bulk-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #FFF7EA; border: 1px solid #F3DFC0; border-radius: 10px; padding: 9px 11px; margin: 8px 0 14px;
}
.order-bulk-bar .sel-all { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
.order-bulk-bar .sel-info { font-size: 12px; color: var(--ink-3); flex: 1; }
.order-bulk-bar .reset-btn {
  margin-left: auto; font-size: 12px; color: #C0392B; border: 1px solid #F3DFC0; background: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600;
}
.order-bulk-bar .reset-btn:hover { background: #FEE; border-color: #C0392B; }

.order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 12px; }
.owrap { position: relative; border-radius: var(--r-m); overflow: hidden; background: #E8DFD8; }
.owrap .act-l, .owrap .act-r {
  position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center;
  padding: 0 20px; font-size: 14px; font-weight: 800; color: #fff;
}
.owrap .act-r { right: 0; justify-content: flex-end; background: var(--ok); }
.owrap .act-l { left: 0; background: #94908C; }
.ocard {
  background: #fff; padding: 13px 14px; position: relative; z-index: 1;
  transition: transform .22s cubic-bezier(.22,1,.36,1); touch-action: pan-y;
  border-radius: var(--r-m); cursor: grab;
}
.ocard.dragging { transition: none; cursor: grabbing; }
.ocard.new { animation: pop .35s; box-shadow: inset 0 0 0 2px var(--brand); }
.o-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.o-code {
  font-size: 27px; font-weight: 900; color: var(--brand); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: .5px;
}
.o-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.o-items { border-top: 1px dashed var(--line); padding-top: 9px; margin-bottom: 10px; }
.o-line { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; align-items: baseline; }
.o-line .q { color: var(--brand); font-weight: 800; flex: none; min-width: 22px; }
.o-line .s { font-size: 11px; color: var(--ink-3); }
.o-remark {
  background: #FFF8E6; border: 1px solid #FBE8B8; border-radius: 8px; padding: 6px 9px;
  font-size: 12px; color: #8A6410; margin-bottom: 9px;
}
.o-foot { display: flex; align-items: center; gap: 8px; }
.o-price { font-size: 17px; font-weight: 800; }
.swipe-hint { font-size: 10.5px; color: var(--ink-3); text-align: center; margin-top: 7px; }

/* ---- 商品表 ---- */
.ptable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ptable th {
  text-align: left; padding: 9px 10px; font-size: 12px; color: var(--ink-3);
  font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.ptable td { padding: 9px 10px; border-bottom: 1px solid #F6F1ED; vertical-align: middle; }
.ptable tr:hover td { background: #FDFAF8; }
.p-emoji { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 21px; }
/* 商品缩略图（可上传图片） */
.p-thumb {
  position: relative; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  font-size: 21px; cursor: pointer; overflow: hidden; border: 1px dashed #E2D6CC; background-size: cover; background-position: center;
}
.p-thumb:hover { border-color: var(--brand-2); }
.p-thumb.has-img { border-style: solid; }
.thumb-cam { opacity: .45; font-size: 17px; }
.thumb-x {
  position: absolute; top: 0; right: 0; width: 16px; height: 16px; line-height: 15px; text-align: center;
  background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-bottom-left-radius: 8px;
}
/* 批量操作条 */
.bulk-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: #FFF7EA; border: 1px solid #F3DFC0; border-radius: 10px; padding: 9px 11px; margin: 4px 0 12px;
}
.bulk-bar .sel-all { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
.bulk-bar .sel-info { font-size: 12px; color: var(--ink-3); }
.bulk-bar .auto-cat { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.sel-box { width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand); }
.inline-in {
  border: 1px solid transparent; background: transparent; padding: 5px 7px; border-radius: 7px;
  width: 100%; transition: all .15s;
}
.inline-in:hover { background: #F7F2EE; }
.inline-in:focus { background: #fff; border-color: var(--brand-2); outline: none; }
.w-price { width: 84px; }
.w-sold { width: 72px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  font-size: 14px; color: var(--ink-3); transition: all .15s;
}
.icon-btn:hover { background: #F5F0EC; color: var(--brand); }

/* ---- 表单 ---- */
.form-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #F6F1ED; }
.form-row:last-child { border-bottom: none; }
.form-label { font-size: 13.5px; font-weight: 600; min-width: 108px; flex: none; }
.form-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; font-weight: 400; }
.form-ctl { flex: 1; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

/* ---- 二维码 ---- */
.qr-box {
  background: #fff; border-radius: var(--r-l); padding: 18px; text-align: center;
  box-shadow: var(--sh-m); width: 268px; border: 2px solid var(--brand); position: relative;
}
.qr-top { background: var(--grad); color: #fff; margin: -18px -18px 14px; padding: 14px; border-radius: 18px 18px 0 0; }
canvas.qr { border-radius: 8px; }

/* ---- 声音提示条 ---- */
#soundBar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 11px; z-index: 70; box-shadow: var(--sh-l);
  font-size: 13px; animation: slideUp .3s;
}
#newOrderFlash {
  position: fixed; inset: 0; pointer-events: none; z-index: 65;
  box-shadow: inset 0 0 0 5px var(--brand); opacity: 0; transition: opacity .3s;
}
#newOrderFlash.on { opacity: 1; }

/* ---- 移动端 ---- */
.mobile-nav { display: none; }
@media (max-width: 860px) {
  .side { display: none; }
  .body { padding: 14px 12px 84px; }
  .topbar { padding: 11px 14px; }
  .order-grid { grid-template-columns: 1fr; }
  .mobile-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.97);
    backdrop-filter: blur(10px); border-top: 1px solid var(--line); z-index: 60;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .mn-item { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 4px 0; position: relative; }
  .mn-item.on { color: var(--brand); font-weight: 700; }
  .mn-icon { font-size: 20px; display: block; margin-bottom: 1px; }
  .mn-badge {
    position: absolute; top: 0; left: 50%; margin-left: 6px; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: 999px; background: var(--brand); color: #fff;
    font-size: 10px; font-weight: 800; display: grid; place-items: center;
  }
  #soundBar { bottom: 72px; }
  .ptable th:nth-child(4), .ptable td:nth-child(4) { display: none; }
  .form-label { min-width: 78px; font-size: 13px; }
}

/* ---- 商品管理：侧边栏 + 主区域布局 ---- */
.product-layout { display: flex; gap: 16px; align-items: flex-start; }
.product-sidebar { width: 220px; flex: none; }
.product-main { flex: 1; min-width: 0; }

.sidebar-section {
  background: #fff; border-radius: var(--r-m); padding: 12px 14px 14px;
  box-shadow: var(--sh-s); margin-bottom: 12px;
}
.sidebar-section h4 {
  margin: 0 0 10px; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; color: var(--ink); cursor: pointer; user-select: none;
}
.sidebar-section h4 .fold-icon {
  font-size: 12px; color: var(--ink-3); transition: transform .25s ease;
  width: 20px; height: 20px; display: grid; place-items: center;
}
.sidebar-section.collapsed h4 .fold-icon { transform: rotate(-90deg); }
.sidebar-section .sidebar-body {
  overflow: hidden; transition: max-height .3s ease, opacity .25s ease;
  max-height: 999px; opacity: 1;
}
.sidebar-section.collapsed .sidebar-body {
  max-height: 0; opacity: 0; pointer-events: none;
}

.cat-list { display: flex; flex-direction: column; gap: 2px; }
.cat-item {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; border-radius: 8px; font-size: 13px;
  cursor: pointer; transition: background .15s; user-select: none;
}
.cat-item:hover { background: #FAF6F3; }
.cat-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-count { font-size: 11.5px; color: var(--ink-3); background: #F7F2EE; padding: 1px 6px; border-radius: 999px; font-weight: 600; }
.cat-item.on .cat-count { background: rgba(232,132,28,.15); }
.cat-del { opacity: 0; font-size: 12px; color: #C0392B; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; transition: opacity .15s; }
.cat-item:hover .cat-del { opacity: .6; }
.cat-del:hover { opacity: 1 !important; background: #FEF0F0; }

.banner-list { display: flex; flex-direction: column; gap: 6px; }
.banner-empty { font-size: 12px; color: var(--ink-3); text-align: center; padding: 14px 6px; background: #FDFAF8; border-radius: 8px; }
.banner-item {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px;
  background: #FDFAF8; font-size: 12.5px; transition: background .15s;
}
.banner-item:hover { background: #F5F0EC; }
.banner-thumb { width: 28px; height: 28px; border-radius: 6px; background-size: cover; background-position: center; flex: none; }
.banner-emoji { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-size: 16px; background: var(--brand-soft); flex: none; }
.banner-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.banner-tag { font-size: 10.5px; color: var(--brand); background: var(--brand-soft); padding: 1px 5px; border-radius: 4px; font-weight: 600; flex: none; }
.banner-del { opacity: 0; font-size: 12px; color: #C0392B; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; cursor: pointer; transition: opacity .15s; }
.banner-item:hover .banner-del { opacity: .6; }
.banner-del:hover { opacity: 1 !important; background: #FEF0F0; }

/* ---- 小型模态弹窗 ---- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(30,22,18,.45);
  display: none; place-items: center; z-index: 80; padding: 16px;
  animation: fadeIn .18s ease both;
}
.modal-mask.show { display: grid; }
.modal-card {
  background: #fff; border-radius: var(--r-m); padding: 20px 22px 18px;
  width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(30,22,18,.2);
  animation: popIn .2s ease both;
}
.modal-card h4 { margin: 0 0 14px; font-size: 15px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.modal-card .modal-input {
  width: 100%; padding: 10px 13px; font-size: 14px; border: 1px solid var(--line);
  border-radius: 10px; background: #FAF7F4; outline: none; margin-bottom: 8px; transition: border-color .15s, box-shadow .15s;
  box-sizing: border-box;
}
.modal-card .modal-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: #fff; }
.modal-card .modal-row { margin-bottom: 14px; }
.modal-card .modal-row label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.modal-card .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.modal-card .modal-btns button { padding: 8px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: transform .12s, opacity .15s; }
.modal-card .modal-btns button:hover { transform: translateY(-1px); }
.modal-card .modal-btns .btn-cancel { background: #F5F0EC; color: var(--ink-2); }
.modal-card .modal-btns .btn-confirm { background: var(--grad); color: #fff; }
.modal-card .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.modal-card .modal-tag {
  padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: #F5F0EC; color: var(--ink-2); cursor: pointer; border: 1.5px solid transparent;
  transition: all .15s;
}
.modal-card .modal-tag:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.modal-card .modal-tag.on { background: var(--brand); color: #fff; border-color: var(--brand); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* ===== 手机端适配兜底：避免放大/横向溢出/布局错乱 ===== */
@media (max-width: 768px) {
  .product-layout { flex-direction: column; gap: 12px; }
  .product-sidebar { width: 100%; }
  .product-main { width: 100%; }
  .form-row { flex-direction: column; align-items: stretch; gap: 5px; padding: 12px 0; }
  .form-label { min-width: 0; font-size: 13px; }
  .form-ctl { justify-content: flex-start; flex-wrap: wrap; }
  .form-ctl select, .form-ctl input { width: 100%; box-sizing: border-box; }
  .ptable { display: block; width: 100%; overflow-x: auto; white-space: nowrap; font-size: 12px; }
  .ptable th, .ptable td { padding: 7px 6px; }
  .modal-card { width: 92% !important; max-width: 92% !important; }
  .qr-box { width: auto; max-width: 100%; }
  .card { padding: 13px 12px; }
  .topbar { gap: 8px; }
  .page-title { font-size: 15px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-v { font-size: 21px; }
  .bulk-bar, .order-bulk-bar { gap: 6px; padding: 8px; }
  .o-code { font-size: 22px; }
  .order-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="shell">
  <aside class="side">
    <div class="side-brand">
      <div class="side-logo" id="sideLogo">🧋</div>
      <div style="min-width:0">
        <div style="font-size:13.5px;font-weight:800" class="ell" id="sideName">小淼饭店</div>
        <div style="font-size:11px;color:var(--ink-3)">商家管理后台</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
        <span id="sideStatusDot" style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>
        <span id="sideStatus">营业中</span>
        <div class="switch on" id="quickOpen" style="margin-left:auto;transform:scale(.82)"></div>
      </div>
      </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="page-title" id="pageTitle">订单看板</div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="tag" id="liveTag" style="background:#E7F6EC;color:var(--ok)">● 实时同步中</span>
        <button class="btn btn-ghost btn-sm" onclick="openCustomer()">👀 顾客视角</button>
        <button class="btn btn-ghost btn-sm" onclick="testOrder()">🧪 模拟来单</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>

<div class="mobile-nav" id="mobileNav"></div>
<div id="newOrderFlash"></div>
<div id="toast"></div>

<!-- 小型模态弹窗（自定义 prompt） -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalCard">
    <h4 id="modalTitle">提示</h4>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="modalCancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" id="modalConfirm" onclick="modalConfirm()">确定</button>
    </div>
  </div>
</div>

<script src="assets/sync.js"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/sync-github.js"></script>
<script src="assets/store.js"></script>
<script src="assets/qrcode.js"></script>
<script>
/* ================= 基础 ================= */
var D = Store.read();
var page = 'orders';
var kbTab = 'pending';
var soundReady = false;
var audioCtx = null;
var knownIds = {};
var orderSelIds = {};    // 已勾选订单 id 集合（批量操作用）
var prodFilterCat = '';  // 商品分类筛选
var sidebarColl = { cat: false, banner: false }; // 侧边栏折叠状态：false=展开, true=折叠
var statsFilter = 'all'; // 经营数据订单筛选：all | valid | canceled

var PAGES = [
  { k: 'orders',   t: '订单看板', i: '📋' },
  { k: 'products', t: '商品管理', i: '🧋' },
  { k: 'coupons',  t: '优惠券',   i: '🎟' },
  { k: 'shop',     t: '店铺设置', i: '⚙️' },
  { k: 'qrcode',   t: '点餐码',   i: '🔳' },
  { k: 'stats',    t: '经营数据', i: '📊' }
];

/* ================= 声音 ================= */
function initSound() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundReady = true;
    var b = $('soundBar'); if (b) b.remove();
    beep(); setTimeout(function () { speak('提示音已开启'); }, 260);
  } catch (e) { toast('浏览器不支持音频'); }
}
function beep() {
  if (!audioCtx) return;
  [[880, 0], [1320, .16]].forEach(function (p) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = p[0];
    var t0 = audioCtx.currentTime + p[1];
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.32, t0 + .015);
    g.gain.exponentialRampToValueAtTime(.001, t0 + .32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + .34);
  });
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

  document.title = '(' + n + ') 新订单！· 商家后台';
}
function showSoundBar() {

/* ---------- 滑动手势 ---------- */
function bindSwipe() {
  document.querySelectorAll('.ocard').forEach(function (el) {
    var st = el.dataset.st;
    if (st === 'done' || st === 'canceled') return;
    var sx = 0, dx = 0, active = false;

    function start(x) { sx = x; dx = 0; active = true; el.classList.add('dragging'); }
    function move(x) {
      if (!active) return;
      dx = x - sx;
      dx = Math.max(-150, Math.min(150, dx));
      el.style.transform = 'translateX(' + dx + 'px)';
    }
    function end() {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      el.style.transform = '';
      var NEXT = { pending: 'making', making: 'ready', ready: 'done' };
      if (dx > 78) setSt(el.dataset.id, NEXT[st]);
      else if (dx < -78) { if (confirm('确定取消这一单吗？')) setSt(el.dataset.id, 'canceled'); }
    }

    el.addEventListener('touchstart', function (e) { start(e.touches[0].clientX); }, { passive: true });
    el.addEventListener('touchmove', function (e) { move(e.touches[0].clientX); }, { passive: true });
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', function (e) { if (e.target.closest('button')) return; start(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', function (e) { if (active) move(e.clientX); });
    window.addEventListener('mouseup', end);
  });
}

function toggleSidebar(key) {
  sidebarColl[key] = !sidebarColl[key];
  render();
}

function filterCat(c) {
  prodFilterCat = prodFilterCat === c ? '' : c;
  render();
}
function upd(id, k, v) {
  save(function (d) {
    var p = d.products.find(function (x) { return x.id === id; }); if (!p) return;
    p[k] = v;
    // 上架、或改名（且当前已上架）时，若开启自动分类，则按名称推断分类（缺分类自动新建，仍可手动覆盖）
    var listed = (k === 'on') ? v : p.on;
    if (D.settings && D.settings.autoCat && listed && (k === 'on' || k === 'name')) {
      var c = Store.autoCat(p.name);
      if (c && d.categories.indexOf(c) < 0) d.categories.push(c);
      if (c) p.cat = c;
    }
  });
  toast('已保存，顾客端已同步');
  render();
}
function onCatChange(id, v) {
  if (v === '__new__') {
    var body = '<div class="modal-row"><label>分类名称</label><input class="modal-input" id="modalInput_catNewName" placeholder="请输入新分类名称"></div>';
    showModal('🗂 新建分类', body, function () {
      var n = modalInput('catNewName');
      if (!n) { closeModal(); return; }
      save(function (d) {
        if (d.categories.indexOf(n) < 0) d.categories.push(n);
        var p = d.products.find(function (x) { return x.id === id; }); if (p) p.cat = n;
      });
      closeModal();
      toast('已更新'); render();
    });
  } else { upd(id, 'cat', v); }
}
function addProduct() {
  var body = '<div class="modal-row"><label>商品名称</label><input class="modal-input" id="modalInput_name" placeholder="如：招牌奶茶" value=""></div>'
    + '<div class="modal-row"><label>价格（元）</label><input class="modal-input" id="modalInput_price" type="number" step="0.5" min="0" placeholder="8" value="8"></div>';
  showModal('🧋 新增商品', body, function () {
    var name = modalInput('name');
    if (!name) { toast('请填写商品名称'); return; }
    var price = modalInput('price', { number: true });
    if (price <= 0) price = 8;
    save(function (d) {
      var cat = (d.settings && d.settings.autoCat) ? Store.autoCat(name) : '';
      if (!cat) cat = d.categories[0];
      if (d.categories.indexOf(cat) < 0) d.categories.push(cat);
      d.products.unshift({
        id: 'p' + Date.now(), name: name, price: price, old: 0, cat: cat,
        emoji: '🧋', color: '#FFF0E6', img: '', desc: '', on: true, stock: 999, hot: false, sold: 0, banner: false, bannerTag: ''
      });
    });
    closeModal();
    toast('已新增'); render();
  });
}
function delProduct(id) {
  if (!confirm('确定删除该商品？')) return;
  save(function (d) { d.products = d.products.filter(function (p) { return p.id !== id; }); });
  delete selIds[id];
  toast('已删除'); render();
}
/* ---------- 商品详情编辑 ---------- */

    + '<div>'
    + '<div style="font-size:12px;color:var(--ink-3);margin-bottom:4px;font-weight:600">' + label + '</div>'
    + '<input class="modal-input" id="modalInput_' + key + '" value="' + val + '" placeholder="' + placeholder + '">'
    + '</div></div>';
}
function editProductDetail(id) {

    + '<textarea class="modal-input" id="modalInput_dDesc" rows="3" style="resize:vertical;font-family:inherit;line-height:1.55" placeholder="比如：阿尔卑斯山脉的水熬制七七四十九个小时...">' + v('desc') + '</textarea>'

    + detailRowInput('👨‍🍳', '制作方法', 'dMethod',  v('method'),  '比如：现做现卖，立等可取')
    + detailRowInput('⏰', '保质期',  'dShelf',   v('shelf'),   '比如：建议现做现吃')
    + detailRowInput('💡', '小贴士',  'dTips',    v('tips'),    '比如：可备注辣度 / 忌口')

    + '💡 保存后顾客端 <code>商品详情</code> 页会立刻同步显示。没填的字段会保持空白（不再用系统模板凑）。'

/* ---------- 批量选择 ---------- */
function toggleSel(id, v) { if (v) selIds[id] = true; else delete selIds[id]; updateSelCount(); }
function toggleAll(el) {
  var on = el.checked;
  var list = prodFilterCat ? D.products.filter(function (p) { return p.cat === prodFilterCat; }) : D.products;
  list.forEach(function (p) { if (on) selIds[p.id] = true; else delete selIds[p.id]; });
  document.querySelectorAll('.sel-box').forEach(function (cb) { cb.checked = on; });
  updateSelCount();
}
function updateSelCount() {
  var list = prodFilterCat ? D.products.filter(function (p) { return p.cat === prodFilterCat; }) : D.products;
  var n = Object.keys(selIds).length;
  var info = document.getElementById('selInfo'); if (info) info.textContent = n ? ('已选 ' + n + ' 项') : '';
  var all = document.getElementById('selAll');
  if (all) all.checked = n === list.length && n > 0;
}
function applyBulk(fn) {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  save(function (d) { d.products.forEach(function (p) { if (selIds[p.id]) fn(p, d); }); });
  toast('已更新'); render();
}
function bulkOn() {
  applyBulk(function (p, d) {
    p.on = true;
    if (d.settings && d.settings.autoCat) {
      var c = Store.autoCat(p.name);
      if (c && d.categories.indexOf(c) < 0) d.categories.push(c);
      if (c) p.cat = c;
    }
  });
}
function bulkOff() { applyBulk(function (p) { p.on = false; }); }
function bulkDel() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  if (!confirm('确定删除选中的 ' + ids.length + ' 个商品？此操作不可恢复')) return;
  save(function (d) { d.products = d.products.filter(function (p) { return selIds[p.id] === undefined; }); });
  selIds = {};
  toast('已删除'); render();
}
function bulkMoveCat() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  var catList = D.categories.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
  var body = '<div class="modal-row"><label>选择已有分类</label>'
    + '<select class="modal-input" id="modalInput_catSelect" style="margin-bottom:12px">'
    + '<option value="">-- 选择分类 --</option>' + catList + '</select></div>'
    + '<div class="modal-row"><label>或新建分类</label>'
    + '<input class="modal-input" id="modalInput_catNew" placeholder="输入新分类名称"></div>';
  showModal('🗂 移动到分类', body, function () {
    var c = modalInput('catNew', { trim: true });
    if (!c) c = modalInput('catSelect', { trim: true });
    if (!c) { toast('请选择或输入分类'); return; }
    save(function (d) {
      if (d.categories.indexOf(c) < 0) d.categories.push(c);
      d.products.forEach(function (p) { if (selIds[p.id]) p.cat = c; });
    });
    closeModal();
    toast('已移动'); render();
  });
}
function bulkBanner() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  var presets = ['新品推荐', '店长推荐', '人气热销', '本店特惠'];
  var body = '<div class="modal-row"><label>选择标签（或自定义输入）</label>'
    + '<div class="modal-tags" id="bannerTags">'
    + presets.map(function (t) { return '<div class="modal-tag" data-val="' + t + '" onclick="pickBannerTag(this)">' + t + '</div>'; }).join('')
    + '</div></div>'
    + '<div class="modal-row"><input class="modal-input" id="modalInput_tag" placeholder="自定义标签（留空则用默认推荐）" value="店长推荐"></div>';
  showModal('🎯 店长推荐', body, function () {
    var tag = modalInput('tag', { trim: true });
    if (!tag) tag = '店长推荐';
    save(function (d) {
      d.products.forEach(function (p) {
        if (selIds[p.id]) { p.banner = true; p.bannerTag = tag; }
      });
    });
    closeModal();
    toast('已添加到首页Banner'); render();
  });
}
function pickBannerTag(el) {
  document.querySelectorAll('#bannerTags .modal-tag').forEach(function (t) { t.classList.remove('on'); });
  el.classList.add('on');
  var inp = $('modalInput_tag'); if (inp) inp.value = el.dataset.val;
}
function setAutoCat(v) { save(function (d) { d.settings.autoCat = v; }); render(); }
/* ---------- 图片上传 ---------- */
function pickImg(id) { pendingImgId = id; var fi = document.getElementById('fileInput'); if (fi) fi.click(); }
function onFileChosen(e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var id = pendingImgId;
  Store.compressImage(f, 240, 0.6, function (url) {
    if (url) upd(id, 'img', url); else toast('图片读取失败');
  });
  e.target.value = '';
}
function removeImg(id) { upd(id, 'img', ''); toast('已移除图片，恢复 emoji'); }
/* ---- 店铺图标上传 ---- */
function pickShopLogo() {
  var i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.onchange = function () {
    var f = i.files && i.files[0]; if (!f) return;
    Store.compressImage(f, 320, 0.7, function (url) {
      if (!url) { toast('读取失败'); return; }
      save(function (d) { d.shop.logoImg = url; });
      toast('店铺图标已更新，顾客端已同步');
      render();
    });
  };
  i.click();
}
function addCat() {
  var body = '<div class="modal-row"><label>分类名称</label><input class="modal-input" id="modalInput_catName" placeholder="如：甜品饮品"></div>';
  showModal('🗂 新建分类', body, function () {
    var n = modalInput('catName');
    if (!n) { closeModal(); return; }
    save(function (d) { if (d.categories.indexOf(n) < 0) d.categories.push(n); });
    closeModal();
    render();
  });
}
function delCat(i) {
  save(function (d) {
    var c = d.categories[i];
    if (d.products.some(function (p) { return p.cat === c; })) { toast('该分类下还有商品，不能删除'); return; }
    d.categories.splice(i, 1);
  });
  render();
}

function delCoupon(id) {

/* 合成「橙底店名 + QR + 底部说明」卡片 PNG，店名自动跟店铺设置走 */
function buildQRCardCanvas(srcCanvas, shopName, tableNo) {
  var W = 320, H = 460;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  // 白底圆角
  fillRoundRect(ctx, 0, 0, W, H, 18, '#FFFFFF');
  // 顶部橙底（只上两角圆）
  fillTopRoundRect(ctx, 0, 0, W, 96, 18, '#E8841C');
  // 店名（自动跟随 shop.name）
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 19px -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.fillText(shopName || '扫码点餐', W / 2, 38);
  ctx.globalAlpha = 0.92;
  ctx.font = '12px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText('微信扫码 · 自助点单', W / 2, 66);
  ctx.globalAlpha = 1;
  // QR 主体
  var qrSize = 208, qrX = (W - qrSize) / 2, qrY = 118;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16);
  ctx.drawImage(srcCanvas, qrX, qrY, qrSize, qrSize);
  // 底部标签
  ctx.fillStyle = '#3A2A1A';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText(tableNo ? ('桌号 ' + tableNo) : '通用点餐码', W / 2, 358);
  ctx.fillStyle = '#8A7A66';
  ctx.font = '11.5px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText('扫码点单 · 免排队 · 免注册', W / 2, 386);
  return cv;
}
function fillRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath(); ctx.fill();
}
function fillTopRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath(); ctx.fill();
}

function pgStats() {
  var valid = D.orders.filter(function (o) { return o.status !== 'canceled'; });
  var canceled = D.orders.filter(function (o) { return o.status === 'canceled'; });
  var allOrd = D.orders;
  var rev = valid.reduce(function (s, o) { return s + o.total; }, 0);
  var avg = valid.length ? rev / valid.length : 0;
  var cut = valid.reduce(function (s, o) { return s + (o.discount || 0); }, 0);

  var sales = {};
  valid.forEach(function (o) { o.items.forEach(function (it) { sales[it.name] = (sales[it.name] || 0) + it.qty; }); });
  var rank = Object.keys(sales).map(function (k) { return [k, sales[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
  var max = rank.length ? rank[0][1] : 1;

  var byHour = new Array(24).fill(0);
  valid.forEach(function (o) { byHour[new Date(o.createdAt).getHours()]++; });
  var hmax = Math.max.apply(null, byHour) || 1;

  var html = '<div class="stat-grid">'
    + stat(allOrd.length, '全部订单', 'var(--brand)', "setStatsFilter('all');scrollToTable()")
    + stat(valid.length, '订单', 'var(--ok)', "setStatsFilter('valid');scrollToTable()")
    + stat(canceled.length, '取消订单', 'var(--warn)', "setStatsFilter('canceled');scrollToTable()")
    + stat(money(rev), '累计营业额', 'var(--info)', "setStatsFilter('valid');scrollToTable()")
    + stat(money(avg), '客单价', 'var(--ok)', "setStatsFilter('valid');scrollToTable()")
    + stat(money(cut), '优惠券支出', 'var(--warn)', "setStatsFilter('valid');scrollToTable()")
    + '</div>';

  html += '<div class="card"><h3>🏆 商品销量排行</h3>';
  if (!rank.length) html += '<div style="color:var(--ink-3);font-size:13px;padding:20px 0;text-align:center">还没有销售数据，去顾客端下几单试试</div>';
  rank.forEach(function (r, i) {
    html += '<div style="display:flex;align-items:center;gap:11px;padding:7px 0">'
      + '<span style="width:20px;font-weight:800;color:' + (i < 3 ? 'var(--brand)' : 'var(--ink-3)') + '">' + (i + 1) + '</span>'
      + '<span style="width:96px;font-size:13px" class="ell">' + esc(r[0]) + '</span>'
      + '<div style="flex:1;height:9px;background:#F2ECE8;border-radius:5px;overflow:hidden">'
      + '<div style="height:100%;width:' + (r[1] / max * 100) + '%;background:var(--grad-warm);border-radius:5px;transition:width .5s"></div></div>'
      + '<span class="mono" style="width:38px;text-align:right;font-weight:700;font-size:13px">' + r[1] + '</span></div>';
  });
  html += '</div>';

  html += '<div class="card"><h3>⏰ 时段分布</h3>'
    + '<div style="display:flex;align-items:flex-end;gap:2px;height:110px">'
    + byHour.map(function (v, h) {
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px" title="' + h + '点 · ' + v + '单">'
        + '<div style="width:100%;background:' + (v ? 'var(--grad-warm)' : '#F2ECE8') + ';border-radius:3px 3px 0 0;height:' + Math.max(3, v / hmax * 86) + 'px"></div>'
        + (h % 3 === 0 ? '<span style="font-size:9px;color:var(--ink-3)">' + h + '</span>' : '<span style="font-size:9px">&nbsp;</span>')
        + '</div>';
    }).join('') + '</div></div>';

  html += '<div class="card" id="statsTable"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'
    + '<h3 style="margin:0">📜 订单记录</h3>'
    + '<div class="kb-tabs" style="margin:0;border:none;padding:0">'
    + '<span class="kb-tab' + (statsFilter === 'all' ? ' on' : '') + '" onclick="setStatsFilter(\'all\')">全部 <span class="n">' + allOrd.length + '</span></span>'
    + '<span class="kb-tab' + (statsFilter === 'valid' ? ' on' : '') + '" onclick="setStatsFilter(\'valid\')">订单 <span class="n">' + valid.length + '</span></span>'
    + '<span class="kb-tab' + (statsFilter === 'canceled' ? ' on' : '') + '" onclick="setStatsFilter(\'canceled\')">取消订单 <span class="n">' + canceled.length + '</span></span>'
    + '</div></div>'
    + '<div style="overflow-x:auto"><table class="ptable"><thead><tr>'
    + '<th>取餐码</th><th>时间</th><th>商品</th><th>方式</th><th>地址</th><th>金额</th><th>状态</th></tr></thead><tbody>';
  var shown = statsFilter === 'all' ? allOrd : statsFilter === 'valid' ? valid : canceled;
  if (!shown.length) html += '<tr><td colspan="7" style="text-align:center;color:var(--ink-3);padding:24px">暂无记录</td></tr>';

      + '<td style="font-size:12px;max-width:160px" class="ell">' + (o.address && o.address !== '到店自取' && o.address !== '外送到家' ? esc(o.address) : '-') + '</td>'

      + '<td><span class="tag ' + ({ pending: 'tag-warn', making: 'tag-info', ready: 'tag-ok', done: 'tag-off', canceled: 'tag-off' })[o.status] + '">'
      + Store.STATUS_TEXT[o.status] + '</span></td></tr>';
  });
  html += '</tbody></table></div></div>';
  $('body').innerHTML = html;
}

/* ================= 实时监听 ================= */
function checkNew(data) {
  var news = data.orders.filter(function (o) { return o.isNew && o.status === 'pending'; });
  var fresh = news.filter(function (o) { return !knownIds[o.id]; });
  news.forEach(function (o) { knownIds[o.id] = 1; });
  if (fresh.length) {
    alertNewOrder(news.length);
    if (page !== 'orders') { toast('🔔 新订单 ' + fresh[0].code); }
    else if (kbTab !== 'pending' && kbTab !== 'all') kbTab = 'pending';
  }
  if (!news.length) document.title = '商家后台 · ' + data.shop.name;
}

Store.onChange(function (data) { D = data; checkNew(data); render(); });

Store.initCloud();   // 后台自动从仓库拉取/推送数据，前端不展示状态
Store.onSyncStatus(function (s) { /* 后台同步运行，UI 不展示 */ });

document.addEventListener('click', function once() {
  if (!soundReady) { initSound(); }
  document.removeEventListener('click', once);
}, { once: true });

/* 首次标记已有订单，避免刷新时误报 */
D.orders.forEach(function (o) { if (o.isNew) knownIds[o.id] = 1; });
render();
showSoundBar();
setInterval(function () { if (page === 'orders') pgOrders(); }, 60000);
</script>
