<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>清除缓存 · 小淼饭店</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #FFF6E9 0%, #FFE9D6 100%);
    color: #5A4632;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 22px; padding: 40px 30px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 12px 40px rgba(180, 130, 80, .18);
  }
  .emoji { font-size: 56px; line-height: 1; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 800; color: #3a2c1c; margin-bottom: 10px; }
  p { font-size: 14px; line-height: 1.7; color: #8a7560; }
  .status {
    margin-top: 18px; font-size: 13px; font-weight: 700; color: #0E7B3D;
    background: rgba(14,123,61,.08); padding: 10px 14px; border-radius: 12px;
  }
  .bar { height: 5px; border-radius: 999px; background: #F0E2D0; margin-top: 18px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #F4A23B; transition: width .1s linear; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧹</div>
    <h1>正在清除本机旧缓存…</h1>
    <p>本店网站在本手机上的旧数据（菜单缓存、购物车、评价缓存等）将被全部删除，然后自动跳到干净的顾客端页面。</p>
    <div class="status" id="status">已清除 0 项</div>
    <div class="bar"><i id="bar"></i></div>
  </div>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var barEl = document.getElementById('bar');

  // 彻底清空本机所有缓存（这家店网站 origin 下的全部 localStorage）
  var count = 0;
  try {
    count = localStorage.length;
    localStorage.clear();
  } catch (e) { /* 某些隐私模式下可能抛错，忽略 */ }

  statusEl.textContent = '已清除 ' + count + ' 项本机缓存';

  // 进度条动画
  var p = 0;
  var timer = setInterval(function () {
    p += 5; if (p > 100) p = 100;
    barEl.style.width = p + '%';
    if (p >= 100) clearInterval(timer);
  }, 90);

  // 1.8 秒后跳转到干净的顾客端页面（带破缓存参数，确保拿到最新代码）
  setTimeout(function () {
    var v = '20260811f';
    location.replace('customer.html?v=' + v);
  }, 1800);
})();
</script>
</body>
</html>
