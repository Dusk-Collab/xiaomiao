<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>商品详情 · 扫码点餐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ================= 中国风·江南小馆 ================= */
  body { background: #F5EBD8; }
  body, .cn {
    font-family: "STKaiti", "KaiTi", "STSong", "SimSun", "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", serif;
  }
  #app {
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    position: relative; overflow-x: hidden;
    padding-bottom: calc(74px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse 80% 60% at 12% 6%, rgba(201,53,43,.04), transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% 92%, rgba(184,149,106,.08), transparent 60%),
      linear-gradient(180deg, #F8EFD9 0%, #F2E6CB 100%);
  }

  /* 顶部 Hero：宣纸色 + 屋檐渐变 + 梅花装饰 */
  .prod-hero {
    color: #1a1a1a; padding: 14px 16px 22px; position: relative;
    display: flex; align-items: center; gap: 12px;
    background:
      linear-gradient(180deg, rgba(245,235,216,.0) 0%, rgba(232,213,179,.55) 100%),
      radial-gradient(ellipse 70% 50% at 30% 95%, rgba(110,91,67,.10), transparent 70%),
      linear-gradient(180deg, #F5EBD8 0%, #ECDFC1 100%);
  }
  .prod-hero::after {
    content: ''; position: absolute; right: -8px; top: 4px; width: 100px; height: 86px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 86'><g fill='none' stroke='%23432' stroke-width='1.4' stroke-linecap='round' opacity='.5'><path d='M92 6 Q70 24 58 44 Q48 64 38 82'/><path d='M72 22 Q64 30 56 40'/><path d='M62 44 Q52 50 44 60'/></g><g fill='%23C9352B'><circle cx='72' cy='22' r='2.6'/><circle cx='78' cy='26' r='2'/><circle cx='62' cy='44' r='2.6'/><circle cx='68' cy='48' r='2'/><circle cx='50' cy='64' r='2.2'/><circle cx='54' cy='70' r='1.8'/></g></svg>") no-repeat right top;
    background-size: contain; pointer-events: none; opacity: .6;
  }
  .prod-back {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,253,247,.85); color: #C9352B; border: 1px solid rgba(201,53,43,.3);
    display: grid; place-items: center; font-size: 20px; line-height: 1; cursor: pointer;
    flex: none; font-family: serif;
  }
  .prod-back:active { background: #FBF3DF; }
  .prod-shop-name {
    font-size: 16px; font-weight: 800; letter-spacing: 1px; min-width: 0; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: "STKaiti", "KaiTi", serif; color: #1a1a1a;
  }
  .prod-shop-name small {
    display: block; font-size: 11px; font-weight: 500; color: #6E5B43; margin-top: 2px;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 1px;
  }

  /* 轮播：白底宣纸 + 淡金描边 */
  .prod-pics {
    margin: -16px 12px 12px; border-radius: 8px; overflow: hidden;
    background: #FFFCF4; box-shadow: 0 4px 14px rgba(110,91,67,.10); position: relative;
    aspect-ratio: 1 / 1; max-height: 380px;
    border: 1px solid rgba(184,149,106,.25);
  }
  .prod-track { display: flex; height: 100%; transition: transform .42s cubic-bezier(.25,.8,.25,1); }
  .prod-slide {
    min-width: 100%; height: 100%; position: relative;
    background-size: cover; background-position: center; cursor: zoom-in;
  }
  .prod-slide-zoom {
    position: absolute; right: 12px; bottom: 12px;
    background: rgba(28,20,16,.55); color: #F5EBD8; font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 4px; backdrop-filter: blur(4px);
    display: flex; align-items: center; gap: 4px; pointer-events: none;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 1px;
  }
  .prod-dots {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 2;
  }
  .prod-dot {
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.6);
    transition: all .25s;
  }
  .prod-dot.active { background: #C9352B; width: 18px; border-radius: 3px; }

  /* 价格区：宣纸白 + 淡金边 */
  .prod-info {
    margin: 0 12px 14px; background: #FFFCF4; border-radius: 8px;
    padding: 14px 14px 16px; box-shadow: 0 1px 3px rgba(110,91,67,.06);
    border: 1px solid rgba(184,149,106,.25);
  }
  .prod-price-row { display: flex; align-items: baseline; gap: 8px; }
  .prod-price {
    font-size: 28px; font-weight: 900; color: #C9352B; letter-spacing: -.5px;
    font-family: "STKaiti", "KaiTi", "STSong", serif;
  }
  .prod-price small { font-size: 15px; font-weight: 800; margin-right: 1px; }
  .prod-old { font-size: 13px; color: #6E5B43; text-decoration: line-through; }
  .prod-tag-disc {
    background: rgba(201,53,43,.1); color: #C9352B; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 1px;
    border: 1px solid rgba(201,53,43,.25);
  }
  .prod-name {
    font-size: 18px; font-weight: 800; margin-top: 8px; line-height: 1.4; color: #1a1a1a;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 1px;
  }
  .prod-name .tag { margin-left: 4px; vertical-align: middle; }
  .prod-stats { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: #6E5B43; }
  .prod-stats b { color: #1a1a1a; font-weight: 800; }

  /* Tab：宣纸白 + 朱红选中 */
  .prod-tabs {
    margin: 0 12px; background: #FFFCF4; border-radius: 8px;
    box-shadow: 0 1px 3px rgba(110,91,67,.06); display: flex; padding: 4px; position: sticky; top: 6px; z-index: 5;
    border: 1px solid rgba(184,149,106,.2);
  }
  .prod-tab {
    flex: 1; text-align: center; padding: 10px 6px; font-size: 14px; font-weight: 700;
    color: #6E5B43; border-radius: 5px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 2px;
  }
  .prod-tab.active { background: #C9352B; color: #F5EBD8; }
  .prod-tab .n {
    background: rgba(28,20,16,.6); color: #F5EBD8; font-size: 10px;
    padding: 1px 6px; border-radius: 999px; font-weight: 700;
  }
  .prod-tab.active .n { background: rgba(245,235,216,.25); }
  .prod-tab:not(.active) .n { background: rgba(184,149,106,.3); color: #6E5B43; }

  /* 详情面板 */
  .prod-panel {
    margin: 14px 12px 0; background: #FFFCF4; border-radius: 8px;
    padding: 16px 16px 18px; box-shadow: 0 1px 3px rgba(110,91,67,.06);
    border: 1px solid rgba(184,149,106,.2);
  }
  .prod-panel.hide { display: none; }
  .prod-panel h3 {
    margin: 0 0 12px; font-size: 14px; font-weight: 800; color: #1a1a1a;
    display: flex; align-items: center; gap: 6px;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 2px;
  }
  .prod-panel h3::before {
    content: ''; width: 3px; height: 14px; background: #C9352B; border-radius: 1px;
  }

  /* 商品描述 */
  .prod-desc {
    background: rgba(232,213,179,.35); border-radius: 4px; padding: 11px 12px;
    font-size: 13px; color: #1a1a1a; line-height: 1.65;
    margin-bottom: 14px;
    border-left: 3px solid #C9352B;
  }

  /* 详情表格 */
  .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail-table tr { border-bottom: 1px dashed rgba(184,149,106,.25); }
  .detail-table tr:last-child { border-bottom: none; }
  .detail-table th, .detail-table td {
    padding: 10px 0; vertical-align: top; line-height: 1.55;
  }
  .detail-table th { color: #6E5B43; font-weight: 600; width: 78px; flex: none; }
  .detail-table td { color: #1a1a1a; font-weight: 500; }
  .detail-table .ico { display: inline-block; margin-right: 4px; vertical-align: middle; color: #C9352B; }

  /* 评价概览：宣纸渐变 */
  .review-summary {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #FBF3DF, #F5EBD8);
    border-radius: 8px; padding: 14px 14px; margin-bottom: 14px;
    border: 1px solid rgba(184,149,106,.25);
  }
  .review-score {
    font-size: 36px; font-weight: 900; color: #C9352B;
    line-height: 1; letter-spacing: -.5px; flex: none;
    font-family: "STKaiti", "KaiTi", "STSong", serif;
  }
  .review-score-info { flex: 1; min-width: 0; }
  .review-score-info .stars { font-size: 16px; color: #B8956A; letter-spacing: 1px; }
  .review-score-info .meta { font-size: 12px; color: #6E5B43; margin-top: 3px; }
  .review-score-info .meta b { color: #C9352B; font-weight: 800; }

  /* 评价列表 */
  .review-list .review-item { padding: 13px 0; border-bottom: 1px dashed rgba(184,149,106,.25); }
  .review-list .review-item:last-child { border-bottom: none; }
  .review-head { display: flex; align-items: center; gap: 10px; }
  .review-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; color: #F5EBD8;
    font-size: 14px; font-weight: 800; flex: none;
    background: #C9352B;
  }
  .review-name { font-size: 13px; font-weight: 700; color: #1a1a1a; font-family: "STKaiti", "KaiTi", serif; }
  .review-stars { font-size: 12px; color: #B8956A; letter-spacing: .5px; margin-top: 1px; }
  .review-time { font-size: 11px; color: #6E5B43; margin-left: auto; }
  .review-text { font-size: 13px; color: #1a1a1a; line-height: 1.7; margin-top: 8px; word-break: break-word; }
  .review-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .review-img {
    width: 72px; height: 72px; object-fit: cover; border-radius: 6px;
    background: #f3f3f3; cursor: pointer; flex: none;
  }
  .review-more {
    width: 100%; padding: 11px; margin-top: 14px;
    background: rgba(232,213,179,.35); border: 1px dashed rgba(184,149,106,.4);
    border-radius: 6px; color: #6E5B43; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: "STKaiti", "KaiTi", serif; letter-spacing: 2px;
  }
  .review-more:active { background: #FBF3DF; border-color: #C9352B; color: #C9352B; }

  /* 底部固定栏：宣纸 + 朱红印章按钮 */
  .prod-foot {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(248,239,217,.98); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(184,149,106,.3); display: flex; align-items: center; gap: 10px;
    z-index: 50; box-shadow: 0 -4px 18px rgba(110,91,67,.12);
  }
  .prod-foot-cart {
    width: 46px; height: 46px; border-radius: 50%; position: relative; flex: none;
    background: #C9352B; color: #F5EBD8;
    display: grid; place-items: center; border: 2px solid #F5EBD8; cursor: pointer;
    box-shadow: 0 0 0 1.5px #C9352B;
  }
  .prod-foot-cart svg { width: 24px; height: 24px; stroke: #F5EBD8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .prod-foot-cart .dot {
    position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 999px; background: #1a1a1a; color: #F5EBD8; font-size: 11px; font-weight: 800;
    display: grid; place-items: center; border: 2px solid #F5EBD8;
    font-family: "STKaiti", "KaiTi", serif;
  }
  .prod-foot-cart .dot.hide { display: none; }
  .prod-foot-info { flex: 1; min-width: 0; line-height: 1.3; }
  .prod-foot-info .total { font-size: 17px; font-weight: 800; color: #C9352B; font-family: "STKaiti", "KaiTi", "STSong", serif; }
  .prod-foot-info .tip { font-size: 11px; color: #6E5B43; }
  .prod-foot-add {
    padding: 11px 26px; border-radius: 4px; background: #C9352B; color: #F5EBD8;
    font-weight: 700; font-size: 15px; flex: none;
    box-shadow: 0 3px 10px rgba(201,53,43,.32), 0 0 0 1px rgba(184,149,106,.3) inset;
    cursor: pointer; font-family: "STKaiti", "KaiTi", serif; letter-spacing: 4px;
    border: 1px solid rgba(184,149,106,.3);
  }
  .prod-foot-add:active { transform: scale(.96); }
  .prod-foot-add.dis { background: #C8B8A7; color: #F5EBD8; box-shadow: none; cursor: not-allowed; }

  /* 规格弹窗 */
  .spec-head-prod { display: flex; gap: 12px; margin-bottom: 14px; }
  .spec-pic-prod {
    width: 64px; height: 64px; border-radius: 6px; flex: none;
    background-size: cover; background-position: center; display: grid; place-items: center;
    font-size: 30px; border: 1px solid rgba(184,149,106,.25);
  }

  /* 加载/空状态 */
  .empty-prod { text-align: center; padding: 80px 20px; color: #6E5B43; }
  .empty-prod .icon { font-size: 52px; opacity: .35; margin-bottom: 10px; }
  .empty-prod .go-back {
    margin-top: 16px; display: inline-block; padding: 9px 22px;
    background: #C9352B; color: #F5EBD8; border-radius: 4px; font-weight: 700; font-size: 13px;
    font-family: "STKaiti", "KaiTi", serif; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="app">

  <header class="prod-hero" id="hero">
    <button class="prod-back" onclick="goBack()" aria-label="返回">‹</button>
    <div class="prod-shop-name" id="shopName">商品详情<small id="shopSub">加载中…</small></div>
  </header>

  <div id="content">
    <section class="prod-pics" id="pics" style="display:none">
      <div class="prod-track" id="picTrack"></div>
      <div class="prod-dots" id="picDots"></div>
    </section>

    <section class="prod-info" id="info" style="display:none">
      <div class="prod-price-row">
        <span class="prod-price" id="price"></span>
        <span class="prod-old" id="old"></span>
        <span class="prod-tag-disc" id="discount" style="display:none"></span>
      </div>
      <div class="prod-name" id="name"></div>
      <div class="prod-stats" id="stats"></div>
    </section>

    <nav class="prod-tabs" id="tabs" style="display:none">
      <div class="prod-tab active" data-tab="detail" onclick="switchTab('detail')">📋 商品详情</div>
      <div class="prod-tab" data-tab="review" onclick="switchTab('review')">💬 评价 <span class="n" id="reviewCount">0</span></div>
    </nav>

    <section class="prod-panel" id="panelDetail" style="display:none">
      <h3>商品详情</h3>
      <div class="prod-desc" id="desc"></div>
      <table class="detail-table" id="detailTable"></table>
    </section>

    <section class="prod-panel hide" id="panelReview" style="display:none">
      <h3>用户评价</h3>
      <div class="review-summary" id="reviewSummary"></div>
      <div class="review-list" id="reviewList"></div>
      <button class="review-more" id="reviewMore" style="display:none" onclick="showAllReviews()">查看更多评价</button>
    </section>

    <div class="empty-prod hide" id="emptyProd">
      <div class="icon">🍴</div>
      <div>商品不存在或已下架</div>
      <a class="go-back" href="customer.html">返回菜单</a>
    </div>
  </div>

  <footer class="prod-foot" id="foot" style="display:none">
    <div class="prod-foot-cart" onclick="goCart()" title="查看购物车">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 9 L6 21 L23 21 L26 10 Z" />
        <path d="M26 10 L30 10" />
        <line x1="11" y1="11.5" x2="11.5" y2="21" />
        <line x1="16" y1="10.8" x2="16" y2="21" />
        <line x1="21" y1="10.8" x2="20.5" y2="21" />
        <circle cx="11" cy="26" r="2.6" />
        <circle cx="22" cy="26" r="2.6" />
      </svg>
      <span class="dot hide" id="footDot">0</span>
    </div>
    <div class="prod-foot-info">
      <div class="total" id="footTotal">¥0.00</div>
      <div class="tip" id="footTip">未选购商品</div>
    </div>
    <button class="prod-foot-add" id="footAdd" onclick="onAdd()">加入购物车</button>
  </footer>

</div>

<!-- 规格弹窗 -->
<div class="mask" id="specMask">
  <div class="sheet" id="specSheet"></div>
</div>

<div id="toast"></div>

<script src="assets/sync.js"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/sync-github.js"></script>
<script src="assets/store.js"></script>
<script src="assets/product-extras.js"></script>
<script src="assets/lightbox.js"></script>
<script src="assets/cart-shared.js"></script>
<script src="assets/review-store.js"></script>
<script>
/* ================= 状态 ================= */
var D = null;
var P = null;             // 当前商品
var curImgIdx = 0;
var picTimer = null;
var reviewVisible = 4;    // 评价初始显示条数
var specSel = { cup: 0, temp: 0, sugar: 0, extra: [] };
var specQty = 1;

/* ================= 工具 ================= */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function money(n) { return '¥' + (Math.round(n * 100) / 100).toFixed(2); }
function toast(msg) {
  var t = $('toast'); if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
}

/* ================= URL 参数 ================= */
var pid = new URLSearchParams(location.search).get('id') || '';
var table = new URLSearchParams(location.search).get('t') || '';

/* ================= 入口 ================= */
window.addEventListener('DOMContentLoaded', function () {
  D = Store.read();
  if (!D || !D.products) {
    showEmpty(); return;
  }
  P = D.products.find(function (x) { return x.id === pid; });
  if (!P || !P.on) {
    showEmpty(); return;
  }
  renderHero();
  renderPics();
  renderInfo();
  renderTabs();
  renderDetail();
  renderReviews();
  renderFoot();
  bindFoot();
  SCart.onChange(function () { renderFoot(); });

  /* 云端同步：启动拉取最新；云端数据到达后若当前商品仍在，局部刷新 */
  Store.initCloud();
  Store.onChange(function (data) {
    if (!data || !data.products) return;
    D = data;
    var np = D.products.find(function (x) { return x.id === pid; });
    if (np) { P = np; renderInfo(); renderDetail(); renderReviews(); renderFoot(); }
  });
});

function showEmpty() {
  $('hero').style.display = 'none';
  $('emptyProd').classList.remove('hide');
  $('foot').style.display = 'none';
}

/* ================= Hero ================= */
function renderHero() {
  var shop = D.shop;
  $('shopName').firstChild.nodeValue = shop.name;
  document.title = P.name + ' · ' + shop.name + ' · 扫码点餐';
  var sub = (table ? ('桌号 ' + table + ' · ') : '') + shop.slogan;
  $('shopSub').textContent = sub;
}

/* ================= 轮播 ================= */
function show(el) { if (el) el.style.display = ''; }

function renderPics() {
  var images = ProductExtras.getImages(P);
  P._images = images; // 缓存
  curImgIdx = 0;
  var track = $('picTrack');
  track.innerHTML = images.map(function (src, i) {
    return '<div class="prod-slide" data-i="' + i + '" style="background-image:url(\'' + src + '\')">' +
             '<div class="prod-slide-zoom">🔍 点击放大</div>' +
           '</div>';
  }).join('');
  $('picDots').innerHTML = images.map(function (_, i) {
    return '<div class="prod-dot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"></div>';
  }).join('');
  // 点击放大
  Array.prototype.forEach.call(track.children, function (el) {
    el.addEventListener('click', function () {
      Lightbox.open(images, { start: parseInt(el.dataset.i, 10), title: P.name });
    });
  });
  // dot 点击
  Array.prototype.forEach.call($('picDots').children, function (el) {
    el.addEventListener('click', function () {
      goPic(parseInt(el.dataset.i, 10));
    });
  });
  // 自动轮播
  clearInterval(picTimer);
  picTimer = setInterval(function () { goPic((curImgIdx + 1) % images.length); }, 4000);
  show($('pics'));
}
function goPic(i) {
  curImgIdx = i;
  $('picTrack').style.transform = 'translateX(-' + (i * 100) + '%)';
  var dots = $('picDots').children;
  for (var j = 0; j < dots.length; j++) dots[j].classList.toggle('active', j === i);
}
/* 触摸滑动 */
(function attachTouch() {
  var sx = 0, sy = 0, dragging = false;
  $('picTrack').addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; dragging = true;
  }, { passive: true });
  $('picTrack').addEventListener('touchend', function (e) {
    if (!dragging) return; dragging = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      var len = (P._images || []).length;
      if (len) {
        var n = (curImgIdx + (dx < 0 ? 1 : -1) + len) % len;
        goPic(n);
      }
    }
  }, { passive: true });
})();

/* ================= 价格 + 名 ================= */
function renderInfo() {
  show($('info'));
  $('price').innerHTML = '<small>¥</small>' + P.price;
  if (P.old && P.old > P.price) {
    $('old').textContent = '¥' + P.old;
    var discount = Math.round(P.price / P.old * 10);
    $('discount').textContent = discount + ' 折';
    $('discount').style.display = '';
  } else {
    $('old').textContent = '';
    $('discount').style.display = 'none';
  }
  var tags = '';
  if (P.hot) tags += '<span class="tag tag-hot">🔥 热销</span>';
  if (P.banner && P.bannerTag) tags += '<span class="tag tag-warn">' + esc(P.bannerTag) + '</span>';
  $('name').innerHTML = esc(P.name) + ' ' + tags;
  var r = ProductExtras.getRating(P);
  $('stats').innerHTML =
    '<span>月售 <b>' + (P.sold || 0) + '</b></span>' +
    '<span>好评率 <b>' + r.percent + '%</b></span>' +
    (P.stock < 100 && P.stock > 0 ? '<span style="color:#C0392B">剩 <b>' + P.stock + '</b> 份</span>' : '') +
    (P.stock <= 0 ? '<span style="color:#C0392B">已售罄</span>' : '');
}

/* ================= Tab ================= */
function renderTabs() {
  show($('tabs'));
  var r = ProductExtras.getRating(P);
  $('reviewCount').textContent = r.count;
}
function switchTab(name) {
  var tabs = document.querySelectorAll('.prod-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].dataset.tab === name);
  $('panelDetail').classList.toggle('hide', name !== 'detail');
  $('panelReview').classList.toggle('hide', name !== 'review');
}

/* ================= 详情 ================= */
function renderDetail() {
  show($('panelDetail'));
  $('panelDetail').classList.remove('hide');
  var detail = ProductExtras.getDetail(P);
  $('desc').textContent = detail.desc || (P.desc || '精选好物，欢迎品尝～');
  var rows = [
    ['🧂', '原料',    detail.raw],
    ['🍽️', '份量',    detail.serving],
    ['🥗', '类型',    detail.type],
    ['👨‍🍳', '制作方法', detail.method],
    ['⏰', '保质期',  detail.shelf],
    ['💡', '小贴士',  detail.tips]
  ];
  var html = '';
  rows.forEach(function (r) {
    if (!r[2]) return;
    html += '<tr><th><span class="ico">' + r[0] + '</span>' + r[1] + '</th><td>' + esc(r[2]) + '</td></tr>';
  });
  $('detailTable').innerHTML = html;
}

/* ================= 评价（真实用户评价） ================= */
function renderReviews() {
  show($('panelReview'));
  $('panelReview').classList.remove('hide');

  var reviews = (window.ReviewStore ? ReviewStore.getByProduct(P.id) : []);
  var st = (window.ReviewStore ? ReviewStore.stats(P.id) : null);

  // 概览
  if (st) {
    var full = Math.round(st.avg);
    $('reviewSummary').innerHTML =
      '<div class="review-score mono">' + st.avg + '<small style="font-size:13px;color:var(--ink-2);font-weight:600;margin-left:2px">分</small></div>' +
      '<div class="review-score-info">' +
        '<div class="stars">' + '★'.repeat(full) + '☆'.repeat(5 - full) + '</div>' +
        '<div class="meta">好评率 <b>' + st.percent + '%</b> · 共 <b>' + st.count + '</b> 条评价</div>' +
      '</div>';
  } else {
    $('reviewSummary').innerHTML =
      '<div class="review-score-info" style="padding:4px 0">' +
        '<div class="meta">暂无评价 · 买过的顾客快来抢沙发 🛋️</div>' +
      '</div>';
  }

  // 列表
  if (reviews.length) {
    $('reviewList').innerHTML = reviews.slice(0, reviewVisible).map(renderReviewItem).join('');
    $('reviewMore').style.display = reviews.length > reviewVisible ? '' : 'none';
    // 图片点击放大（事件委托，避免内联传数组）
    Array.prototype.forEach.call($('reviewList').querySelectorAll('.review-img'), function (im) {
      var arr; try { arr = JSON.parse(im.getAttribute('data-imgs')); } catch (e) { arr = [im.src]; }
      var i = parseInt(im.getAttribute('data-i'), 10) || 0;
      im.addEventListener('click', function () { Lightbox.open(arr, { start: i }); });
    });
  } else {
    $('reviewList').innerHTML =
      '<div class="empty-hint" style="padding:26px 0">' +
        '<div class="icon">💬</div>' +
        '<div class="txt">还没有人评价，期待你的第一条～</div>' +
      '</div>';
    $('reviewMore').style.display = 'none';
  }

  // 评价角标用真实条数
  $('reviewCount').textContent = st ? st.count : 0;
}

function renderReviewItem(rv) {
  var imgs = (rv.images && rv.images.length)
    ? '<div class="review-imgs">' + rv.images.map(function (src, i) {
        return '<img class="review-img" data-imgs="' + esc(JSON.stringify(rv.images)) + '" data-i="' + i + '" src="' + src + '">';
      }).join('') + '</div>'
    : '';
  var stars = rv.stars || 5;
  return '<div class="review-item">' +
    '<div class="review-head">' +
      '<div class="review-avatar" style="background:' + (rv.color || '#999') + '">' + esc(rv.initial || '匿') + '</div>' +
      '<div><div class="review-name">' + esc(rv.user || '匿名食客') + '</div>' +
      '<div class="review-stars">' + '★'.repeat(stars) + '☆'.repeat(5 - stars) + '</div></div>' +
      '<div class="review-time">' + esc(rv.time || '') + '</div>' +
    '</div>' +
    (rv.text ? '<div class="review-text">' + esc(rv.text) + '</div>' : '') +
    imgs +
  '</div>';
}

function showAllReviews() {
  reviewVisible = (window.ReviewStore ? ReviewStore.getByProduct(P.id).length : 0);
  renderReviews();
  $('reviewMore').style.display = 'none';
}

/* ================= 底部 ================= */
function renderFoot() {
  show($('foot'));
  var cart = SCart.load();
  var total = cart.reduce(function (s, c) { return s + c.price * c.qty; }, 0);
  var count = cart.reduce(function (s, c) { return s + c.qty; }, 0);
  $('footTotal').textContent = money(total);
  $('footTip').textContent = cart.length ? ('已选 ' + count + ' 件') : '未选购商品';
  $('footDot').textContent = count;
  $('footDot').classList.toggle('hide', !count);
  var off = !P.on || P.stock <= 0;
  $('footAdd').textContent = off ? '已售罄' : '加入购物车';
  $('footAdd').classList.toggle('dis', off);
}
function bindFoot() {
  // 跨页面同步刷新
  SCart.onChange(renderFoot);
}

/* ================= 加入购物车 ================= */
function onAdd() {
  if (!P.on || P.stock <= 0) { toast('已售罄'); return; }
  var needSpec = ['鲜果茶', '奶茶拿铁', '招牌推荐'].indexOf(P.cat) >= 0;
  if (needSpec) {
    specSel = { cup: 0, temp: 0, sugar: 0, extra: [] };
    specQty = 1;
    drawSpec();
    openMask('specMask');
  } else {
    SCart.add(P, '', P.price, 1);
    toast('已加入购物车 ✓');
    bumpFootDot();
    renderFoot();
  }
}
function bumpFootDot() {
  var d = $('footDot');
  if (!d) return;
  d.style.transition = 'transform .25s';
  d.style.transform = 'scale(1.4)';
  setTimeout(function () { d.style.transform = 'scale(1)'; }, 250);
}

/* ================= 规格 ================= */
function openMask(id) {
  var m = $(id); m.classList.add('show'); document.body.style.overflow = 'hidden';
}
function closeMask(id) {
  var m = $(id); m.classList.remove('show'); document.body.style.overflow = '';
}

function drawSpec() {
  var S = D.specs;
  var extraP = specSel.extra.reduce(function (s, i) { return s + S.extra.options[i].p; }, 0);
  var unit = P.price + S.cup.options[specSel.cup].p + extraP;
  var pic = P.img ? P.img : ProductExtras.getEmojiImage(P, 200);
  var picStyle = P.img
    ? 'background-image:url(\'' + P.img + '\')'
    : ('background:' + (P.color || '#FFF1DD'));
  var picInner = P.img ? '' : P.emoji;
  var html = '<div class="spec-head-prod">' +
      '<div class="spec-pic-prod' + (P.img ? ' has-img' : '') + '" style="' + picStyle + '">' + picInner + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:16px;font-weight:800">' + esc(P.name) + '</div>' +
        '<div class="price" style="margin-top:4px"><small>¥</small>' + unit.toFixed(2) + '</div>' +
      '</div></div>';

  ['cup', 'temp', 'sugar'].forEach(function (k) {
    html += '<div class="spec-group" style="margin-bottom:14px">' +
      '<div class="spec-label" style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink-2)">' + S[k].label + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        S[k].options.map(function (o, i) {
          return '<div class="opt' + (specSel[k] === i ? ' sel' : '') + '" ' +
            'onclick="pickSpec(\'' + k + '\',' + i + ')" ' +
            'style="padding:7px 14px;border-radius:999px;background:#F5F0EC;font-size:13px;color:var(--ink-2);border:1px solid transparent;cursor:pointer;' +
            (specSel[k] === i ? 'background:var(--brand-soft);color:var(--brand);font-weight:700;border-color:#FFC9BE;' : '') + '">' +
            o.n + (o.p ? ' +' + o.p : '') + '</div>';
        }).join('') + '</div></div>';
  });
  html += '<div class="spec-group" style="margin-bottom:14px">' +
      '<div class="spec-label" style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink-2)">' + S.extra.label + '（可多选）</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        S.extra.options.map(function (o, i) {
          var on = specSel.extra.indexOf(i) >= 0;
          return '<div class="opt' + (on ? ' sel' : '') + '" onclick="pickExtra(' + i + ')" ' +
            'style="padding:7px 14px;border-radius:999px;background:#F5F0EC;font-size:13px;color:var(--ink-2);border:1px solid transparent;cursor:pointer;' +
            (on ? 'background:var(--brand-soft);color:var(--brand);font-weight:700;border-color:#FFC9BE;' : '') + '">' +
            o.n + ' +' + o.p + '</div>';
        }).join('') + '</div></div>';

  html += '<div style="display:flex;align-items:center;margin:18px 0 4px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--ink-2)">数量</div>' +
      '<div style="margin-left:auto;display:flex;align-items:center;gap:14px">' +
      '<button onclick="specStep(-1)" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #DDD5CF;background:#fff;color:var(--ink-3);font-size:17px;display:grid;place-items:center;line-height:1">−</button>' +
      '<span style="font-size:16px;font-weight:700;min-width:20px;text-align:center">' + specQty + '</span>' +
      '<button onclick="specStep(1)" style="width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);background:#fff;font-size:17px;display:grid;place-items:center;line-height:1">+</button>' +
      '</div></div>' +
      '<button onclick="confirmSpec()" style="width:100%;padding:13px;margin-top:14px;font-size:15px;border:none;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(232, 132, 28, .35);cursor:pointer">' +
      '加入购物车 · ' + money(unit * specQty) + '</button>';

  $('specSheet').innerHTML = html;
}
function pickSpec(k, i) { specSel[k] = i; drawSpec(); }
function pickExtra(i) {
  var idx = specSel.extra.indexOf(i);
  if (idx >= 0) specSel.extra.splice(idx, 1); else specSel.extra.push(i);
  drawSpec();
}
function specStep(d) { specQty = Math.max(1, Math.min(30, specQty + d)); drawSpec(); }

function confirmSpec() {
  var S = D.specs;
  var names = [S.cup.options[specSel.cup].n, S.temp.options[specSel.temp].n, S.sugar.options[specSel.sugar].n];
  var extraP = 0;
  specSel.extra.forEach(function (i) {
    names.push(S.extra.options[i].n);
    extraP += S.extra.options[i].p;
  });
  var unit = P.price + S.cup.options[specSel.cup].p + extraP;
  SCart.add(P, names.join(' / '), unit, specQty);
  closeMask('specMask');
  toast('已加入购物车 ✓');
  bumpFootDot();
  renderFoot();
}

/* ================= 导航 ================= */
function goBack() {
  if (history.length > 1) history.back();
  else location.href = 'customer.html' + (table ? '?t=' + table : '');
}
function goCart() {
  location.href = 'customer.html' + (table ? '?t=' + table : '');
}
</script>
