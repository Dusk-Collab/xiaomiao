<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>商家后台 · 扫码点餐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
body { background: #F7EFE3; }
#shell { display: flex; min-height: 100vh; }

/* ---- 侧边栏 ---- */
.side {
  width: 208px; flex: none; background: #fff; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.side-brand { padding: 18px 16px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.side-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; font-size: 20px; flex: none; background-size: cover; background-position: center; overflow: hidden; }
.side-logo img { width: 100%; height: 100%; object-fit: cover; }
.nav { padding: 10px 10px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  font-size: 14px; color: var(--ink-2); margin-bottom: 3px; transition: all .15s; position: relative;
}
.nav-item:hover { background: #FAF6F3; }
.nav-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.nav-icon { font-size: 17px; width: 22px; text-align: center; flex: none; }
.nav-badge {
  margin-left: auto; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--brand); color: #fff; font-size: 11px; font-weight: 800;
  display: grid; place-items: center;
}
.side-foot { padding: 12px; border-top: 1px solid var(--line); }

/* ---- 内容区 ---- */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40; flex-wrap: wrap;
}
.page-title { font-size: 17px; font-weight: 800; }
.body { padding: 18px 20px 90px; flex: 1; }
.card { background: #fff; border-radius: var(--r-m); padding: 16px; box-shadow: var(--sh-s); margin-bottom: 14px; }
.card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 7px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat {
  background: #fff; border-radius: var(--r-m); padding: 14px 16px; box-shadow: var(--sh-s);
  border-left: 3px solid var(--brand-2); transition: transform .15s, box-shadow .15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--sh-m); cursor: pointer; }
.stat-v { font-size: 25px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: var(--ink-3); margin-top: 3px; }

/* ---- 管理员登录（单卡切换：密码登录 / 验证码登录 / 注册） ---- */
.login-mask { position: fixed; inset: 0; background: rgba(20,14,8,.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: grid; place-items: center; z-index: 9999; animation: lFade .25s ease; padding: 20px; box-sizing: border-box; }
@keyframes lFade { from { opacity: 0; } to { opacity: 1; } }
.login-card { background: #fff; border-radius: 24px; width: 400px; max-width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.28); overflow: hidden; animation: lPop .35s cubic-bezier(.22,1,.36,1); position: relative; }
@keyframes lPop { from { transform: translateY(22px) scale(.97); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.login-top { background: linear-gradient(135deg,#E8352E 0%,#F47867 100%); padding: 30px 28px 26px; text-align: center; color: #fff; }
.login-top .login-logo { font-size: 46px; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
.login-top .login-name { font-size: 20px; font-weight: 800; letter-spacing: .4px; }
.login-top .login-sub { font-size: 12.5px; opacity: .92; margin-top: 3px; }
.login-body { padding: 26px 28px 22px; }
.login-h { font-size: 18px; font-weight: 800; color: #1a1a1a; margin-bottom: 16px; text-align: center; }
.login-field { margin-bottom: 13px; }
.login-phone { display: flex; align-items: center; border: 1.5px solid #ececec; border-radius: 12px; background: #fafafa; height: 50px; padding: 0 12px; transition: border-color .15s, box-shadow .15s; box-sizing: border-box; }
.login-phone:focus-within { border-color: #E8352E; background: #fff; box-shadow: 0 0 0 3px rgba(232,53,46,.1); }
.login-cc { font-size: 15px; color: #555; font-weight: 600; padding-right: 10px; border-right: 1px solid #eee; margin-right: 10px; }
.login-input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: #1a1a1a; height: 100%; min-width: 0; }
.login-text { width: 100%; height: 50px; border: 1.5px solid #ececec; border-radius: 12px; padding: 0 14px; font-size: 15px; outline: none; background: #fafafa; color: #1a1a1a; box-sizing: border-box; transition: border-color .15s, box-shadow .15s; }
.login-text:focus { border-color: #E8352E; background: #fff; box-shadow: 0 0 0 3px rgba(232,53,46,.1); }
.login-pwd-wrap { position: relative; }
.login-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 17px; padding: 8px; color: #bbb; line-height: 1; border-radius: 8px; transition: color .15s, background .15s; }
.login-eye:hover { color: #666; background: #f3f3f3; }
.login-code { display: flex; align-items: center; gap: 10px; }
.login-code .login-input { background: #fafafa; border: 1.5px solid #ececec; border-radius: 12px; height: 50px; padding: 0 14px; transition: border-color .15s, box-shadow .15s; box-sizing: border-box; }
.login-code .login-input:focus { border-color: #E8352E; background: #fff; box-shadow: 0 0 0 3px rgba(232,53,46,.1); }
.login-codebtn { flex: 0 0 auto; height: 50px; padding: 0 14px; border: 1.5px solid #E8352E; border-radius: 12px; background: #fff; color: #E8352E; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all .15s; }
.login-codebtn:hover:not(:disabled) { background: #E8352E; color: #fff; }
.login-codebtn:disabled { border-color: #ddd; color: #bbb; cursor: wait; }
.login-btn { width: 100%; height: 50px; border: none; border-radius: 12px; background: linear-gradient(135deg,#E8352E 0%,#F47867 100%); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 22px rgba(232,53,46,.3); transition: transform .1s, box-shadow .15s; letter-spacing: 2px; margin-top: 4px; }
.login-btn:hover { box-shadow: 0 10px 26px rgba(232,53,46,.4); }
.login-btn:active { transform: scale(.98); }
.login-btn:disabled { opacity: .6; cursor: wait; }
.login-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; }
.login-foot a { color: #E8352E; text-decoration: none; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.login-foot a:hover { opacity: .72; }
.login-err { animation: lShake .35s; border-color: #E8352E !important; }
@keyframes lShake { 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
.login-pane { display: none; }
.login-pane.active { display: block; animation: paneIn .25s ease; }
@keyframes paneIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 460px) {
  .login-card { width: 100%; border-radius: 20px; }
  .login-top { padding: 26px 22px 22px; }
  .login-body { padding: 22px 22px 18px; }
}

/* ---- 顶部同步状态徽标 ---- */
.sync-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: #F5F5F5; color: #999; transition: all .25s; }
.sync-badge.connecting { background: #FFF7EA; color: #C58A1A; }
.sync-badge.online { background: #E8F8EE; color: #1B9E5B; }
.sync-badge.offline { background: #FEE; color: #C0392B; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync-badge.connecting .sync-dot { animation: sPulse 1.2s infinite; }
@keyframes sPulse { 0%,100%{opacity:1} 50%{opacity:.35} }

@media (max-width: 520px) {
  .login-card { padding: 0; }
}
/* ---- 订单看板 ---- */
.kb-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.kb-tab {
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: #fff; color: var(--ink-2); border: 1px solid var(--line);
}
.kb-tab.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(232,53,46,.25); }
.kb-tab .n { opacity: .75; margin-left: 3px; }

.order-bulk-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #FFF7EA; border: 1px solid #F3DFC0; border-radius: 10px; padding: 9px 11px; margin: 8px 0 14px;
}
.order-bulk-bar .sel-all { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
.order-bulk-bar .sel-info { font-size: 12px; color: var(--ink-3); flex: 1; }
.order-bulk-bar .reset-btn {
  margin-left: auto; font-size: 12px; color: #C0392B; border: 1px solid #F3DFC0; background: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600;
}
.order-bulk-bar .reset-btn:hover { background: #FEE; border-color: #C0392B; }

.order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 12px; }
.owrap { position: relative; border-radius: var(--r-m); overflow: hidden; background: #E8DFD8; }
.owrap .act-l, .owrap .act-r {
  position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center;
  padding: 0 20px; font-size: 14px; font-weight: 800; color: #fff;
}
.owrap .act-r { right: 0; justify-content: flex-end; background: var(--ok); }
.owrap .act-l { left: 0; background: #94908C; }
.ocard {
  background: #fff; padding: 13px 14px; position: relative; z-index: 1;
  transition: transform .22s cubic-bezier(.22,1,.36,1); touch-action: pan-y;
  border-radius: var(--r-m); cursor: grab;
}
.ocard.dragging { transition: none; cursor: grabbing; }
.ocard.new { animation: pop .35s; box-shadow: inset 0 0 0 2px var(--brand); }
.o-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.o-code {
  font-size: 27px; font-weight: 900; color: var(--brand); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: .5px;
}
.o-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.o-items { border-top: 1px dashed var(--line); padding-top: 9px; margin-bottom: 10px; }
.o-line { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; align-items: baseline; }
.o-line .q { color: var(--brand); font-weight: 800; flex: none; min-width: 22px; }
.o-line .s { font-size: 11px; color: var(--ink-3); }
.o-remark {
  background: #FFF8E6; border: 1px solid #FBE8B8; border-radius: 8px; padding: 6px 9px;
  font-size: 12px; color: #8A6410; margin-bottom: 9px;
}
.o-foot { display: flex; align-items: center; gap: 8px; }
.o-price { font-size: 17px; font-weight: 800; }
.swipe-hint { font-size: 10.5px; color: var(--ink-3); text-align: center; margin-top: 7px; }

/* ---- 商品表 ---- */
.ptable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ptable th {
  text-align: left; padding: 9px 10px; font-size: 12px; color: var(--ink-3);
  font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.ptable td { padding: 9px 10px; border-bottom: 1px solid #F6F1ED; vertical-align: middle; }
.ptable tr:hover td { background: #FDFAF8; }
.p-emoji { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 21px; }
/* 商品缩略图（可上传图片） */
.p-thumb {
  position: relative; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  font-size: 21px; cursor: pointer; overflow: hidden; border: 1px dashed #E2D6CC; background-size: cover; background-position: center;
}
.p-thumb:hover { border-color: var(--brand-2); }
.p-thumb.has-img { border-style: solid; }
.thumb-cam { opacity: .45; font-size: 17px; }
.thumb-x {
  position: absolute; top: 0; right: 0; width: 16px; height: 16px; line-height: 15px; text-align: center;
  background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-bottom-left-radius: 8px;
}
/* 批量操作条 */
.bulk-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: #FFF7EA; border: 1px solid #F3DFC0; border-radius: 10px; padding: 9px 11px; margin: 4px 0 12px;
}
.bulk-bar .sel-all { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
.bulk-bar .sel-info { font-size: 12px; color: var(--ink-3); }
.bulk-bar .auto-cat { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.sel-box { width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand); }
.inline-in {
  border: 1px solid transparent; background: transparent; padding: 5px 7px; border-radius: 7px;
  width: 100%; transition: all .15s;
}
.inline-in:hover { background: #F7F2EE; }
.inline-in:focus { background: #fff; border-color: var(--brand-2); outline: none; }
.w-price { width: 84px; }
.w-sold { width: 72px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  font-size: 14px; color: var(--ink-3); transition: all .15s;
}
.icon-btn:hover { background: #F5F0EC; color: var(--brand); }

/* ---- 表单 ---- */
.form-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #F6F1ED; }
.form-row:last-child { border-bottom: none; }
.form-label { font-size: 13.5px; font-weight: 600; min-width: 108px; flex: none; }
.form-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; font-weight: 400; }
.form-ctl { flex: 1; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

/* ---- 二维码 ---- */
.qr-box {
  background: #fff; border-radius: var(--r-l); padding: 18px; text-align: center;
  box-shadow: var(--sh-m); width: 268px; border: 2px solid var(--brand); position: relative;
}
.qr-top { background: var(--grad); color: #fff; margin: -18px -18px 14px; padding: 14px; border-radius: 18px 18px 0 0; }
canvas.qr { border-radius: 8px; }

/* ---- 声音提示条 ---- */
#soundBar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 11px; z-index: 70; box-shadow: var(--sh-l);
  font-size: 13px; animation: slideUp .3s;
}
#newOrderFlash {
  position: fixed; inset: 0; pointer-events: none; z-index: 65;
  box-shadow: inset 0 0 0 5px var(--brand); opacity: 0; transition: opacity .3s;
}
#newOrderFlash.on { opacity: 1; }

/* ---- 移动端 ---- */
.mobile-nav { display: none; }
@media (max-width: 860px) {
  .side { display: none; }
  .body { padding: 14px 12px 84px; }
  .topbar { padding: 11px 14px; }
  .order-grid { grid-template-columns: 1fr; }
  .mobile-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.97);
    backdrop-filter: blur(10px); border-top: 1px solid var(--line); z-index: 60;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .mn-item { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 4px 0; position: relative; }
  .mn-item.on { color: var(--brand); font-weight: 700; }
  .mn-icon { font-size: 20px; display: block; margin-bottom: 1px; }
  .mn-badge {
    position: absolute; top: 0; left: 50%; margin-left: 6px; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: 999px; background: var(--brand); color: #fff;
    font-size: 10px; font-weight: 800; display: grid; place-items: center;
  }
  #soundBar { bottom: 72px; }
  .ptable th:nth-child(4), .ptable td:nth-child(4) { display: none; }
  .form-label { min-width: 78px; font-size: 13px; }
}

/* ---- 商品管理：侧边栏 + 主区域布局 ---- */
.product-layout { display: flex; gap: 16px; align-items: flex-start; }
.product-sidebar { width: 220px; flex: none; }
.product-main { flex: 1; min-width: 0; }

.sidebar-section {
  background: #fff; border-radius: var(--r-m); padding: 12px 14px 14px;
  box-shadow: var(--sh-s); margin-bottom: 12px;
}
.sidebar-section h4 {
  margin: 0 0 10px; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; color: var(--ink); cursor: pointer; user-select: none;
}
.sidebar-section h4 .fold-icon {
  font-size: 12px; color: var(--ink-3); transition: transform .25s ease;
  width: 20px; height: 20px; display: grid; place-items: center;
}
.sidebar-section.collapsed h4 .fold-icon { transform: rotate(-90deg); }
.sidebar-section .sidebar-body {
  overflow: hidden; transition: max-height .3s ease, opacity .25s ease;
  max-height: 999px; opacity: 1;
}
.sidebar-section.collapsed .sidebar-body {
  max-height: 0; opacity: 0; pointer-events: none;
}

.cat-list { display: flex; flex-direction: column; gap: 2px; }
.cat-item {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; border-radius: 8px; font-size: 13px;
  cursor: pointer; transition: background .15s; user-select: none;
}
.cat-item:hover { background: #FAF6F3; }
.cat-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-count { font-size: 11.5px; color: var(--ink-3); background: #F7F2EE; padding: 1px 6px; border-radius: 999px; font-weight: 600; }
.cat-item.on .cat-count { background: rgba(232,132,28,.15); }
.cat-del { opacity: 0; font-size: 12px; color: #C0392B; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; transition: opacity .15s; }
.cat-item:hover .cat-del { opacity: .6; }
.cat-del:hover { opacity: 1 !important; background: #FEF0F0; }

.banner-list { display: flex; flex-direction: column; gap: 6px; }
.banner-empty { font-size: 12px; color: var(--ink-3); text-align: center; padding: 14px 6px; background: #FDFAF8; border-radius: 8px; }
.banner-item {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px;
  background: #FDFAF8; font-size: 12.5px; transition: background .15s;
}
.banner-item:hover { background: #F5F0EC; }
.banner-thumb { width: 28px; height: 28px; border-radius: 6px; background-size: cover; background-position: center; flex: none; }
.banner-emoji { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-size: 16px; background: var(--brand-soft); flex: none; }
.banner-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.banner-tag { font-size: 10.5px; color: var(--brand); background: var(--brand-soft); padding: 1px 5px; border-radius: 4px; font-weight: 600; flex: none; }
.banner-del { opacity: 0; font-size: 12px; color: #C0392B; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; cursor: pointer; transition: opacity .15s; }
.banner-item:hover .banner-del { opacity: .6; }
.banner-del:hover { opacity: 1 !important; background: #FEF0F0; }

/* ---- 小型模态弹窗 ---- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(30,22,18,.45);
  display: none; place-items: center; z-index: 80; padding: 16px;
  animation: fadeIn .18s ease both;
}
.modal-mask.show { display: grid; }
.modal-card {
  background: #fff; border-radius: var(--r-m); padding: 20px 22px 18px;
  width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(30,22,18,.2);
  animation: popIn .2s ease both;
}
.modal-card h4 { margin: 0 0 14px; font-size: 15px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.modal-card .modal-input {
  width: 100%; padding: 10px 13px; font-size: 14px; border: 1px solid var(--line);
  border-radius: 10px; background: #FAF7F4; outline: none; margin-bottom: 8px; transition: border-color .15s, box-shadow .15s;
  box-sizing: border-box;
}
.modal-card .modal-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: #fff; }
.modal-card .modal-row { margin-bottom: 14px; }
.modal-card .modal-row label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: block; }
.modal-card .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.modal-card .modal-btns button { padding: 8px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: transform .12s, opacity .15s; }
.modal-card .modal-btns button:hover { transform: translateY(-1px); }
.modal-card .modal-btns .btn-cancel { background: #F5F0EC; color: var(--ink-2); }
.modal-card .modal-btns .btn-confirm { background: var(--grad); color: #fff; }
.modal-card .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.modal-card .modal-tag {
  padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: #F5F0EC; color: var(--ink-2); cursor: pointer; border: 1.5px solid transparent;
  transition: all .15s;
}
.modal-card .modal-tag:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.modal-card .modal-tag.on { background: var(--brand); color: #fff; border-color: var(--brand); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* ===== 手机端适配兜底：避免放大/横向溢出/布局错乱 ===== */
@media (max-width: 768px) {
  .product-layout { flex-direction: column; gap: 12px; }
  .product-sidebar { width: 100%; }
  .product-main { width: 100%; }
  .form-row { flex-direction: column; align-items: stretch; gap: 5px; padding: 12px 0; }
  .form-label { min-width: 0; font-size: 13px; }
  .form-ctl { justify-content: flex-start; flex-wrap: wrap; }
  .form-ctl select, .form-ctl input { width: 100%; box-sizing: border-box; }
  .ptable { display: block; width: 100%; overflow-x: auto; white-space: nowrap; font-size: 12px; }
  .ptable th, .ptable td { padding: 7px 6px; }
  .modal-card { width: 92% !important; max-width: 92% !important; }
  .qr-box { width: auto; max-width: 100%; }
  .card { padding: 13px 12px; }
  .topbar { gap: 8px; }
  .page-title { font-size: 15px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-v { font-size: 21px; }
  .bulk-bar, .order-bulk-bar { gap: 6px; padding: 8px; }
  .o-code { font-size: 22px; }
  .order-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="shell">
  <aside class="side">
    <div class="side-brand">
      <div class="side-logo" id="sideLogo">🧋</div>
      <div style="min-width:0">
        <div style="font-size:13.5px;font-weight:800" class="ell" id="sideName">小淼饭店</div>
        <div style="font-size:11px;color:var(--ink-3)">商家管理后台</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
        <span id="sideStatusDot" style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>
        <span id="sideStatus">营业中</span>
        <div class="switch on" id="quickOpen" style="margin-left:auto;transform:scale(.82)"></div>
      </div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="openCloudSettings()">☁ 云端同步设置</button>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px;font-size:11.5px;color:#999" onclick="doLogout()">↪ 退出登录</button>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="page-title" id="pageTitle">订单看板</div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="tag" id="liveTag" style="background:#E7F6EC;color:var(--ok)">● 实时同步中</span>
        <span class="sync-badge" id="syncBadge">☁ 连接中…</span>
        <button class="btn btn-ghost btn-sm" onclick="openCustomer()">👀 顾客视角</button>
        <button class="btn btn-ghost btn-sm" onclick="testOrder()">🧪 模拟来单</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>

<div class="mobile-nav" id="mobileNav"></div>
<div id="newOrderFlash"></div>
<div id="toast"></div>

<!-- 小型模态弹窗（自定义 prompt） -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalCard">
    <h4 id="modalTitle">提示</h4>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="modalCancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" id="modalConfirm" onclick="modalConfirm()">确定</button>
    </div>
  </div>
</div>

<!-- 云端同步设置 -->
<div class="modal-mask" id="cloudMask" onclick="if(event.target===this)hideCloud()">
  <div class="modal-card" style="max-width:430px">
    <h4>☁ 云端同步设置</h4>
    <div id="cloudBody"></div>
  </div>
</div>

<script src="assets/sync.js"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/sync-github.js"></script>
<script src="assets/store.js"></script>
<script src="assets/qrcode.js"></script>
<script>
/* ================= 基础 ================= */
var D = Store.read();
var page = 'orders';
var kbTab = 'pending';
var soundReady = false;
var audioCtx = null;
var knownIds = {};
var orderSelIds = {};    // 已勾选订单 id 集合（批量操作用）
var prodFilterCat = '';  // 商品分类筛选
var sidebarColl = { cat: false, banner: false }; // 侧边栏折叠状态：false=展开, true=折叠
var statsFilter = 'all'; // 经营数据订单筛选：all | valid | canceled

var PAGES = [
  { k: 'orders',   t: '订单看板', i: '📋' },
  { k: 'products', t: '商品管理', i: '🧋' },
  { k: 'coupons',  t: '优惠券',   i: '🎟' },
  { k: 'shop',     t: '店铺设置', i: '⚙️' },
  { k: 'qrcode',   t: '点餐码',   i: '🔳' },
  { k: 'stats',    t: '经营数据', i: '📊' }
];

function $(id) { return document.getElementById(id); }
function money(n) { return Store.money(n); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function openMap(address) {
  var q = encodeURIComponent(address);
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.open('http://maps.apple.com/?q=' + q, '_blank');
  } else {
    window.open('https://uri.amap.com/search?keyword=' + q, '_blank');
  }
}
function toast(m) {
  var t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
}
function save(fn) { Store.update(fn); D = Store.read(); }

/* ---------- 自定义模态弹窗 ---------- */
var _modalCb = null;
function showModal(title, html, confirmCb) {
  var mask = $('modalMask');
  $('modalTitle').innerHTML = title;
  $('modalBody').innerHTML = html;
  _modalCb = confirmCb;
  mask.style.display = 'grid';
  requestAnimationFrame(function () { mask.classList.add('show'); });
  // 聚焦第一个输入框
  var inp = mask.querySelector('.modal-input');
  if (inp) setTimeout(function () { inp.focus(); }, 60);
}
function closeModal() {
  var mask = $('modalMask');
  mask.classList.remove('show');
  setTimeout(function () { mask.style.display = 'none'; _modalCb = null; }, 180);
}
function modalConfirm() {
  if (_modalCb) { _modalCb(); }
  else { closeModal(); }
}
function modalInput(name, opts) {
  opts = opts || {};
  var val = ($('modalInput_' + name) || {}).value || '';
  if (opts.trim !== false) val = val.trim();
  if (opts.number) val = parseFloat(val) || 0;
  return val;
}

function renderSyncBadge(s) {
  var el = $('syncBadge'); if (!el) return;
  var proxy = !!(window.CloudSync && CloudSync.proxyMode);
  if (s === 'online') {
    el.textContent = proxy ? '☁ 自动同步' : '☁ 云端已连';
    el.className = 'sync-badge on';
  }
  else if (s === 'connecting') { el.textContent = '☁ 连接中…'; el.className = 'sync-badge wait'; }
  else { el.textContent = '☁ 本机模式'; el.className = 'sync-badge off'; }
  var live = $('liveTag');
  if (live) live.style.display = (s === 'online') ? '' : 'none';
}

/* ================= 云端同步设置 ================= */
function openCloudSettings() {
  var cur = '';
  try { cur = localStorage.getItem('om_cloud_token') || ''; } catch (e) {}
  var on = !!(window.CloudSync && CloudSync.enabled);
  var proxy = !!(window.CloudSync && CloudSync.proxyMode);
  var head = proxy
    ? '<div style="font-size:13px;line-height:1.7;color:var(--ink-2);margin-bottom:12px">'
      + '当前状态：<b style="color:var(--ok)">自动同步模式（已开启代理，改动实时同步到 GitHub 仓库，跨设备零粘贴）</b><br>'
      + '此模式下浏览器无需令牌，下方留空即可。如需切回手动模式，清空 cloud-config.js 的 proxyBase。</div>'
    : '<div style="font-size:13px;line-height:1.7;color:var(--ink-2);margin-bottom:12px">'
      + '当前状态：<b style="color:' + (on ? 'var(--ok)' : 'var(--warn)') + '">' + (on ? '已开启（改动实时同步到 GitHub 仓库，跨设备共享）' : '未开启（仅本机保存，换设备看不到）') + '</b><br>'
      + '把 GitHub 令牌粘贴到下方即可开启。令牌只存在本浏览器，不会上传。</div>';
  $('cloudBody').innerHTML =
    head
    + '<div class="modal-row"><label>GitHub 令牌（fine-grained）</label><input class="modal-input" id="cloudToken" placeholder="github_pat_..." value="' + esc(cur) + '"></div>'
    + '<div style="font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:4px 0 14px">需仅授权本仓库 <code>Dusk-Collab/xiaomiao</code> 的 <b>Contents: Read and write</b>。创建步骤见 cloud-config.js 顶部注释。'
    + (proxy ? '' : '想要“跨设备零粘贴”的全自动模式，请部署 worker/ 里的 Cloudflare Worker 并在 cloud-config.js 填 proxyBase。')
    + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end">'
    + (cur ? '<button class="btn-cancel" onclick="clearCloud()">清除</button>' : '')
    + '<button class="btn-confirm" onclick="saveCloud()">保存并启用</button>'
    + '</div>';
  var m = $('cloudMask'); m.style.display = 'flex'; m.classList.add('show');
}
function hideCloud() {
  var m = $('cloudMask'); m.classList.remove('show');
  setTimeout(function () { m.style.display = 'none'; }, 180);
}
function saveCloud() {
  var t = (($('cloudToken') || {}).value || '').trim();
  if (!t) { toast('请输入令牌'); return; }
  try { localStorage.setItem('om_cloud_token', t); } catch (e) {}
  toast('已保存，正在重新连接云端…'); hideCloud();
  setTimeout(function () { location.reload(); }, 400);
}
function clearCloud() {
  try { localStorage.removeItem('om_cloud_token'); } catch (e) {}
  toast('已清除，将回到本机模式'); hideCloud();
  setTimeout(function () { location.reload(); }, 400);
}

/* ================= 声音 ================= */
function initSound() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundReady = true;
    var b = $('soundBar'); if (b) b.remove();
    beep(); setTimeout(function () { speak('提示音已开启'); }, 260);
  } catch (e) { toast('浏览器不支持音频'); }
}
function beep() {
  if (!audioCtx) return;
  [[880, 0], [1320, .16]].forEach(function (p) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = p[0];
    var t0 = audioCtx.currentTime + p[1];
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.32, t0 + .015);
    g.gain.exponentialRampToValueAtTime(.001, t0 + .32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + .34);
  });
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.05; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function alertNewOrder(n) {
  if (!D.settings.soundOn) return;
  beep();
  setTimeout(function () { speak('您有新的订单，请及时处理'); }, 420);
  var f = $('newOrderFlash');
  f.classList.add('on');
  setTimeout(function () { f.classList.remove('on'); }, 900);
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  document.title = '(' + n + ') 新订单！· 商家后台';
}
function showSoundBar() {
  if (soundReady || $('soundBar')) return;
  var d = document.createElement('div');
  d.id = 'soundBar';
  d.innerHTML = '<span>🔕 浏览器需授权后才能播报新订单</span>'
    + '<button class="btn btn-sm" style="background:#fff;color:var(--ink)" onclick="initSound()">开启提示音</button>';
  document.body.appendChild(d);
}

/* ================= 导航 ================= */
function renderNav() {
  var pend = D.orders.filter(function (o) { return o.status === 'pending'; }).length;
  $('nav').innerHTML = PAGES.map(function (p) {
    return '<div class="nav-item' + (page === p.k ? ' on' : '') + '" onclick="go(\'' + p.k + '\')">'
      + '<span class="nav-icon">' + p.i + '</span>' + p.t
      + (p.k === 'orders' && pend ? '<span class="nav-badge">' + pend + '</span>' : '') + '</div>';
  }).join('');
  $('mobileNav').innerHTML = PAGES.map(function (p) {
    return '<div class="mn-item' + (page === p.k ? ' on' : '') + '" onclick="go(\'' + p.k + '\')">'
      + '<span class="mn-icon">' + p.i + '</span>' + p.t.slice(0, 4)
      + (p.k === 'orders' && pend ? '<span class="mn-badge">' + pend + '</span>' : '') + '</div>';
  }).join('');
  $('pageTitle').textContent = (PAGES.find(function (p) { return p.k === page; }) || {}).t;
  $('sideName').textContent = D.shop.name;
  var logo = $('sideLogo');
  if (D.shop.logoImg) { logo.innerHTML = '<img src="' + D.shop.logoImg + '" alt="">'; logo.style.background = 'transparent'; }
  else { logo.innerHTML = esc(D.shop.logo || '🧋'); logo.style.backgroundImage = ''; }
  var open = Store.isOpenNow(D);
  $('sideStatus').textContent = open ? '营业中' : (D.shop.manualClose ? '手动打烊' : '非营业时段');
  $('sideStatusDot').style.background = open ? 'var(--ok)' : '#C9C0BA';
  $('quickOpen').className = 'switch' + (D.shop.manualClose ? '' : ' on');
}
function go(k) { page = k; render(); window.scrollTo(0, 0); }
$('quickOpen').onclick = function () {
  save(function (d) { d.shop.manualClose = !d.shop.manualClose; });
  toast(D.shop.manualClose ? '已打烊，顾客无法下单' : '已开始营业');
  render();
};

/* ================= 页面渲染 ================= */
function render() { D = Store.read(); renderNav(); ({ orders: pgOrders, products: pgProducts, coupons: pgCoupons, shop: pgShop, qrcode: pgQR, stats: pgStats })[page](); }

/* ---------- 订单看板 ---------- */
function pgOrders() {
  var counts = { pending: 0, making: 0, ready: 0, done: 0, canceled: 0 };
  D.orders.forEach(function (o) { if (counts[o.status] !== undefined) counts[o.status]++; });
  var TABS = [['pending', '待接单'], ['making', '制作中'], ['ready', '待取餐'], ['done', '已完成'], ['canceled', '已取消'], ['all', '全部']];

  var todayStr = Store.today();
  var todayOrders = D.orders.filter(function (o) { return new Date(o.createdAt).toISOString().slice(0, 10) === new Date().toISOString().slice(0, 10); });
  var rev = todayOrders.filter(function (o) { return o.status !== 'canceled'; }).reduce(function (s, o) { return s + o.total; }, 0);

  var html = '<div class="stat-grid">'
    + stat(counts.pending, '待接单', counts.pending ? 'var(--brand)' : '#D5CCC6')
    + stat(counts.making, '制作中', 'var(--info)')
    + stat(counts.ready, '待取餐', 'var(--ok)')
    + stat(counts.done, '已完成', '#8A7A66')
    + stat(counts.canceled, '已取消', '#C9C0BA')
    + stat(todayOrders.length, '今日订单', 'var(--brand-2)')
    + stat(money(rev), '今日营业额', 'var(--warn)')
    + '</div>';

  html += '<div class="kb-tabs" style="margin-bottom:14px">' + TABS.map(function (t) {
    var n = t[0] === 'all' ? D.orders.length : (counts[t[0]] || 0);
    return '<div class="kb-tab' + (kbTab === t[0] ? ' on' : '') + '" onclick="setTab(\'' + t[0] + '\')">'
      + t[1] + '<span class="n">' + n + '</span></div>';
  }).join('') + '</div>';

  // 搜索框
  html += '<div style="margin:0 0 8px;position:relative">'
    + '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink-3)">🔍</span>'
    + '<input id="orderSearch" class="field" style="padding-left:36px;width:100%;margin:0" placeholder="搜索订单编号 / 取餐码…" value="' + esc(window._adminSearch || '') + '" oninput="onOrderSearch(this.value)">'
    + '</div>';

  // 批量操作条
  var orderSelCount = Object.keys(orderSelIds).length;
  var list2 = kbTab === 'all' ? D.orders : D.orders.filter(function (o) { return o.status === kbTab; });
  var st2 = (window._adminSearch || '').trim().toLowerCase();
  if (st2) { list2 = list2.filter(function (o) { return o.code.toLowerCase().indexOf(st2) >= 0 || o.id.toLowerCase().indexOf(st2) >= 0; }); }
  var allOrderChecked = list2.length > 0 && list2.every(function (o) { return orderSelIds[o.id]; });
  html += '<div class="order-bulk-bar">'
    + '<label class="sel-all"><input type="checkbox" class="sel-box" ' + (allOrderChecked ? 'checked' : '') + ' onchange="toggleAllOrders(this)"> 全选</label>'
    + '<span class="sel-info">' + (orderSelCount ? '已选 ' + orderSelCount + ' 单' : '') + '</span>'
    + '<button class="btn btn-sm btn-primary" onclick="bulkAccept()">批量接单</button>'
    + '<button class="btn btn-sm btn-ghost" onclick="bulkCancel()">批量取消</button>'
    + '<button class="btn btn-sm btn-danger" onclick="bulkDeleteOrders()">批量删除</button>'
    + '</div>';

  var list = kbTab === 'all' ? D.orders : D.orders.filter(function (o) { return o.status === kbTab; });

  // 搜索过滤
  var st = (window._adminSearch || '').trim().toLowerCase();
  if (st) { list = list.filter(function (o) { return o.code.toLowerCase().indexOf(st) >= 0 || o.id.toLowerCase().indexOf(st) >= 0; }); }

  if (!list.length) {
    html += '<div class="card" style="text-align:center;padding:46px 20px;color:var(--ink-3)">'
      + '<div style="font-size:42px;opacity:.3">' + (st ? '🔍' : '🍵') + '</div>'
      + '<div style="margin-top:10px;font-size:13.5px">' + (st ? '没有找到匹配的订单' : '暂无' + (kbTab === 'all' ? '' : TABS.find(function (t) { return t[0] === kbTab; })[1]) + '订单') + '</div>'
      + '<div style="font-size:12px;margin-top:6px">打开顾客端下一单试试，这里会实时响铃</div></div>';
  } else {
    html += '<div class="order-grid">' + list.map(orderCard).join('') + '</div>';
  }
  $('body').innerHTML = html;
  bindSwipe();
}
function onOrderSearch(v) { window._adminSearch = v; pgOrders(); }
function setTab(t) { kbTab = t; pgOrders(); }
function stat(v, l, c, onClick) {
  var click = onClick ? ' onclick="' + onClick.replace(/"/g, '&quot;') + '"' : '';
  return '<div class="stat"' + click + ' style="border-left-color:' + c + '"><div class="stat-v" style="color:' + c + '">' + v + '</div><div class="stat-l">' + l + '</div></div>';
}

function orderCard(o) {
  var NEXT = { pending: ['接单', 'making'], making: ['出餐', 'ready'], ready: ['完成', 'done'] };
  var nx = NEXT[o.status];
  var mins = Math.floor((Date.now() - o.createdAt) / 60000);
  var STC = { pending: 'tag-warn', making: 'tag-info', ready: 'tag-ok', done: 'tag-off', canceled: 'tag-off' };
  var checked = orderSelIds[o.id] ? 'checked' : '';
  var custName = o.customerName || (o.customer && o.customer.name) || '';

  return '<div class="owrap">'
    + (nx ? '<div class="act-r">' + nx[0] + ' ✓</div>' : '')
    + '<div class="act-l">✕ 取消</div>'
    + '<div class="ocard' + (o.isNew ? ' new' : '') + '" data-id="' + o.id + '" data-st="' + o.status + '">'
    + '<div class="o-head">'
    + '<input type="checkbox" class="sel-box" ' + checked + ' onclick="event.stopPropagation();toggleOrderSel(\'' + o.id + '\',this.checked)" style="flex:none;margin-top:4px">'
    + '<div><div class="o-code">' + o.code + '</div>'
    + '<div class="o-meta">' + Store.timeStr(o.createdAt) + ' · ' + (mins < 1 ? '刚刚' : mins + ' 分钟前')
    + (custName ? ' · 👤 ' + esc(custName) : '') + '</div></div>'
    + '<div style="margin-left:auto;text-align:right">'
    + '<span class="tag ' + STC[o.status] + '">' + Store.STATUS_TEXT[o.status] + '</span>'

/* ---------- 滑动手势 ---------- */
function bindSwipe() {
  document.querySelectorAll('.ocard').forEach(function (el) {
    var st = el.dataset.st;
    if (st === 'done' || st === 'canceled') return;
    var sx = 0, dx = 0, active = false;

    function start(x) { sx = x; dx = 0; active = true; el.classList.add('dragging'); }
    function move(x) {
      if (!active) return;
      dx = x - sx;
      dx = Math.max(-150, Math.min(150, dx));
      el.style.transform = 'translateX(' + dx + 'px)';
    }
    function end() {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      el.style.transform = '';
      var NEXT = { pending: 'making', making: 'ready', ready: 'done' };
      if (dx > 78) setSt(el.dataset.id, NEXT[st]);
      else if (dx < -78) { if (confirm('确定取消这一单吗？')) setSt(el.dataset.id, 'canceled'); }
    }

    el.addEventListener('touchstart', function (e) { start(e.touches[0].clientX); }, { passive: true });
    el.addEventListener('touchmove', function (e) { move(e.touches[0].clientX); }, { passive: true });
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', function (e) { if (e.target.closest('button')) return; start(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', function (e) { if (active) move(e.clientX); });
    window.addEventListener('mouseup', end);
  });
}

    p[k] = v;

  save(function (d) { d.products.forEach(function (p) { if (selIds[p.id]) fn(p, d); }); });

      if (c && d.categories.indexOf(c) < 0) d.categories.push(c);
      if (c) p.cat = c;
    }
  });

function bulkDel() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  if (!confirm('确定删除选中的 ' + ids.length + ' 个商品？此操作不可恢复')) return;
  save(function (d) { d.products = d.products.filter(function (p) { return selIds[p.id] === undefined; }); });
  selIds = {};
  toast('已删除'); render();
}
function bulkMoveCat() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  var catList = D.categories.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
  var body = '<div class="modal-row"><label>选择已有分类</label>'
    + '<select class="modal-input" id="modalInput_catSelect" style="margin-bottom:12px">'
    + '<option value="">-- 选择分类 --</option>' + catList + '</select></div>'
    + '<div class="modal-row"><label>或新建分类</label>'
    + '<input class="modal-input" id="modalInput_catNew" placeholder="输入新分类名称"></div>';
  showModal('🗂 移动到分类', body, function () {
    var c = modalInput('catNew', { trim: true });
    if (!c) c = modalInput('catSelect', { trim: true });
    if (!c) { toast('请选择或输入分类'); return; }
    save(function (d) {
      if (d.categories.indexOf(c) < 0) d.categories.push(c);
      d.products.forEach(function (p) { if (selIds[p.id]) p.cat = c; });
    });
    closeModal();
    toast('已移动'); render();
  });
}
function bulkBanner() {
  var ids = Object.keys(selIds);
  if (!ids.length) { toast('请先勾选商品'); return; }
  var presets = ['新品推荐', '店长推荐', '人气热销', '本店特惠'];
  var body = '<div class="modal-row"><label>选择标签（或自定义输入）</label>'
    + '<div class="modal-tags" id="bannerTags">'
    + presets.map(function (t) { return '<div class="modal-tag" data-val="' + t + '" onclick="pickBannerTag(this)">' + t + '</div>'; }).join('')
    + '</div></div>'
    + '<div class="modal-row"><input class="modal-input" id="modalInput_tag" placeholder="自定义标签（留空则用默认推荐）" value="店长推荐"></div>';
  showModal('🎯 店长推荐', body, function () {
    var tag = modalInput('tag', { trim: true });
    if (!tag) tag = '店长推荐';
    save(function (d) {
      d.products.forEach(function (p) {
        if (selIds[p.id]) { p.banner = true; p.bannerTag = tag; }

    });
    closeModal();
    toast('已添加到首页Banner'); render();
  });

function pickShopLogo() {
  var i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.onchange = function () {

function delCat(i) {
  save(function (d) {
    var c = d.categories[i];
    if (d.products.some(function (p) { return p.cat === c; })) { toast('该分类下还有商品，不能删除'); return; }
    d.categories.splice(i, 1);
  });
  render();
}

/* ---------- 账号安全：修改密码 / 更换手机号 ----------
 * 均用「当前密码」（即登录密码，adminPwd 为空时回退店铺手机号）验证身份，不再依赖短信/图形验证码。
 * 修改密码 → 写入 settings.adminPwd（空=回退手机号）。
 * 更换手机号 → 校验身份后写入 shop.phone。
 * 数据写入走 save() → Store + CloudSync 自动同步到云。 */
function getAdminPwd() {
  try {
    var d = Store.read();
    var p = d.settings && d.settings.adminPwd;
    if (p) return String(p);
    var ph = (d.shop && d.shop.phone) || '13800138000';
    return String(ph).replace(/\D/g, '');
  } catch (e) { return '13800138000'; }
}
function bindAccountSecurity() {
  // 新手机号只允许数字
  var np = document.getElementById('chNewPhone');
  if (np) np.addEventListener('input', function () { np.value = np.value.replace(/\D/g, '').slice(0, 11); });
}

function doChangePwd() {
  var old = (document.getElementById('cpOld').value || '').trim();
  var p1 = (document.getElementById('cpNew1').value || '');
  var p2 = (document.getElementById('cpNew2').value || '');
  if (!old) { toast('请输入当前密码'); return; }
  if (old !== getAdminPwd()) { toast('当前密码错误'); return; }
  if (p1.length < 4 || p1.length > 20) { toast('新密码 4~20 位'); return; }
  if (p1 !== p2) { toast('两次密码不一致'); return; }
  save(function (d) { d.settings = d.settings || {}; d.settings.adminPwd = p1; });
  ['cpOld', 'cpNew1', 'cpNew2'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
  toast('✓ 密码已更新');
}

function doChangePhone() {
  var old = (document.getElementById('chOld').value || '').trim();
  var newPhone = (document.getElementById('chNewPhone').value || '').trim();
  var curPhone = '';
  try { var d = Store.read(); curPhone = (d.shop && d.shop.phone) || ''; } catch (e) {}
  if (!old) { toast('请输入当前密码'); return; }
  if (old !== getAdminPwd()) { toast('当前密码错误'); return; }
  if (!/^1\d{10}$/.test(newPhone)) { toast('请输入正确的 11 位新手机号'); return; }
  if (newPhone === curPhone) { toast('新手机号不能与当前相同'); return; }
  save(function (d) { d.shop.phone = newPhone; });
  ['chOld', 'chNewPhone'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
  toast('✓ 手机号已更换为 ' + newPhone.slice(0, 3) + '****' + newPhone.slice(-4));
  setTimeout(function () { render(); }, 800);
}

/* 合成「橙底店名 + QR + 底部说明」卡片 PNG，店名自动跟店铺设置走 */
function buildQRCardCanvas(srcCanvas, shopName, tableNo) {
  var W = 320, H = 460;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  // 白底圆角
  fillRoundRect(ctx, 0, 0, W, H, 18, '#FFFFFF');
  // 顶部橙底（只上两角圆）
  fillTopRoundRect(ctx, 0, 0, W, 96, 18, '#E8841C');
  // 店名（自动跟随 shop.name）
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 19px -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.fillText(shopName || '扫码点餐', W / 2, 38);
  ctx.globalAlpha = 0.92;
  ctx.font = '12px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText('微信扫码 · 自助点单', W / 2, 66);
  ctx.globalAlpha = 1;
  // QR 主体
  var qrSize = 208, qrX = (W - qrSize) / 2, qrY = 118;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16);
  ctx.drawImage(srcCanvas, qrX, qrY, qrSize, qrSize);
  // 底部标签
  ctx.fillStyle = '#3A2A1A';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText(tableNo ? ('桌号 ' + tableNo) : '通用点餐码', W / 2, 358);
  ctx.fillStyle = '#8A7A66';
  ctx.font = '11.5px -apple-system, "Microsoft YaHei", sans-serif';
  ctx.fillText('扫码点单 · 免排队 · 免注册', W / 2, 386);
  return cv;
}
function fillRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath(); ctx.fill();
}
function fillTopRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath(); ctx.fill();
}

  var shown = statsFilter === 'all' ? allOrd : statsFilter === 'valid' ? valid : canceled;

<script>

    { n: '正方形', c: '#7B61FF', s: '<rect x="5" y="5" width="26" height="26" rx="2" fill="currentColor" stroke="currentColor" stroke-width="0.6"/>' },
    { n: '长方形', c: '#FA8C16', s: '<rect x="2" y="11" width="32" height="14" rx="2" fill="currentColor" stroke="currentColor" stroke-width="0.6"/>' },
    { n: '菱形',   c: '#13C2C2', s: '<polygon points="18,4 32,18 18,32 4,18" fill="currentColor" stroke="currentColor" stroke-width="0.6"/>' }

  }
  function injectStyle() {

(function () {

      auth(phone, '');
    } else {
      markErr(document.getElementById('loginPwd'));
      document.getElementById('loginPwd').value = '';
      if (typeof toast === 'function') toast('密码错误');
    }
  }

  function doLoginCode() {
    var phone = (document.getElementById('codePhone').value || '').trim();
    var code = (document.getElementById('codeInput').value || '').trim();
    if (!validPhone(phone)) { markErr(document.getElementById('codePhone')); if (typeof toast === 'function') toast('手机号格式错误'); return; }
    if (!codeCapCtrl || !codeCapCtrl.validate(code)) {
      markErr(document.getElementById('codeInput'));
      if (typeof toast === 'function') toast('请先按顺序点选图形，并填入当前动态码');
      return;
    }
    auth(phone, '');
  }

  function doRegister() {
    var phone = (document.getElementById('regPhone').value || '').trim();
    var code = (document.getElementById('regCode').value || '').trim();
    var name = (document.getElementById('regName').value || '').trim();
    if (!validPhone(phone)) { markErr(document.getElementById('regPhone')); if (typeof toast === 'function') toast('手机号格式错误'); return; }
    if (!regCapCtrl || !regCapCtrl.validate(code)) {
      markErr(document.getElementById('regCode'));
      if (typeof toast === 'function') toast('请先按顺序点选图形，并填入当前动态码');
      return;
    }
    auth(phone, name || '管理员');
  }

  function bind() {
    // 视图切换：点带 data-go 的链接切换面板
    document.querySelectorAll('[data-go]').forEach(function (a) {
      a.addEventListener('click', function () { setView(a.getAttribute('data-go')); });
    });
    // 密码眼睛
    var eye = document.getElementById('loginEye');
    var pwd = document.getElementById('loginPwd');
    if (eye && pwd) eye.addEventListener('click', function () {
      if (pwd.type === 'password') { pwd.type = 'text'; eye.textContent = '🙈'; }
      else { pwd.type = 'password'; eye.textContent = '👁'; }
    });
    // 图形顺序点选验证码实例挂载（替代短信获取验证码）
    if (window.ShapeCaptcha) {
      codeCapCtrl = window.ShapeCaptcha.mount(document.getElementById('codeCap'), {
        onPass: function () { if (typeof toast === 'function') toast('图形验证通过，请把动态码填入验证码框'); }
      });
      regCapCtrl = window.ShapeCaptcha.mount(document.getElementById('regCap'), {
        onPass: function () { if (typeof toast === 'function') toast('图形验证通过，请把动态码填入验证码框'); }
      });
    }
    // 提交
    var lb = document.getElementById('loginBtn'); if (lb) lb.addEventListener('click', doLoginPwd);
    var cb = document.getElementById('codeBtn'); if (cb) cb.addEventListener('click', doLoginCode);
    var rb = document.getElementById('regBtn'); if (rb) rb.addEventListener('click', doRegister);
    // 回车
    ['loginPhone', 'loginPwd', 'codePhone', 'codeInput', 'regPhone', 'regCode'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        if (id.indexOf('login') === 0) doLoginPwd();
        else if (id.indexOf('code') === 0) doLoginCode();
        else doRegister();
      });
    });
    // 数字过滤
    ['loginPhone', 'codePhone', 'regPhone'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function () { el.value = el.value.replace(/\D/g, ''); });
    });
    // 动态验证码含字母，不做纯数字过滤（仅去除空格）
    ['codeInput', 'regCode'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function () { el.value = el.value.replace(/\s/g, '').toUpperCase(); });
    });
  }

  window.doLogout = function () {
    try { sessionStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(PHONE_KEY); sessionStorage.removeItem(NAME_KEY); } catch (e) {}
    showLogin();
    if (typeof toast === 'function') toast('已退出登录');
  };

  // 监听 Store 数据变化：店铺 logo/名称改了同步刷新登录卡
  if (window.Store && Store.onChange) Store.onChange(function () {
    if (!isAuthed()) {
      try {
        var d = Store.read();
        var logo = document.getElementById('loginLogo');
        var name = document.getElementById('loginShopName');
        if (logo && d.shop && d.shop.logo) logo.textContent = d.shop.logo;
        if (name && d.shop && d.shop.name) name.textContent = d.shop.name;
      } catch (e) {}
    }
  });

  function boot() { bind(); setView('pwd'); if (!isAuthed()) showLogin(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
