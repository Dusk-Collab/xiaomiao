<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E4">
<title>江南味道 · 点餐</title>
<link rel="stylesheet" href="jn_assets/fonts/mashan.css">
<style>
/* ============ 设计变量：宣纸 / 墨色 / 茶绿 / 少量朱砂 ============ */
:root{
  --paper:#F7F3E9;      /* 宣纸米白（暖） */
  --paper-2:#FCFAF4;    /* 暖白 */
  --paper-3:#F0EADD;    /* 浅米 */
  --ink:#23201B;        /* 墨黑 */
  --ink-2:#4A443B;      /* 次墨 */
  --ink-3:#8A8275;      /* 浅墨灰（描述） */
  --tea:#6E7F63;        /* 茶绿（低饱和） */
  --tea-2:#55664C;      /* 深茶绿 */
  --gold:#B89B6A;       /* 米金（加号按钮） */
  --brown:#7A5C3E;      /* 浅棕（价格） */
  --celadon:#8E9C9A;    /* 青灰 */
  --cinnabar:#9E3B32;   /* 朱砂（极少量强调） */
  --line:rgba(35,32,27,.07);
  --line-2:rgba(35,32,27,.045);
  --shadow:0 1px 3px rgba(35,32,27,.035);
  --brush:"Ma Shan Zheng","Long Cang","ZCOOL XiaoWei","STXingkai","Xingkai SC","Hannotate SC","KaiTi","STKaiti","Kaiti SC","Noto Serif SC","Songti SC",serif;
  --kai:"ZCOOL XiaoWei","KaiTi","STKaiti","Kaiti SC","Hannotate SC","Noto Serif SC","Songti SC","STSong",serif;
  --song:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --tabbar-h:54px;
  --cartbar-h:60px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--ui); color:var(--ink); background:#E7E0D0;
  font-size:14px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
img{display:block}

#app{
  max-width:480px; margin:0 auto; height:100%;
  position:relative; display:flex; flex-direction:column;
  background-color:#2A2622;
  background-image:url('jn_assets/courtyard.jpg');
  background-repeat:no-repeat;
  background-position:center 30%;
  background-size:cover;
  box-shadow:0 0 40px rgba(31,28,24,.08);
  overflow:hidden;
}

.main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--tabbar-h) + var(--cartbar-h) + 14px)}
.view{display:none}
.view.active{display:block}
/* 点餐首页：头部(品牌+banner)固定，只有右侧菜品列表滚动 */
#view-home{height:100%}
#view-home.active{display:flex; flex-direction:column}
#view-home > .brand,
#view-home > .banner{flex:none}
/* #cdHome 是 .cd-wrap 的父容器，必须也参与 flex 链并允许压缩 */
#cdHome{flex:1; min-height:0; display:flex; flex-direction:column}

/* ============ 顶部品牌区：江南庭院实景（紧凑，让菜单占 2/3） ============ */
.brand{
  position:relative; padding:8px 16px 10px;
  color:#FDFAF3; overflow:hidden;
  background-color:#2A2622;
  background-image:url('jn_assets/courtyard.jpg');
  background-repeat:no-repeat;
  background-position:center 28%;
  background-size:cover;
  min-height:108px;
  display:flex; flex-direction:column;
}
/* 仅底部一道极淡暗角让标题在亮天空区仍清晰 */
.brand::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(20,18,14,.20) 86%, rgba(20,18,14,.38) 100%);
}
.brand > *{position:relative; z-index:1}
/* 底部 fade-out 到米色背景，让品牌区与 banner 衔接成一张连续背景图 */
.brand::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:55%;
  pointer-events:none; z-index:0;
  background:linear-gradient(180deg,
    rgba(231,224,208,0) 0%,
    rgba(231,224,208,0) 35%,
    rgba(231,224,208,.55) 78%,
    rgba(231,224,208,.92) 100%);
}

.brand-top{display:flex; align-items:center; gap:8px; margin-bottom:auto}
.loc{display:flex; align-items:center; gap:3px; font-size:13px; color:rgba(253,250,243,.96); letter-spacing:.6px; text-shadow:0 1px 2px rgba(20,18,14,.55); font-weight:500}
.loc svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.loc::after{content:'›'; opacity:.7; margin-left:1px; font-weight:400; font-size:14px}
.brand-actions{margin-left:auto; display:flex; gap:6px; align-items:center}
.ba-btn{
  width:32px; height:32px; border-radius:50%;
  display:grid; place-items:center; background:rgba(252,250,244,.30);
  border:1px solid rgba(252,250,244,.40); backdrop-filter:blur(2px);
}
.ba-btn svg{width:15px;height:15px;stroke:rgba(253,250,243,.96);fill:none;stroke-width:1.9;stroke-linecap:round}

.brand-name{
  display:flex; align-items:flex-end; gap:6px;
  margin-top:auto;
}
.brand-name-txt{
  font-family:var(--brush);
  font-size:34px; font-weight:400;
  letter-spacing:2px; line-height:1.05; color:#FBF6EC;
  text-shadow:0 2px 6px rgba(20,18,14,.55), 0 0 2px rgba(20,18,14,.5);
  -webkit-font-smoothing:antialiased;
}
.brand-seal{
  display:inline-grid; place-items:center;
  width:24px; height:24px; padding:0;
  font-family:var(--kai); font-size:10px; font-weight:700;
  letter-spacing:1px; color:#FFF8F2;
  background:#C0392B; border:1.5px solid #A83223;
  border-radius:3px;
  transform:rotate(-3deg); transform-origin:center;
  margin-bottom:3px; text-shadow:0 1px 1px rgba(0,0,0,.25);
  box-shadow:0 2px 5px rgba(158,59,50,.35);
}
.brand-sub{
  font-family:var(--kai); font-size:11.5px; letter-spacing:2.5px;
  color:rgba(253,250,243,.95); margin-top:4px; text-shadow:0 1px 3px rgba(20,18,14,.55);
  font-weight:400;
}
.brand-tags{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap}
.btag{
  font-size:9px; letter-spacing:.5px; padding:2px 7px; border-radius:2px;
  background:rgba(252,250,244,.62); border:1px solid rgba(35,32,27,.10);
  color:var(--ink-2); backdrop-filter:blur(2px);
}
.btag.hot{background:rgba(158,59,50,.07); border-color:rgba(158,59,50,.18); color:var(--cinnabar)}

/* ============ 主宣传 Banner：水墨江南 + 玉兰花（紧贴品牌区，无上圆角） ============ */
.banner{
  margin:0 14px 4px; border-radius:0 0 14px 14px; overflow:hidden; position:relative;
  background:transparent; border:1px solid rgba(255,251,240,.18); border-top:0;
  box-shadow:0 6px 16px rgba(31,28,24,.18);
  min-height:158px;
}
.banner-track{
  display:flex; height:100%;
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  position:relative; z-index:1;
}
.banner-slide{
  flex:0 0 100%; height:158px; position:relative; overflow:hidden;
  background-size:cover; background-position:center 18%;
}
.banner-slide::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  /* 顶部融入米色（接品牌区 fade-out） + 左侧米白渐变保证文字可读 */
  background:
    linear-gradient(180deg, rgba(231,224,208,.70) 0%, rgba(231,224,208,.30) 18%, rgba(231,224,208,0) 30%, rgba(231,224,208,0) 100%),
    linear-gradient(90deg,
      rgba(252,248,236,.97) 0%,
      rgba(252,248,236,.85) 28%,
      rgba(252,248,236,.40) 52%,
      rgba(252,248,236,.05) 76%,
      rgba(252,248,236,0) 100%);
}
.banner-slide-txt{
  position:absolute; left:0; top:0; bottom:0; z-index:1;
  width:64%; display:flex; flex-direction:column; justify-content:center;
  padding:10px 6px 10px 18px;
}
.banner-t1{
  font-family:var(--kai); font-size:16px; font-weight:700; letter-spacing:2px;
  color:var(--ink); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(252,250,244,.9);
}
.banner-t2{
  font-size:10.5px; color:var(--ink-2); letter-spacing:.4px; margin-top:4px; line-height:1.5;
  text-shadow:0 1px 2px rgba(252,250,244,.9);
}
.banner-btn{
  margin-top:8px; align-self:flex-start; display:inline-flex; align-items:center; gap:4px;
  font-size:11px; letter-spacing:1.2px; color:#FCF7EC; font-weight:600;
  padding:5px 12px 5px 13px; border-radius:16px;
  background:#7A5C3E; border:1px solid rgba(122,92,62,.85);
  box-shadow:0 1px 3px rgba(122,92,62,.30);
  transition:transform .12s, background .2s;
}
.banner-btn:active{transform:scale(.97); background:#6A4F35}
.banner-btn svg{width:10px;height:10px;stroke:#FCF7EC;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* 3 张轮播水墨江南 + 左右切换按钮 */
.banner-arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:50%;
  display:grid; place-items:center;
  background:rgba(252,248,236,.78); border:1px solid rgba(35,32,27,.10);
  box-shadow:0 1px 3px rgba(35,32,27,.12);
  color:var(--ink-2); z-index:3;
  transition:background .2s, transform .12s;
}
.banner-arrow:active{transform:translateY(-50%) scale(.92); background:#FCFAF4; color:var(--ink)}
.banner-prev{left:8px}
.banner-next{right:8px}
.banner-arrow svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.banner-dots{display:flex}

/* ============ 分类 + 菜品 ============ */
.cd-wrap{display:flex; margin:12px 14px 0; border-radius:14px; overflow:hidden; flex:1; min-height:0; box-shadow:0 4px 16px rgba(31,28,24,.18)}
.cats{
  flex:0 0 84px; background:#F5EFE3; border-right:1px solid var(--line-2);
  align-self:stretch; position:sticky; top:0;
  display:flex; flex-direction:column;
}
.cat{
  position:relative; padding:15px 6px 15px 13px; font-size:12.5px; color:var(--ink-3);
  letter-spacing:.8px; transition:background .18s,color .18s; text-align:left; width:100%;
  display:flex; align-items:center; gap:7px;
}
.cat-ic{width:18px; height:18px; flex:none; opacity:.62; transition:opacity .18s,color .18s}
.cat-ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cat.on .cat-ic{opacity:1}
.cat-n{flex:1; text-align:left}
.cat + .cat{border-top:1px solid var(--line-2)}
.cat::before{ /* 选中竖线（茶绿） */
  content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:2px; height:0; background:var(--tea); border-radius:0 2px 2px 0; transition:height .2s;
}
.cat.on{background:var(--paper-2); color:var(--ink); font-weight:600}
.cat.on::before{height:20px}
.cat-seal{ /* 选中后右上角小印章（朱砂，克制） */
  position:absolute; right:8px; top:50%; transform:translateY(-50%) scale(0);
  width:15px; height:15px; border-radius:2px; border:1px solid rgba(192,57,43,.40);
  color:#C0392B; font-family:var(--kai); font-size:9px; font-weight:700;
  display:grid; place-items:center; opacity:.85; transition:transform .2s;
  background:rgba(192,57,43,.05);
}
.cat.on .cat-seal{transform:translateY(-50%) scale(1)}
.cat:last-of-type{margin-top:auto}

.goods{
  flex:1; min-width:0; min-height:0; padding:4px 12px 20px;
  background-color:#FDFAF3;
  position:relative;
  display:flex; flex-direction:column;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; /* 防止滚到边界后把滑动传给外层 .main */
}
.dish:last-of-type{margin-top:auto}
.goods::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 600' preserveAspectRatio='xMidYMax slice'><defs><linearGradient id='mt' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%236E5B43' stop-opacity='.22'/><stop offset='1' stop-color='%236E5B43' stop-opacity='.04'/></linearGradient></defs><g fill='url(%23mt)'><path d='M0 380 Q40 340 80 358 Q120 326 160 354 Q200 318 240 348 Q290 320 330 350 Q380 326 420 348 Q450 336 480 346 L480 600 L0 600 Z'/></g><g stroke='%236E5B43' stroke-width='.8' fill='none' opacity='.22'><path d='M0 410 q60 38 120 0 t120 0 t120 0 t120 0'/><path d='M0 440 q80 32 160 0 t160 0 t160 0'/></g><g fill='%231a1a1a' opacity='.25'><path d='M100 430 L160 430 L154 426 L168 422 L154 418 L160 414 L100 414 Z'/></g></svg>");
  background-repeat:no-repeat; background-position:bottom center; background-size:100% 100%;
  opacity:.38;
}
.goods > *{position:relative; z-index:1}
.sec-head{
  display:flex; align-items:center; gap:8px; padding:14px 2px 11px;
  font-family:var(--song); font-size:15.5px; font-weight:700; letter-spacing:2.5px; color:var(--ink);
}
.sec-head::before{
  content:''; display:inline-block; width:16px; height:16px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 9 Q5 7 7 9 Q8 6 10 8 Q12 6 13 9' stroke='%23C0392B' stroke-width='1.2' fill='none' stroke-linecap='round'/><circle cx='8' cy='11' r='.7' fill='%23C0392B'/></svg>") center/contain no-repeat;
}
.sec-head .cnt{margin-left:auto; font-family:var(--ui); font-size:11px; font-weight:400; color:var(--ink-3); letter-spacing:0}

.dish{
  display:flex; gap:12px; padding:10px 10px; margin-bottom:10px;
  background:rgba(252,250,244,.55); border:1px solid rgba(35,32,27,.05); border-radius:11px;
  transition:border-color .3s, box-shadow .3s;
}
.dish.dish-flash{
  border-color:rgba(158,59,50,.45);
  box-shadow:0 0 0 2px rgba(158,59,50,.10);
}
.dish-pic{
  flex:0 0 110px; width:110px; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
  background:var(--paper-3); position:relative;
}
.dish-pic img{width:100%; height:100%; object-fit:cover; display:block; object-position:center 80%}
.dish-pic .tag{
  position:absolute; left:0; top:0; font-size:10.5px; letter-spacing:1px; font-weight:700;
  background:var(--cinnabar); color:#FFF8F2; padding:3px 8px 3px 9px;
  border-radius:10px 0 10px 0;
  box-shadow:0 1px 3px rgba(158,59,50,.30);
}
.dish-info{flex:1; min-width:0; display:flex; flex-direction:column; padding:2px 0}
.dish-name{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
}
.dish-name .n{
  font-family:var(--kai); font-size:17px; font-weight:700; color:var(--ink);
  letter-spacing:1.2px; line-height:1.3; white-space:nowrap;
}
.dish-name .badge{
  display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.5px;
  background:var(--cinnabar); color:#FFF8F2;
  padding:2px 5px 2px 6px; border-radius:2px; align-self:center;
  font-family:var(--ui);
}
.dish-desc{
  font-size:11px; color:var(--ink-3); margin-top:5px; line-height:1.55;
  letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dish-bot{margin-top:auto; padding-top:9px; display:flex; align-items:flex-end; gap:8px}
.price{font-family:var(--song); color:var(--brown); font-weight:700; letter-spacing:.3px; line-height:1}
.price .cur{font-size:12px; margin-right:1px}
.price .num{font-size:19px; font-variant-numeric:tabular-nums}
.price .unit{font-size:10.5px; color:var(--ink-3); font-weight:400; margin-left:2px; letter-spacing:0}
.qty{margin-left:auto; display:flex; align-items:center; gap:9px; min-height:26px}
.qty-btn{
  width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  transition:transform .12s;
}
.qty-btn:active{transform:scale(.88)}
.qty-btn svg{width:13px;height:13px;stroke-width:2.4;stroke-linecap:round;fill:none}
.qty-plus{background:var(--gold); box-shadow:0 1px 3px rgba(184,155,106,.35)}
.qty-plus svg{stroke:#FCFAF4}
.qty-minus{background:transparent; border:1px solid rgba(35,32,27,.18)}
.qty-minus svg{stroke:var(--ink-2)}
.qty-num{
  font-size:14px; font-weight:700; color:var(--ink); min-width:12px; text-align:center;
  font-variant-numeric:tabular-nums;
}
.qty[data-zero="1"] .qty-minus,.qty[data-zero="1"] .qty-num{display:none}

/* ============ 底部购物车条 ============ */
.cartbar{
  position:fixed; bottom:var(--tabbar-h); left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:var(--cartbar-h); z-index:40;
  display:flex; align-items:center; gap:12px; padding:0 14px 0 18px;
  background:rgba(252,250,244,.97); backdrop-filter:blur(10px);
  border-top:1px solid var(--line-2); box-shadow:0 -1px 6px rgba(35,32,27,.04);
}
.cart-ico{
  position:relative; width:50px; height:50px; flex:none;
  display:grid; place-items:center;
  transition:transform .15s;
}
.cart-ico:active{transform:scale(.94)}
.cart-ico svg{width:100%;height:100%;display:block}
.cart-badge{
  position:absolute; top:0; right:0; min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:var(--cinnabar); color:#FFF8F2;
  font-size:10px; font-weight:700; display:grid; place-items:center;
  border:1.5px solid var(--paper-2); transform:scale(0); transition:transform .2s;
}
.cart-badge.show{transform:scale(1)}
.cart-mid{flex:1; min-width:0}
.cart-total{font-family:var(--song); font-size:20px; font-weight:700; color:var(--ink); line-height:1.15; font-variant-numeric:tabular-nums}
.cart-total .cur{font-size:13px}
.cart-fee{font-size:10.5px; color:var(--ink-3); margin-top:3px; letter-spacing:.2px}
.cart-go{
  flex:none; padding:11px 24px; border-radius:22px; font-size:13.5px; letter-spacing:1.8px;
  font-weight:600; background:var(--brown); color:#FCF7EC;
  box-shadow:0 2px 6px rgba(122,92,62,.28); transition:opacity .2s,transform .12s,background .2s;
}
.cart-go:active{transform:scale(.97); background:#6A4F35}
.cart-go:active{transform:scale(.97)}
.cart-go.dis{background:#A89178; box-shadow:none; opacity:.80; pointer-events:none}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:var(--tabbar-h); z-index:50;
  display:flex; background:rgba(252,250,244,.98); backdrop-filter:blur(10px);
  border-top:1px solid var(--line-2);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-3); transition:color .18s; position:relative;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px; letter-spacing:.8px}
.tab.on{color:var(--brown)}
.tab.on svg{stroke-width:1.6}
.tab .dot{
  position:absolute; top:6px; right:calc(50% - 15px); min-width:14px; height:14px; padding:0 4px;
  border-radius:7px; background:var(--cinnabar); color:#FFF8F2; font-size:9px; font-weight:700;
  display:grid; place-items:center; transform:scale(0); transition:transform .2s;
}
.tab .dot.show{transform:scale(1)}

/* ============ 弹层 / 结算 ============ */
.mask{
  position:fixed; inset:0; z-index:60; background:rgba(31,28,24,.42);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.mask.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; transform:translateX(-50%) translateY(100%);
  bottom:0; width:100%; max-width:480px; z-index:61;
  background:var(--paper-2); border-radius:16px 16px 0 0;
  padding:6px 0 calc(var(--tabbar-h) + 10px); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:76vh; display:flex; flex-direction:column;
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-bar{width:34px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 4px; flex:none}
.sheet-head{
  display:flex; align-items:center; padding:8px 16px 12px; border-bottom:1px solid var(--line-2); flex:none;
}
.sheet-title{font-family:var(--song); font-size:16px; font-weight:700; letter-spacing:1.6px}
.sheet-clear{margin-left:auto; font-size:12px; color:var(--ink-3); letter-spacing:.6px; display:flex; align-items:center; gap:3px}
.sheet-clear svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.sheet-body{flex:1; overflow-y:auto; padding:6px 16px 10px}
.ci{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-2)}
.ci:last-child{border-bottom:none}
.ci-pic{flex:0 0 46px; width:46px; height:46px; border-radius:7px; overflow:hidden; background:var(--paper-3)}
.ci-pic img{width:100%;height:100%;object-fit:cover;object-position:center 85%}
.ci-info{flex:1; min-width:0}
.ci-name{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:.4px}
.ci-sub{font-size:11px; color:var(--ink-3); margin-top:3px; font-variant-numeric:tabular-nums}
.ci-right{margin-left:auto; display:flex; align-items:center; gap:8px}

/* 菜品详情弹层 */
.dd{
  position:fixed; left:50%; transform:translateX(-50%) translateY(100%);
  bottom:0; width:100%; max-width:480px; z-index:61;
  background:var(--paper-2); border-radius:16px 16px 0 0;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:82vh; display:flex; flex-direction:column;
}
.dd.show{transform:translateX(-50%) translateY(0)}
.dd-close{
  position:absolute; top:10px; right:10px; z-index:2;
  width:30px; height:30px; border-radius:50%;
  background:rgba(31,28,24,.38); backdrop-filter:blur(2px);
  display:grid; place-items:center;
}
.dd-close svg{width:14px;height:14px;stroke:#FDFAF3;stroke-width:2.2;stroke-linecap:round;fill:none}
.dd-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.dd-pic{width:100%; aspect-ratio:16/10; overflow:hidden; background:var(--paper-3)}
.dd-pic img{width:100%; height:100%; object-fit:cover; display:block}
.dd-info{padding:14px 16px 6px}
.dd-name{font-family:var(--song); font-size:19px; font-weight:700; letter-spacing:.6px; display:flex; align-items:center; gap:8px}
.dd-tag{
  font-family:var(--ui); font-size:10px; font-weight:600; letter-spacing:1px;
  color:#B14A3E; background:rgba(177,74,62,.10); border:1px solid rgba(177,74,62,.28);
  padding:1.5px 7px; border-radius:3px;
}
.dd-desc{margin-top:8px; font-size:12.5px; color:var(--ink-3); line-height:1.7}
.dd-unit{margin-top:9px; font-size:11px; color:var(--ink-3); letter-spacing:.6px}
.dd-foot{
  flex:none; display:flex; align-items:center; gap:12px;
  padding:12px 16px calc(var(--tabbar-h) + 10px);
  border-top:1px solid var(--line-2);
}
.dd-price{font-family:var(--song); color:var(--cinnabar); font-weight:700; letter-spacing:.3px; line-height:1}
.dd-price .cur{font-size:13px; margin-right:1px}
.dd-price .num{font-size:22px; font-variant-numeric:tabular-nums}
.dd-price .unit{font-size:10.5px; color:var(--ink-3); font-weight:400; margin-left:2px}
.dd-add{
  margin-left:auto; min-width:118px; height:38px; border-radius:19px;
  background:linear-gradient(135deg,#B14A3E,#9E3B32); color:#FFF8F2;
  font-size:13px; font-weight:700; letter-spacing:2px;
  box-shadow:0 3px 10px rgba(158,59,50,.35);
}
.dd-add:active{transform:scale(.96)}

/* 结算页 */
.co{
  position:fixed; inset:0; z-index:70; background:var(--paper);
  max-width:480px; left:50%; transform:translateX(-50%) translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
}
.co.show{transform:translateX(-50%) translateY(0)}
.co-head{
  flex:none; display:flex; align-items:center; gap:10px; padding:16px 16px 12px;
  border-bottom:1px solid var(--line-2); background:var(--paper-2);
}
.co-back{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.co-back svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.co-title{font-family:var(--song); font-size:17px; font-weight:700; letter-spacing:2px}
.co-body{flex:1; overflow-y:auto; padding:14px 16px calc(var(--tabbar-h) + 20px)}
.block{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:11px; box-shadow:var(--shadow)}
.block-t{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:1.4px; margin-bottom:11px; display:flex; align-items:center; gap:7px}
.block-t::before{content:''; width:3px; height:12px; background:var(--tea); border-radius:2px}
.modes{display:flex; gap:9px}
.mode{
  flex:1; border:1px solid var(--line); border-radius:9px; padding:11px 8px; text-align:center;
  background:var(--paper); transition:all .18s;
}
.mode.on{border-color:var(--tea); background:rgba(107,127,94,.08)}
.mode-ic{width:26px;height:26px;margin:0 auto 6px;display:grid;place-items:center}
.mode-ic svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mode.on .mode-ic svg{stroke:var(--tea-2)}
.mode-n{font-size:12.5px; letter-spacing:.6px; color:var(--ink-2)}
.mode.on .mode-n{color:var(--tea-2); font-weight:600}
.mode-d{font-size:10px; color:var(--ink-3); margin-top:2px}
.row{display:flex; align-items:center; padding:7px 0; font-size:13px}
.row .k{color:var(--ink-2)}
.row .v{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink)}
.row.sum{border-top:1px solid var(--line); margin-top:6px; padding-top:11px}
.row.sum .k{font-family:var(--song); font-size:14px; font-weight:700; letter-spacing:1px}
.row.sum .v{font-family:var(--song); font-size:20px; font-weight:700; color:var(--cinnabar)}
.co-foot{
  flex:none; position:absolute; bottom:0; left:0; right:0;
  display:flex; align-items:center; gap:12px; padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  background:rgba(250,247,238,.98); backdrop-filter:blur(10px); border-top:1px solid var(--line);
}
.co-foot .t{flex:1}
.co-foot .t1{font-family:var(--song); font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.co-foot .t2{font-size:10.5px; color:var(--ink-3); margin-top:1px}
.co-submit{
  padding:12px 30px; border-radius:22px; background:var(--tea); color:#FBF8F0;
  font-size:15px; font-weight:600; letter-spacing:2px; box-shadow:0 3px 12px rgba(107,127,94,.3);
  transition:transform .12s;
}
.co-submit:active{transform:scale(.97)}

/* 提交成功 */
.done{
  position:fixed; inset:0; z-index:80; background:var(--paper);
  max-width:480px; left:50%; transform:translateX(-50%);
  display:none; flex-direction:column; align-items:center; justify-content:center; padding:0 30px; text-align:center;
}
.done.show{display:flex}
.done-seal{
  width:74px; height:74px; border-radius:6px; border:2.5px solid var(--cinnabar);
  color:var(--cinnabar); font-family:var(--song); font-size:38px; font-weight:700;
  display:grid; place-items:center; transform:rotate(-7deg); opacity:.9; margin-bottom:20px;
}
.done-t{font-family:var(--song); font-size:21px; font-weight:700; letter-spacing:3px}
.done-s{font-size:12.5px; color:var(--ink-3); margin-top:9px; letter-spacing:.6px}
.done-code{
  margin-top:22px; padding:15px 34px; border:1px dashed rgba(31,28,24,.24); border-radius:10px;
  background:var(--paper-2);
}
.done-code .l{font-size:10.5px; color:var(--ink-3); letter-spacing:1.6px}
.done-code .c{font-family:var(--song); font-size:32px; font-weight:700; letter-spacing:5px; margin-top:5px}
.done-btn{
  margin-top:28px; padding:11px 32px; border-radius:22px; border:1px solid var(--line);
  font-size:13.5px; letter-spacing:1.6px; color:var(--ink-2); background:var(--paper-2);
}

/* 空状态（订单 / 我的） */
.empty{padding:80px 30px; text-align:center}
.empty-ic{
  width:88px; height:88px; margin:0 auto 18px; border-radius:50%;
  background:var(--paper-3); display:grid; place-items:center;
}
.empty-ic svg{width:38px;height:38px;stroke:var(--celadon);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.empty-t{font-family:var(--song); font-size:15.5px; letter-spacing:1.4px; color:var(--ink-2)}
.empty-s{font-size:12px; color:var(--ink-3); margin-top:7px; letter-spacing:.4px}

/* 我的页 */
.me-top{padding:22px 16px 16px; display:flex; align-items:center; gap:13px}
.me-av{
  width:54px; height:54px; border-radius:50%; background:var(--tea); color:#FBF8F0;
  font-family:var(--song); font-size:22px; font-weight:700; display:grid; place-items:center; flex:none;
}
.me-n{font-family:var(--song); font-size:17px; font-weight:700; letter-spacing:1.2px}
.me-p{font-size:11.5px; color:var(--ink-3); margin-top:4px; letter-spacing:.5px}
.me-list{margin:8px 16px; background:var(--paper-2); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.me-i{display:flex; align-items:center; gap:11px; padding:14px 14px; font-size:13.5px; letter-spacing:.5px}
.me-i + .me-i{border-top:1px solid var(--line-2)}
.me-i svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.me-i .ar{margin-left:auto}
.me-i .ar svg{width:14px;height:14px;stroke:var(--celadon)}

.view-pad{padding:0 0 20px}
.page-title{
  padding:18px 16px 12px; font-family:var(--song); font-size:20px; font-weight:700; letter-spacing:3px;
}
</style>
</head>

  </div><!-- /main -->

  <!-- ========== 底部购物车条 ========== -->

      <span>我的</span>

  <!-- ========== 购物车弹层 ========== -->
  <div class="mask" id="sheetMask"></div>

          <button class="mode on" data-mode="pickup">

            <div class="mode-d">配送费 ¥3</div>

      </div>

      <div class="block">

/* ==================== 数据 ==================== */

var CATS = [

  {id:'d4', cat:'rec', name:'清炒时蔬', desc:'时令蔬菜，清爽可口', price:18, unit:'份', badge:'时令鲜蔬', img:'jn_assets/greens.jpg'},

  {id:'h2', cat:'hot', name:'西湖醋鱼', desc:'酸甜适口，肉质鲜嫩', price:58, unit:'份', badge:'人气菜品', img:''},
  {id:'h3', cat:'hot', name:'干锅有机花菜', desc:'香辣入味，锅气十足', price:32, unit:'份', badge:'今日推荐', img:''},
  {id:'h4', cat:'hot', name:'秘制小排', desc:'酱香浓郁，骨酥肉烂', price:52, unit:'份', badge:'招牌推荐', img:''},
  // 凉菜

  {id:'c3', cat:'cold', name:'老醋拌木耳', desc:'酸爽脆嫩，开胃解腻', price:16, unit:'份', badge:'开胃小食', img:''},
  // 汤羹
  {id:'s1', cat:'soup', name:'虫草花炖鸡汤', desc:'滋补养生，汤鲜味美', price:28, unit:'份', badge:'滋补汤品', img:''},
  {id:'s2', cat:'soup', name:'西湖牛肉羹', desc:'浓稠鲜香，暖胃舒心', price:26, unit:'份', badge:'今日推荐', img:''},
  {id:'s3', cat:'soup', name:'菌菇豆腐汤', desc:'清淡鲜美，营养丰富', price:22, unit:'份', badge:'清淡养生', img:''},
  // 主食
  {id:'m1', cat:'staple', name:'扬州炒饭', desc:'粒粒分明，配料丰富', price:24, unit:'份', badge:'人气主食', img:''},
  {id:'m2', cat:'staple', name:'葱油拌面', desc:'葱香扑鼻，劲道爽滑', price:18, unit:'份', badge:'店内招牌', img:''},

  // 小吃
  {id:'k1', cat:'snack', name:'蟹粉小笼', desc:'汤汁浓郁，蟹香扑鼻', price:32, unit:'笼', badge:'精致小点', img:''},
  {id:'k2', cat:'snack', name:'芝麻汤圆', desc:'软糯香甜，团圆美满', price:14, unit:'份', badge:'甜品推荐', img:''},
  {id:'k3', cat:'snack', name:'桂花糕', desc:'细腻清甜，回味悠长', price:12, unit:'份', badge:'江南糕点', img:''},
  // 饮品
  {id:'b1', cat:'drink', name:'明前龙井', desc:'清香回甘，茶汤澄澈', price:18, unit:'杯', badge:'明前新茶', img:''},
  {id:'b2', cat:'drink', name:'桂花酒酿', desc:'温润香甜，暖身养胃', price:16, unit:'杯', badge:'温润热饮', img:''},
  {id:'b3', cat:'drink', name:'鲜榨甘蔗汁', desc:'清甜爽口，天然解腻', price:15, unit:'杯', badge:'鲜榨果汁', img:''}
];

var DELIVERY_FEE = 3;

/* ==================== 宣纸占位图 ==================== */
var PAL = ['#E9E0CB','#E4DCC9','#DDE4D3','#EADCCF','#DCE1DE','#EAE2CE','#E2E5D5','#EDE3CE'];
var INKPAL = ['#6E6152','#5F6B52','#7A6552','#55604F','#6B5F4E'];

function dishImg(name, seed){
  var bg = PAL[seed % PAL.length];
  var ink = INKPAL[seed % INKPAL.length];
  var ch = (name.match(/[一-龥]/g) || ['菜']).slice(0,1)[0];
  var svg =
    "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>" +
      "<rect width='200' height='200' fill='" + bg + "'/>" +
      "<g fill='none' stroke='" + ink + "' stroke-width='1.4' opacity='.26'>" +
        "<path d='M0 148 Q40 128 78 146 Q118 122 158 144 Q180 134 200 142'/>" +
        "<path d='M0 162 Q46 150 92 162 Q138 150 184 162 Q194 158 200 160'/>" +
      "</g>" +
      "<g stroke='" + ink + "' stroke-width='2' fill='none' opacity='.22'>" +
        "<path d='M176 200 L170 122'/><path d='M170 140 q-14 -8 -26 -4'/><path d='M172 160 q14 -7 26 -3'/>" +
      "</g>" +
      "<circle cx='34' cy='38' r='15' fill='" + ink + "' opacity='.12'/>" +
      "<text x='100' y='118' font-size='74' font-family='Songti SC,STSong,SimSun,serif' " +
        "font-weight='700' fill='" + ink + "' opacity='.80' text-anchor='middle'>" + ch + "</text>" +
    "</svg>";
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
DISHES.forEach(function(d, i){ d._img = dishImg(d.name, i); d._src = d.img || d._img; });

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ==================== 状态 ==================== */
var state = {
  cat: 'rec',
  cart: {},                 // id -> qty
  view: 'home',
  mode: 'pickup'            // pickup | delivery
};

function dishOf(id){ for (var i=0;i<DISHES.length;i++) if (DISHES[i].id === id) return DISHES[i]; return null; }
function cartList(){
  var out = [];
  for (var id in state.cart){
    var d = dishOf(id);
    if (d && state.cart[id] > 0) out.push({d: d, q: state.cart[id]});
  }
  return out;
}
function subtotal(){
  var s = 0; var l = cartList();
  for (var i=0;i<l.length;i++) s += l[i].d.price * l[i].q;
  return s;
}
function fee(){ return state.mode === 'delivery' && subtotal() > 0 ? DELIVERY_FEE : 0; }
function total(){ return subtotal() + fee(); }
function count(){
  var n = 0; var l = cartList();
  for (var i=0;i<l.length;i++) n += l[i].q;
  return n;
}
function fmt(n){ return (Math.round(n*100)/100).toString(); }

/* ==================== 渲染 ==================== */
var PLUS = '<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
var MINUS = '<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>';

function catHTML(){
  var h = '<div class="cd-wrap"><div class="cats">';
  CATS.forEach(function(c){
    h += '<button class="cat' + (c.id === state.cat ? ' on' : '') + '" data-cat="' + c.id + '">'
       + '<span class="cat-ic">' + c.icon + '</span>'
       + '<span class="cat-n">' + esc(c.name) + '</span>'
       + (c.id === state.cat ? '<span class="cat-seal">' + esc(c.seal) + '</span>' : '')
       + '</button>';
  });
  h += '</div><div class="goods">';
  var cur = CATS.filter(function(c){ return c.id === state.cat; })[0];
  var list = DISHES.filter(function(d){ return d.cat === state.cat; });
  h += '<div class="sec-head">' + esc(cur ? cur.name : '') + '<span class="cnt">' + list.length + ' 道</span></div>';
  list.forEach(function(d){
    var q = state.cart[d.id] || 0;
    h += '<div class="dish" data-dish="' + d.id + '">'
       +   '<div class="dish-pic"><img src="' + d._src + '" alt="' + esc(d.name) + '" loading="lazy"></div>'
       +   '<div class="dish-info">'
       +     '<div class="dish-name"><span class="n">' + esc(d.name) + '</span>'
       +       (d.tag ? '<span class="badge">' + esc(d.tag) + '</span>' : '')
       +     '</div>'
       +     '<div class="dish-desc">' + esc(d.desc) + '</div>'
       +     '<div class="dish-bot">'
       +       '<div class="price"><span class="cur">¥</span><span class="num">' + fmt(d.price) + '</span>'
       +         '<span class="unit">/' + esc(d.unit) + '</span></div>'
       +       '<div class="qty" data-zero="' + (q > 0 ? '0' : '1') + '">'
       +         '<button class="qty-btn qty-minus" data-act="minus" data-id="' + d.id + '">' + MINUS + '</button>'
       +         '<span class="qty-num">' + q + '</span>'
       +         '<button class="qty-btn qty-plus" data-act="plus" data-id="' + d.id + '">' + PLUS + '</button>'
       +       '</div>'
       +     '</div>'
       +   '</div>'
       + '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderDishes(){
  document.getElementById('cdHome').innerHTML = catHTML();
  document.getElementById('cdOrder').innerHTML = catHTML();
}

function renderCartBar(){
  var n = count(), t = subtotal(), f = fee();
  document.getElementById('cartTotal').textContent = fmt(t);
  document.getElementById('cartFee').textContent = f > 0 ? ('含配送费 ¥' + fmt(f)) : '另需配送费 ¥' + fmt(DELIVERY_FEE);
  var badge = document.getElementById('cartBadge');
  badge.textContent = n; badge.classList.toggle('show', n > 0);
  var dot = document.getElementById('tabDot');
  dot.textContent = n; dot.classList.toggle('show', n > 0);
  document.getElementById('cartGo').classList.toggle('dis', n === 0);
}

function renderSheet(){
  var l = cartList();
  var h = '';
  if (!l.length){
    h = '<div class="empty"><div class="empty-t">购物车是空的</div>'
      + '<div class="empty-s">挑几道江南好菜吧</div></div>';
  } else {
    l.forEach(function(it){
      h += '<div class="ci">'
         +   '<div class="ci-pic"><img src="' + it.d._src + '" alt=""></div>'
         +   '<div class="ci-info">'
         +     '<div class="ci-name">' + esc(it.d.name) + '</div>'
         +     '<div class="ci-sub">¥' + fmt(it.d.price) + ' × ' + it.q + '　小计 ¥' + fmt(it.d.price * it.q) + '</div>'
         +   '</div>'
         +   '<div class="ci-right">'
         +     '<div class="qty" data-zero="0">'
         +       '<button class="qty-btn qty-minus" data-act="minus" data-id="' + it.d.id + '">' + MINUS + '</button>'
         +       '<span class="qty-num">' + it.q + '</span>'
         +       '<button class="qty-btn qty-plus" data-act="plus" data-id="' + it.d.id + '">' + PLUS + '</button>'
         +     '</div>'
         +   '</div>'
         + '</div>';
    });
  }
  document.getElementById('sheetBody').innerHTML = h;
}

function renderCheckout(){
  var l = cartList(), h = '';
  l.forEach(function(it){
    h += '<div class="ci">'
       +   '<div class="ci-pic"><img src="' + it.d._src + '" alt=""></div>'
       +   '<div class="ci-info">'
       +     '<div class="ci-name">' + esc(it.d.name) + '</div>'
       +     '<div class="ci-sub">¥' + fmt(it.d.price) + ' × ' + it.q + '</div>'
       +   '</div>'
       +   '<div class="ci-right"><div class="price"><span class="cur">¥</span>'
       +     '<span class="num" style="font-size:15px">' + fmt(it.d.price * it.q) + '</span></div></div>'
       + '</div>';
  });
  document.getElementById('coList').innerHTML = h || '<div style="font-size:12px;color:var(--ink-3);padding:6px 0">暂无菜品</div>';
  var f = fee();
  document.getElementById('coSub').textContent = '¥' + fmt(subtotal());
  document.getElementById('coFee').textContent = f > 0 ? ('¥' + fmt(f)) : '免配送费';
  document.getElementById('coSum').textContent = '¥' + fmt(total());
  document.getElementById('coFootTotal').textContent = '¥' + fmt(total());
  document.getElementById('coFootFee').textContent = f > 0 ? ('含配送费 ¥' + fmt(f)) : '已免配送费';
}

function renderAll(){ renderDishes(); renderCartBar(); renderSheet(); renderCheckout(); }

/* ==================== 交互 ==================== */
function setQty(id, delta){
  var q = (state.cart[id] || 0) + delta;
  if (q <= 0) delete state.cart[id]; else state.cart[id] = q;
  renderAll();
  var ddEl = document.getElementById('ddetail');
  if (ddEl && ddEl.classList.contains('show')) renderDDFoot(id);
}

document.addEventListener('click', function(e){
  // 分类
  var cat = e.target.closest('.cat');
  if (cat){
    state.cat = cat.dataset.cat;
    renderDishes();
    var wrap = cat.closest('.cd-wrap');
    var goods = wrap ? wrap.querySelector('.goods') : null;
    if (goods) goods.scrollIntoView({block:'nearest'});
    return;
  }
  // 加减
  var qbtn = e.target.closest('.qty-btn');
  if (qbtn){
    e.stopPropagation();
    setQty(qbtn.dataset.id, qbtn.dataset.act === 'plus' ? 1 : -1);
    return;
  }
  // 菜品卡片 → 详情弹层
  var dishEl = e.target.closest('.dish');
  if (dishEl && !e.target.closest('.qty')){
    openDetail(dishEl.dataset.dish);
    return;
  }
});

// 底部导航
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
  t.addEventListener('click', function(){
    var v = t.dataset.view;
    if (v === 'cart'){
      if (count() === 0){ renderSheet(); openSheet(); return; }
      renderSheet(); openSheet(); return;
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
    if (v !== 'cart') t.classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){ x.classList.remove('active'); });
    document.getElementById('view-' + v).classList.add('active');
    document.querySelector('.main').scrollTop = 0;
  });
});

// 购物车弹层
var sheet = document.getElementById('sheet'), sheetMask = document.getElementById('sheetMask');
function openSheet(){ renderSheet(); sheet.classList.add('show'); sheetMask.classList.add('show'); }
function closeSheet(){ sheet.classList.remove('show'); sheetMask.classList.remove('show'); }
document.getElementById('cartIco').addEventListener('click', openSheet);
sheetMask.addEventListener('click', closeSheet);

/* 菜品详情弹层 */
var dd = document.getElementById('ddetail'), ddMask = document.getElementById('ddMask');
function dishOf(id){
  for (var i = 0; i < DISHES.length; i++) if (DISHES[i].id === id) return DISHES[i];
  return null;
}
function openDetail(id){
  var d = dishOf(id); if (!d) return;
  document.getElementById('ddBody').innerHTML =
      '<div class="dd-pic"><img src="' + d._src + '" alt="' + esc(d.name) + '"></div>'
    + '<div class="dd-info">'
    +   '<div class="dd-name"><span>' + esc(d.name) + '</span>'
    +     (d.tag ? '<span class="dd-tag">' + esc(d.tag) + '</span>' : '')
    +   '</div>'
    +   '<div class="dd-desc">' + esc(d.desc) + '。</div>'
    +   '<div class="dd-unit">' + esc(d.badge || '江南味道') + ' · ' + esc(d.unit) + '</div>'
    + '</div>';
  renderDDFoot(id);
  dd.classList.add('show'); ddMask.classList.add('show');
}
function renderDDFoot(id){
  var d = dishOf(id); if (!d) return;
  var q = state.cart[id] || 0;
  document.getElementById('ddFoot').innerHTML =
      '<div class="dd-price"><span class="cur">¥</span><span class="num">' + fmt(d.price) + '</span>'
    +   '<span class="unit">/' + esc(d.unit) + '</span></div>'
    + '<div class="qty" data-zero="' + (q > 0 ? '0' : '1') + '">'
    +   '<button class="qty-btn qty-minus" data-act="minus" data-id="' + id + '">' + MINUS + '</button>'
    +   '<span class="qty-num">' + q + '</span>'
    +   '<button class="qty-btn qty-plus" data-act="plus" data-id="' + id + '">' + PLUS + '</button>'
    + '</div>'
    + '<button class="dd-add" data-id="' + id + '">加入购物车</button>';
}
function closeDetail(){ dd.classList.remove('show'); ddMask.classList.remove('show'); }
document.getElementById('ddClose').addEventListener('click', closeDetail);
ddMask.addEventListener('click', closeDetail);
document.getElementById('ddFoot').addEventListener('click', function(e){
  var add = e.target.closest('.dd-add');
  if (add) setQty(add.dataset.id, 1);
});
document.getElementById('clearCart').addEventListener('click', function(){
  state.cart = {};  closeSheet();
});

// 结算
var co = document.getElementById('co');
document.getElementById('cartGo').addEventListener('click', function(){
  if (count() === 0) return;
  renderCheckout(); closeSheet(); co.classList.add('show');
});
document.getElementById('coBack').addEventListener('click', function(){ co.classList.remove('show'); });
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(m){
  m.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(x){ x.classList.remove('on'); });
    m.classList.add('on');
    state.mode = m.dataset.mode;
    renderCartBar(); renderCheckout();
  });
});

// 提交订单
var seq = 0;
document.getElementById('coSubmit').addEventListener('click', function(){
  if (count() === 0) return;
  seq++;
  document.getElementById('doneCode').textContent = 'A' + ('00' + seq).slice(-3);
  state.cart = {};
  
  co.classList.remove('show');
  document.getElementById('done').classList.add('show');
});
document.getElementById('doneBack').addEventListener('click', function(){
  document.getElementById('done').classList.remove('show');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
  document.querySelector('.tab[data-view="order"]').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(x){ x.classList.remove('active'); });
  document.getElementById('view-order').classList.add('active');
  document.querySelector('.main').scrollTop = 0;
});

// 顶部按钮
document.addEventListener('click', function(e){
  var ba = e.target.closest('.ba-btn');
  if (!ba) return;
  if (ba.getAttribute('aria-label') === '更多') alert('更多：店铺介绍 / 联系电话 0571-8888-8888');
  else if (ba.getAttribute('aria-label') === '搜索') alert('搜索菜品 / 分类');
});

/* ============ 商家后台可控的广告位（单张水墨江南） ============ */
var ADS = [
  {id:'a1', img:'jn_assets/banner-art.jpg', pos:'center 18%', t1:'精致中餐 · 品味江南', t2:'新鲜食材｜匠心烹饪｜味美价优', btn:'查看店铺介绍', action:'intro'},
  {id:'a2', img:'jn_assets/pork.jpg', pos:'center 55%', t1:'招牌推荐 · 东坡红烧肉', t2:'肥而不腻 入口即化', btn:'立即查看', action:'dish', dishId:'d1'},
  {id:'a3', img:'jn_assets/bass.jpg', pos:'right 25%', t1:'时令招牌 · 清蒸鲈鱼', t2:'鲜嫩爽滑 清淡健康', btn:'立即查看', action:'dish', dishId:'d3'}
];
var curAd = 0;
function renderBanners(){
  var h = '';
  ADS.forEach(function(a){
    h += '<div class="banner-slide" data-id="' + a.id + '" data-action="' + (a.action||'') + '" data-dish="' + (a.dishId||'') + '" '
       + 'style="background-image:url(' + a.img + ');background-position:' + (a.pos||'center') + ';background-size:' + (a.size||'cover') + '">' 
       + '<div class="banner-slide-txt">'
       + '<div class="banner-t1">' + a.t1 + '</div>'
       + '<div class="banner-t2">' + a.t2 + '</div>'
       + '<button class="banner-btn">' + a.btn + '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"/></svg></button>'
       + '</div></div>';
  });
  document.getElementById('bannerTrack').innerHTML = h;
  // 每张 slide 单独占满 banner（1页展示1张，左右箭头+自动播放切换）
  Array.prototype.forEach.call(document.querySelectorAll('.banner-slide'), function(s){
    s.style.flex = '0 0 100%';
  });
  var dh = '';
  ADS.forEach(function(_, i){
    dh += '<span class="dot' + (i===curAd?' on':'') + '" data-i="' + i + '"></span>';
  });
  document.getElementById('bannerDots').innerHTML = dh;
  updateBannerPos();
}
function updateBannerPos(){
  var t = document.getElementById('bannerTrack');
  t.style.transform = 'translateX(-' + (curAd * 100) + '%)';
  Array.prototype.forEach.call(document.querySelectorAll('#bannerDots .dot'), function(d, i){
    d.classList.toggle('on', i === curAd);
  });
}
function switchAd(delta){
  curAd = (curAd + delta + ADS.length) % ADS.length;
  updateBannerPos();
  resetAuto();
}
/* 自动播放：每 4 秒切下一张，hover/触摸/点击手动切换时重置计时 */
var autoTimer = null;
function startAuto(){
  stopAuto();
  autoTimer = setInterval(function(){ switchAd(1); }, 4000);
}
function stopAuto(){ if (autoTimer){ clearInterval(autoTimer); autoTimer = null; } }
function resetAuto(){ stopAuto(); startAuto(); }
document.getElementById('bannerPrev').addEventListener('click', function(){ switchAd(-1); });
document.getElementById('bannerNext').addEventListener('click', function(){ switchAd(1); });
document.getElementById('bannerDots').addEventListener('click', function(e){
  var d = e.target.closest('.dot'); if (!d) return;
  curAd = parseInt(d.dataset.i, 10);
  updateBannerPos();
  resetAuto();
});
/* hover / 触摸时暂停自动播放 */
document.getElementById('banner').addEventListener('mouseenter', stopAuto);
document.getElementById('banner').addEventListener('mouseleave', startAuto);
document.getElementById('banner').addEventListener('touchstart', stopAuto, {passive:true});
document.getElementById('banner').addEventListener('touchend', startAuto);
document.getElementById('bannerTrack').addEventListener('click', function(e){
  var s = e.target.closest('.banner-slide'); if (!s) return;
  var slides = Array.prototype.slice.call(document.querySelectorAll('.banner-slide'));
  var i = slides.indexOf(s);
  var ad = ADS[i];
  if (!ad) return;
  if (ad.action === 'dish') goToDish(ad.dishId);
  else if (ad.action === 'intro') showIntro();
});
function showIntro(){
  alert('江南食府 · 上城区中山中路 128 号\n营业时间 10:30 - 21:00\nWiFi 全覆盖 · 婴儿座椅可借');
}
function goToDish(dishId){
  var d = dishOf(dishId);
  if (!d) return;
  state.cat = d.cat;
  renderDishes();
  setTimeout(function(){
    var card = document.querySelector('#cdHome .dish[data-dish="' + dishId + '"]');
    if (card) {
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.add('dish-flash');
      setTimeout(function(){ card.classList.remove('dish-flash'); }, 1800);
    }
  }, 100);
}
renderBanners();
startAuto();
renderAll();
</script>
</body>
</html>
